name: Build macOS apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload the .dmg files to
        required: true
        default: v1.0.9
  push:
    tags:
      - "macos-*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.9' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        working-directory: public
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mdforge.txt pywebview pyinstaller

      - name: Build .app bundles
        working-directory: public
        run: python desktop/build_exes.py --clean

      - name: Package .app bundles as DMG
        working-directory: public
        run: |
          mkdir -p artifacts
          for app in dist/*.app; do
            name="$(basename "$app" .app)"
            stage="$(mktemp -d)"
            ditto "$app" "$stage/$name.app"
            ln -s /Applications "$stage/Applications"
            dmg="artifacts/${name}-macOS-${{ matrix.arch }}.dmg"
            # hdiutil occasionally reports "Resource busy" on hosted runners.
            # Retry with a unique volume name and no Spotlight indexing.
            vol="${name:0:16}-${{ matrix.arch }}"
            ok=""
            for attempt in 1 2 3; do
              if hdiutil create -volname "$vol" -srcfolder "$stage" \
                -ov -format UDZO -fs HFS+ -nospotlight "$dmg"; then
                ok="1"
                break
              fi
              echo "hdiutil attempt $attempt failed for $name; retrying"
              sleep 5
            done
            rm -rf "$stage"
            if [ -z "$ok" ]; then
              echo "hdiutil failed for $name"
              exit 1
            fi
          done
          ls -lh artifacts

      - name: Collect framework zips
        working-directory: public
        run: |
          mkdir -p artifacts
          cp dist/OMM-ZEN-Framework-*.zip artifacts/
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omm-zen-macos-${{ matrix.arch }}
          path: public/artifacts/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
