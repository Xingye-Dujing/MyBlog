name: Build macOS apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload the .zip files to
        required: true
        default: v1.0.0
  push:
    tags:
      - "macos-*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        working-directory: public
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mdforge.txt pywebview pyinstaller

      - name: Build .app bundles
        working-directory: public
        run: python desktop/build_exes.py --clean

      - name: Package .app bundles
        working-directory: public
        run: |
          mkdir -p artifacts
          for app in dist/*.app; do
            name="$(basename "$app" .app)"
            ditto -c -k --sequesterRsrc --keepParent \
              "$app" "artifacts/${name}-macOS-${{ matrix.arch }}.zip"
          done
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omm-zen-macos-${{ matrix.arch }}
          path: public/artifacts/*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
