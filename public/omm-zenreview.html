<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>复盘报告</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="zen-style/zen.css">
  <link rel="stylesheet" href="zen-style/product/omm-zenreview.css">
<link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <span class="brand">ZenReview 复盘报告</span>
        <span class="spacer"></span>
        <div class="actions"><button class="btn sm" id="theme-btn">深浅色</button></div>
      </header>
      <main class="narrow">
        <div class="panel">
          <h2>汇总周期</h2>
          <div class="row">
            <label class="field"><span>开始</span><input type="date" id="range-from" /></label>
            <label class="field"><span>结束</span><input type="date" id="range-to" /></label>
          </div>
          <label class="field"><span>标题</span><input id="report-title" value="复盘报告" /></label>
          <label class="field"><span>手写小结（可选）</span><textarea id="report-notes" placeholder="这周学到了什么……"></textarea></label>
          <p class="hint">数据来源：ZenCard / ZenClip 的卡片（localStorage）＋ 下方粘贴的 Hub 时间线与 Planner 记录。</p>
        </div>
        <div class="grid2">
          <div class="panel">
            <h3>Hub 时间线 JSON（可选）</h3>
            <textarea id="tl-json" placeholder='[{"app":"writer","ts":"2026-01-01T09:00:00Z"}]'></textarea>
          </div>
          <div class="panel">
            <h3>Planner 完成项 JSON（可选）</h3>
            <textarea id="pl-json" placeholder='[{"title":"写周报","done":true}]'></textarea>
          </div>
        </div>
        <div class="panel">
          <div class="row tight">
            <button class="btn primary" id="gen-btn">生成报告</button>
            <button class="btn" id="pull-btn">从工作台拉取</button>
            <button class="btn" id="copy-btn">复制 Markdown</button>
            <button class="btn" id="download-btn">下载 .md</button>
            <button class="btn" id="tocards-btn">导出为知识卡片</button>
          </div>
        </div>
        <div class="panel"><h2>报告预览</h2><pre class="code" id="report-out" style="min-height:220px">点击“生成报告”。</pre></div>
      </main>
      <footer class="status"><span><i class="dot"></i>ZenReview · 数据来自本地卡片与时间线</span><span id="status-text"></span></footer>
    </div>
    <div id="toast"></div>
    <script type="module">
      import { ZenCard } from './zen-card.js'
      import { ZenReview } from './zen-review.js'
      const $ = (id) => document.getElementById(id)
      let last = ''
      function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800) }
      function parseArr(id) { try { const v = JSON.parse($(id).value || '[]'); return Array.isArray(v) ? v : [] } catch { return [] } }
      function cards() {
        const out = []
        ;['zen.cards.v1', 'zen.clip.v1'].forEach((k) => { try { out.push(...JSON.parse(localStorage.getItem(k) || '[]')) } catch {} })
        return out.map(ZenCard.create)
      }
      function data() { return { timeline: parseArr('tl-json'), planner: parseArr('pl-json'), cards: cards() } }
      function range() { return { from: $('range-from').value, to: $('range-to').value } }

      /* 从工作台拉取时间线与待办：复用 omm:live-data-request 快照协议（与 AI 工作区
       * 同一条链路）。独立运行或 Hub 未响应时提示用户仍可用下方粘贴框。 */
      let pullToken = ''
      let pullResolve = null
      const hubOrigin = (function () {
        try {
          const raw = new URLSearchParams(location.search).get('omm_hub_origin')
          if (raw) {
            const u = new URL(raw)
            if ((u.protocol === 'http:' || u.protocol === 'https:') &&
                ['127.0.0.1', 'localhost', '[::1]', '::1'].indexOf(u.hostname) >= 0) return u.origin
          }
        } catch (e) { /* ignore */ }
        return location.origin
      })()
      function trustedParent(origin) {
        try {
          const u = new URL(String(origin || ''))
          return (u.protocol === 'http:' || u.protocol === 'https:') &&
            ['127.0.0.1', 'localhost', '[::1]', '::1'].indexOf(u.hostname) >= 0
        } catch (e) { return false }
      }
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || !trustedParent(event.origin)) return
        const d = event.data
        if (d && d.type === 'omm:live-data-reply' && d.token === pullToken && pullResolve) {
          const resolve = pullResolve; pullResolve = null; pullToken = ''
          resolve(d.data || null)
        }
      })
      function pullFromHub() {
        if (window.parent === window) { toast('请在静书房工作台内打开以拉取'); return }
        if (pullResolve) return
        const token = 'review-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6)
        pullToken = token
        const timer = setTimeout(() => {
          if (pullResolve) { pullResolve = null; pullToken = ''; toast('工作台未响应，请手动粘贴') }
        }, 1800)
        pullResolve = (data) => {
          clearTimeout(timer)
          if (!data) { toast('没有可拉取的数据'); return }
          const tl = Array.isArray(data.timeline) ? data.timeline : []
          const pl = Array.isArray(data.planner) ? data.planner : []
          $('tl-json').value = JSON.stringify(tl, null, 2)
          $('pl-json').value = JSON.stringify(pl, null, 2)
          if (!tl.length && !pl.length) toast('工作台暂无时间线/待办数据')
          else toast(`已拉取 ${tl.length} 条动态 · ${pl.length} 项待办`)
        }
        try { window.parent.postMessage({ type: 'omm:live-data-request', token: token }, hubOrigin) }
        catch (e) { pullResolve = null; pullToken = ''; clearTimeout(timer); toast('拉取失败') }
      }

      function bind() {
        $('theme-btn').addEventListener('click', () => { document.body.classList.toggle('theme-dark'); localStorage.setItem('zen.theme', document.body.classList.contains('theme-dark') ? 'dark' : 'light') })
        $('gen-btn').addEventListener('click', () => {
          last = ZenReview.buildReport(data(), { title: $('report-title').value.trim() || '复盘报告', notes: $('report-notes').value, range: range() })
          $('report-out').textContent = last
          const s = ZenReview.summarize(data(), range())
          $('status-text').textContent = `${s.events} 条动态 · ${s.cards} 张卡片 · ${s.done} 项完成`
          toast('报告已生成')
        })
        $('pull-btn').addEventListener('click', pullFromHub)
        $('copy-btn').addEventListener('click', async () => { if (!last) return toast('先生成报告'); try { await navigator.clipboard.writeText(last); toast('已复制') } catch { toast('复制失败') } })
        $('download-btn').addEventListener('click', () => { if (!last) return toast('先生成报告'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([last], { type: 'text/markdown' })); a.download = 'review.md'; a.click(); URL.revokeObjectURL(a.href) })
        $('tocards-btn').addEventListener('click', () => {
          if (!last) return toast('先生成报告')
          const card = ZenCard.create({ source: 'manual', kind: 'note', content: last, note: '复盘报告', tags: ['复盘'] })
          // cards() 是 zen.cards.v1 + zen.clip.v1 的并集（供报告统计用），不能写回
          // 卡片库，否则每次导出都会把剪藏卡片复制进 ZenCard。只追加新报告卡片。
          let list = []
          try { const raw = JSON.parse(localStorage.getItem('zen.cards.v1') || '[]'); if (Array.isArray(raw)) list = raw } catch {}
          list.push(card)
          localStorage.setItem('zen.cards.v1', JSON.stringify(list))
          toast('已存入 ZenCard 卡片库')
        })
      }
      if (localStorage.getItem('zen.theme') === 'dark') document.body.classList.add('theme-dark')
      const today = new Date().toISOString().slice(0, 10)
      $('range-to').value = today
      $('range-from').value = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10)
      bind()
    </script>
  </body>
</html>
