                    }
                    if (kind === 'time' && value && /^\d{2}:\d{2}$/.test(value)) {
                        const p = value.split(':');
                        this.ctx.hh = p[0];
                        this.ctx.mm = p[1];
                    }
                    const pop = document.getElementById('pop-' + kind);
                    pop._sh = null;
                    pop.classList.remove('closing', 'pop-date', 'pop-time');
                    pop.classList.add('open', kind === 'time' ? 'pop-time' : 'pop-date');
                    this.render();
                    placePopup(pop, anchor);
                },
                render() {
                    const c = this.ctx;
                    if (!c) return;
                    const pop = document.getElementById('pop-' + c.kind);
                    pop.innerHTML = c.kind === 'date' ? Picker.dateHTML(c) : Picker.timeHTML(c);
                    pop.querySelectorAll('[data-pick]').forEach(function(b) {
                        b.addEventListener('click', function(ev) {
                            ev.stopPropagation();
                            Picker.onPick(b);
                        });
                    });
                    pop.querySelectorAll('.pk-col').forEach(function(colEl) {
                        const act = colEl.querySelector('.pk-opt.active');
                        if (act && act.scrollIntoView) act.scrollIntoView({ block: 'center' });
                    });
                },
                onPick(b) {
                    const c = this.ctx;
                    if (!c) return;
                    const v = b.dataset.pick;
                    if (v === '@clear') { this.close(); c.cb('', true); return; }
                    if (v === '@nav') {
                        c.m += parseInt(b.dataset.dir, 10);
                        if (c.m < 1) { c.m = 12; c.y--; }
                        if (c.m > 12) { c.m = 1; c.y++; }
                        this.render();
                        return;
                    }
                    if (c.kind === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
                        this.close();
                        c.cb(v, false);
                        return;
                    }
                    if (c.kind === 'time') {
                        if (b.dataset.part === 'h') { c.hh = v; this.render(); return; }
                        c.mm = v;
                        this.close();
                        c.cb(c.hh + ':' + v, false);
                    }
                },
                dateHTML(c) {
                    const wds = t('wd.row').split('|').map(function(w) {
                        return S.lang === 'zh' ? w.charAt(1) : w.charAt(0);
                    });
                    let html = '<div class="pk-head">' +
                        '<div class="pk-nav" data-pick="@nav" data-dir="-1">‹</div>' +
                        '<span class="pk-title">' + c.y + ' / ' + pad(c.m) + '</span>' +
                        '<div class="pk-nav" data-pick="@nav" data-dir="1">›</div></div>';
                    html += '<div class="pk-grid">';
                    weekdayRow().forEach(function(w, i) {
                        html += '<div class="pk-wd">' + esc(wds[i]) + '</div>';
                    });
                    const first = new Date(c.y, c.m - 1, 1);
                    const lead = dowIndex(first);
                    const start = addD(first, -lead);
                    const tds = todayDS();
                    for (let i = 0; i < 42; i++) {
                        const d = addD(start, i);
                        const ds = fmt(d);
                        const cls = ['pk-day'];
                        if (d.getMonth() + 1 !== c.m) cls.push('other');
                        if (ds === tds) cls.push('today');
                        if (ds === c.value) cls.push('sel');
                        html += '<div class="' + cls.join(' ') + '" data-pick="' + ds + '">' + d.getDate() + '</div>';
                    }
                    html += '</div>';
                    return html;
                },
                timeHTML(c) {
                    let hours = '', minutes = '';
                    for (let h = 0; h < 24; h++) {
                        const hv = pad(h);
                        hours += '<div class="pk-opt' + (hv === c.hh ? ' active' : '') +
                            '" data-pick="' + hv + '" data-part="h">' + hv + '</div>';
                    }
                    for (let m = 0; m < 60; m++) {
                        const mv = pad(m);
                        minutes += '<div class="pk-opt' + (mv === c.mm ? ' active' : '') +
                            '" data-pick="' + mv + '" data-part="m">' + mv + '</div>';
                    }
                    return '<div class="pk-cols">' +
                        '<div class="pk-colwrap"><div class="pk-lab">' + esc(t('picker.hour')) + '</div>' +
                        '<div class="pk-col">' + hours + '</div></div>' +
                        '<div class="pk-colwrap"><div class="pk-lab">' + esc(t('picker.minute')) + '</div>' +
                        '<div class="pk-col">' + minutes + '</div></div></div>' +
                        '<div class="pk-clear" data-pick="@clear">' + esc(t('picker.clear')) + '</div>';
                },
                close() {
                    document.querySelectorAll('.picker-pop.open').forEach(function(p) {
                        softHide(p);
                    });
                    this.ctx = null;
                }
            };

            // ================================================================
            // 8. RENDERER
            // ================================================================
            const Render = {
                all() {
                    Picker.close();
                    Render.header();
                    Render.status();
                    const cal = DOM.calendar;
                    cal.innerHTML = '';
                    cal.className = '';
                    if (S.view === 'month') cal.appendChild(Render.month());
                    else if (S.view === 'week') cal.appendChild(Render.week());
                    else if (S.view === 'focus') cal.appendChild(Render.focus());
                    else cal.appendChild(Render.list());
                    if (S.multiSel.length && !S.focusMode) {
                        DOM.calendar.querySelectorAll('.cell,.wcol').forEach(function(z) {
                            z.classList.toggle('msel', S.multiSel.indexOf(z.dataset.date) >= 0);
                        });
                    }
                    UIMgr.syncFocusUI();
                    syncViewButtons();
                    requestAnimationFrame(function() {
                        const el = DOM.calendar.querySelector('.sel');
                        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
                    });
                },
                header() {
                    const c = S.cursor;
                    const months = t('months').split('|');
                    if (S.view === 'week') {
                        const s0 = startOfWeek(c);
                        const e6 = addD(s0, 6);
                        DOM.chTitle.textContent = t('week.range', s0.getMonth() + 1, s0.getDate(), e6.getMonth() + 1, e6.getDate());
                        DOM.chSub.textContent = c.getFullYear();
                    } else {
                        DOM.chTitle.textContent = S.lang === 'zh'
                            ? t('title.month', c.getFullYear(), c.getMonth() + 1)
                            : months[c.getMonth()] + ' ' + c.getFullYear();
                        const lun = solarToLunar(c.getFullYear(), c.getMonth() + 1, 1);
                        DOM.chSub.textContent = lun ? t('sub.lunar', gzYear(lun.y), animalYear(lun.y)) : '';
                    }
                    if (S.focusMode && S.multiSel.length) {
                        const days = S.multiSel.slice().sort();
                        DOM.chTitle.textContent = t('focus.title');
                        DOM.chSub.textContent = days.length === 1
                            ? days[0]
                            : t('focus.days', days.length) + ' · ' +
                                t('focus.range', days[0].slice(5), days[days.length - 1].slice(5));
                    }
                    DOM.gotoDate.textContent = fmt(S.cursor);
                    const y = c.getFullYear(), m = c.getMonth() + 1;
                    let total = 0, todos = 0, done = 0;
                    Object.keys(Store.events).forEach(function(ds) {
                        if (+ds.slice(0, 4) === y && +ds.slice(5, 7) === m) {
                            const cc = Store.counts(ds);
                            total += cc.total;
                            todos += cc.todos;
                            done += cc.done;
                        }
                    });
                    let html = '<span>' + esc(t('stats.items')) + ' <b>' + total + '</b></span>';
                    if (todos > 0) {
                        html += '<span>' + esc(t('stats.rate')) + ' <b>' + Math.round(done / todos * 100) + '%</b></span>';
                    }
                    DOM.chRight.innerHTML = html;
                },
                status() {
                    const now = new Date();
                    const info = dayInfo(fmt(now));
                    const wdn = t('wd.row').split('|');
                    const wk = wdn[(now.getDay() + 6) % 7];
                    const c = Store.counts(fmt(now));
                    let left = S.lang === 'zh'
                        ? (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + wk
                        : wk + ' ' + (now.getMonth() + 1) + '/' + now.getDate();
                    if (info.tag) left += ' · ' + info.tag;
                    left += ' · ' + (c.todos > 0
                        ? t('status.todayItems', c.done, c.todos)
                        : t('status.noneToday'));
                    const st = Store.streak();
                    if (st > 0) left += ' · ' + t('status.streak', st);
                    DOM.statLeft.textContent = left;
                },
                visibleList(ds) {
                    const arr = Store.sorted(ds);
                    if (!S.hideDone) return arr;
                    return arr.filter(function(e) { return !(e.type === 'todo' && e.done); });
                },
                chipHTML(ds, ev, expanded) {
                    const cls = ev.type === 'todo' && ev.done ? ' done' : '';
                    const left = ev.type === 'todo'
                        ? '<span class="tbox' + (ev.done ? ' checked' : '') + '" data-action="toggle">' + (ev.done ? '✓' : '') + '</span>'
                        : '<span class="tdot"></span>';
                    const time = ev.time ? '<span class="chip-time">' + esc(ev.time) + '</span>' : '';
                    const note = expanded && ev.note ? '<span class="chip-note">' + esc(ev.note) + '</span>' : '';
                    return '<div class="chip' + cls + '" draggable="true" data-date="' + ds + '" data-id="' + ev.id +
                        '" style="--c:' + ev.color + '">' + left + time +
                        '<span class="chip-title">' + esc(ev.title) + '</span>' + note + '</div>';
                },
                month() {
                    const pref = S.cursor.getFullYear() + '-' + pad(S.cursor.getMonth() + 1);
                    if (!S.selDate || S.selDate.slice(0, 7) !== pref) {
                        const tds = todayDS();
                        S.selDate = tds.slice(0, 7) === pref ? tds : fmt(S.cursor);
                        S.lastSelDs = S.selDate;
                    }
                    const wrap = document.createElement('div');
                    wrap.className = 'v-month';
                    let whtml = '<div class="weekdays" style="grid-template-columns:repeat(7,1fr)">';
                    weekdayRow().forEach(function(w) {
                        whtml += '<div class="wd' + (w.wkend ? ' wkend' : '') + '">' + esc(w.name) + '</div>';
                    });
                    whtml += '</div>';
                    wrap.innerHTML = whtml;
                    const mat = monthMatrix(S.cursor.getFullYear(), S.cursor.getMonth() + 1);
                    const grid = document.createElement('div');
                    grid.className = 'mgrid';
                    grid.style.gridTemplateRows = 'repeat(' + mat.weeks + ',minmax(0,1fr))';
                    const tds = todayDS();
                    let html = '';
                    mat.cells.forEach(function(d) {
                        const ds = fmt(d);
                        const isToday = ds === tds;
                        const isOther = d.getMonth() !== S.cursor.getMonth();
                        const info = dayInfo(ds);
                        const subCls = info.tagType === 'fest' ? ' fest' : info.tagType === 'term' ? ' term' : '';
                        const subTxt = info.tag || info.lunarText;
                        const cc = Store.counts(ds);
                        const frac = cc.todos > 0 ? '<span class="todo-frac">' + cc.done + '/' + cc.todos + '</span>' : '';
                        const items = Render.visibleList(ds);
                        let chips = '';
                        items.forEach(function(ev) { chips += Render.chipHTML(ds, ev, false); });
                        if (!items.length) chips = '<div class="empty-hint">' + esc(t('view.emptyDay')) + '</div>';
                        html += '<div class="cell' + (isOther ? ' other' : '') + (isToday ? ' today' : '') +
                            (S.selDate === ds ? ' sel' : '') + '" data-date="' + ds + '">' +
                            '<div class="cell-head"><span class="d-num">' + d.getDate() + '</span>' +
                            '<span class="d-sub' + subCls + '">' + esc(subTxt) + '</span>' + frac + '</div>' +
                            '<div class="cell-items">' + chips + '</div>' +
                            '<div class="cell-add" data-action="quickadd" title="+">+</div>' +
                            '</div>';
                    });
                    grid.innerHTML = html;
                    wrap.appendChild(grid);
                    return wrap;
                },
                week() {
                    const wrap = document.createElement('div');
                    wrap.className = 'v-week';
                    const s0 = startOfWeek(S.cursor);
                    const wStart = fmt(s0), wEnd = fmt(addD(s0, 6));
                    if (!S.selDate || S.selDate < wStart || S.selDate > wEnd) {
                        const tds = todayDS();
                        S.selDate = (tds >= wStart && tds <= wEnd) ? tds : fmt(S.cursor);
                        S.lastSelDs = S.selDate;
                    }
                    const tds = todayDS();
                    const wds = weekdayRow();
                    let html = '';
                    for (let i = 0; i < 7; i++) {
                        const d = addD(s0, i);
                        const ds = fmt(d);
                        const isToday = ds === tds;
                        const info = dayInfo(ds);
                        const lunCls = info.tagType === 'fest' ? ' fest' : info.tagType === 'term' ? ' term' : '';
                        const lunTxt = info.tag || info.lunarText;
                        const realDow = d.getDay();
                        const items = Render.visibleList(ds);
                        let chips = '';
                        items.forEach(function(ev) { chips += Render.chipHTML(ds, ev, true); });
                        if (!items.length) chips = '<div class="empty-hint">' + esc(t('view.emptyDay')) + '</div>';
                        html += '<div class="wcol' + (isToday ? ' today' : '') +
                            ((realDow === 0 || realDow === 6) ? ' wkend' : '') +
                            (S.selDate === ds ? ' sel' : '') + '" data-date="' + ds + '">' +
                            '<div class="wcol-head"><span class="wc-dow">' + esc(wds[dowIndex(d)].name) + '</span>' +
                            '<span class="wc-num">' + d.getDate() + '</span>' +
                            '<span class="wc-lunar' + lunCls + '">' + esc(lunTxt) + '</span>' +
                            '<div class="wcol-add" data-action="quickadd" title="+">+</div></div>' +
                            '<div class="wcol-items">' + chips + '</div></div>';
                    }
                    wrap.innerHTML = html;
                    return wrap;
                },
                list() {
                    const wrap = document.createElement('div');
                    wrap.className = 'v-list';
                    const y = S.cursor.getFullYear(), m = S.cursor.getMonth() + 1;
                    const dim = new Date(y, m, 0).getDate();
                    const tds = todayDS();
                    const wdn = t('wd.row').split('|');
                    let html = '';
                    let any = false;
                    for (let dd = 1; dd <= dim; dd++) {
                        const ds = y + '-' + pad(m) + '-' + pad(dd);
                        const items = Render.visibleList(ds);
                        const isToday = ds === tds;
                        if (!items.length && !isToday) continue;
                        any = true;
                        const d = pd(ds);
                        const info = dayInfo(ds);
                        const lunCls = info.tagType === 'fest' ? ' fest' : info.tagType === 'term' ? ' term' : '';
                        const lunParts = [];
                        if (info.lunarText) lunParts.push(info.lunarText);
                        if (info.tag && info.tag !== info.lunarText) lunParts.push(info.tag);
                        let rows = '';
                        items.forEach(function(ev) {
                            const cls = ev.type === 'todo' && ev.done ? ' done' : '';
                            const left = ev.type === 'todo'
                                ? '<span class="tbox' + (ev.done ? ' checked' : '') + '">' + (ev.done ? '✓' : '') + '</span>'
                                : '<span class="tdot"></span>';
                            const time = ev.time ? '<span class="chip-time">' + esc(ev.time) + '</span>' : '';
                            rows += '<div class="ag-item' + cls + '" style="--c:' + ev.color + '">' +
                                left + time +
                                '<div class="ag-main"><span class="ag-title">' + esc(ev.title) + '</span>' +
                                (ev.note ? '<span class="ag-note">' + esc(ev.note) + '</span>' : '') + '</div></div>';
                        });
                        if (!items.length) rows = '<div class="empty-hint">' + esc(t('view.emptyDay')) + '</div>';
                        html += '<div class="ag-day' + (isToday ? '' : ' dim') + '" data-date="' + ds + '">' +
                            '<div class="ag-head"><span class="ag-date">' + m + '.' + pad(dd) + '</span>' +
                            '<span class="ag-wk">' + esc(wdn[(d.getDay() + 6) % 7]) + '</span>' +
                            (isToday ? '<span class="today-tag">' + esc(t('menu.today').replace(/[\[\]]/g, '')) + '</span>' : '') +
                            '<span class="ag-lunar' + lunCls + '">' + esc(lunParts.join(' · ')) + '</span></div>' +
                            rows + '</div>';
                    }
                    if (!any) html = '<div class="list-placeholder">' + esc(t('view.emptyMonth')) + '</div>';
                    wrap.innerHTML = html;
                    return wrap;
                },
                focus() {
                    const wrap = document.createElement('div');
                    wrap.className = 'v-focus';
                    const days = S.multiSel.slice().sort();
                    if (!days.length) {
                        wrap.innerHTML = '<div class="list-placeholder">' + esc(t('view.emptyMonth')) + '</div>';
                        return wrap;
                    }
                    const wdn = t('wd.row').split('|');
                    const n = days.length;
                    const rows = Math.max(1, Math.min(6, Math.ceil(Math.sqrt(n))));
                    const base = Math.floor(n / rows);
                    const extra = n % rows;
                    const tds = todayDS();
                    function cardHTML(ds) {
                        const d = pd(ds);
                        const info = dayInfo(ds);
                        const lunCls = info.tagType === 'fest' ? ' fest' : info.tagType === 'term' ? ' term' : '';
                        const lunTxt = info.tag || info.lunarText;
                        const items = Render.visibleList(ds);
                        let chips = '';
                        items.forEach(function(ev) { chips += Render.chipHTML(ds, ev, true); });
                        if (!items.length) chips = '<div class="empty-hint">' + esc(t('view.emptyDay')) + '</div>';
                        return '<div class="fcard' + (ds === tds ? ' today' : '') + '" data-date="' + ds + '">' +
                            '<div class="fcard-head">' +
                            '<span class="fc-num">' + (d.getMonth() + 1) + '.' + pad(d.getDate()) + '</span>' +
                            '<span class="wc-dow">' + esc(wdn[(d.getDay() + 6) % 7]) + '</span>' +
                            '<span class="wc-lunar' + lunCls + '">' + esc(lunTxt) + '</span></div>' +
                            '<div class="fcard-items">' + chips + '</div></div>';
                    }
                    let html = '';
                    let idx = 0;
                    for (let r = 0; r < rows; r++) {
                        const size = base + (r < extra ? 1 : 0);
                        if (size <= 0) break;
                        html += '<div class="frow" style="grid-template-columns:repeat(' + size + ',1fr)">';
                        for (let k = 0; k < size; k++) html += cardHTML(days[idx++]);
                        html += '</div>';
                    }
                    wrap.innerHTML = html;
                    return wrap;
                },
                flashCell(ds) {
                    const el = DOM.calendar.querySelector('.cell[data-date="' + ds + '"]');
                    if (!el) return;
                    el.classList.add('flash');
                    el.scrollIntoView({ block: 'nearest' });
                }
            };

            // ================================================================
            // 9. EDITOR
            // ================================================================
            let ED_GUARD = false;
            let edGuardTimer = null;
            let edSwapTimer = null;
            const Editor = {
                open(opts) {
                    opts = opts || {};
                    S.editing = opts.id ? { date: opts.date, id: opts.id } : null;
                    S.edAnchor = opts.anchor || null;
                    let ev = { type: opts.type || S.lastType || 'todo', title: '', note: '', time: '', color: '#888888' };
                    if (S.editing) {
                        const found = Store.find(S.editing.date, S.editing.id);
                        if (found) ev = found;
                    }
                    DOM.edMode.textContent = S.editing ? t('ed.modeEdit') : t('ed.modeNew');
                    S.edDateVal = opts.date || todayDS();
                    S.edTimeVal = ev.time || '';
                    DOM.edDate.textContent = S.edDateVal;
                    DOM.edTime.textContent = S.edTimeVal || '--:--';
                    DOM.edSeg.querySelectorAll('button').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.t === ev.type);
                    });
                    DOM.edTitle.value = ev.title || '';
                    DOM.edNote.value = ev.note || '';
                    DOM.edColors.querySelectorAll('.ft-color-dot').forEach(function(dotEl) {
                        dotEl.classList.toggle('active', dotEl.dataset.color === ev.color);
                    });
                    Editor.syncTimeRow(ev.type);
                    DOM.edDelete.classList.toggle('hidden', !S.editing);
                    const pop = DOM.editor;
                    pop._sh = null;
                    ED_GUARD = true;
                    clearTimeout(edGuardTimer);
                    edGuardTimer = setTimeout(function() { ED_GUARD = false; }, 80);
                    clearTimeout(edSwapTimer);
                    const wasOpen = pop.classList.contains('open');
                    if (wasOpen) {
                        pop.classList.add('closing');
                        edSwapTimer = setTimeout(function() {
                            placePopup(pop, S.edAnchor);
                            pop.classList.remove('open', 'closing');
                            void pop.offsetWidth;
                            pop.classList.add('open');
                            setTimeout(function() { DOM.edTitle.focus(); }, 120);
                        }, 150);
                    } else {
                        pop.classList.remove('closing');
                        pop.classList.add('open');
                        requestAnimationFrame(function() { placePopup(pop, S.edAnchor); });
                        setTimeout(function() { DOM.edTitle.focus(); }, 180);
                    }
                },
                close() {
                    Picker.close();
                    softHide(DOM.editor);
                    S.editing = null;
                },
                currentType() {
                    const act = DOM.edSeg.querySelector('button.active');
                    return act ? act.dataset.t : 'todo';
                },
                currentColor() {
                    const act = DOM.edColors.querySelector('.ft-color-dot.active');
                    return act ? act.dataset.color : '#888888';
                },
                syncTimeRow(type) {
                    DOM.edTimeRow.style.display = type === 'note' ? 'none' : '';
                },
                save() {
                    const newDS = S.edDateVal;
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(newDS || '')) return;
                    const type = Editor.currentType();
                    const title = DOM.edTitle.value.trim() ||
                        (type === 'todo' ? t('type.todo') : type === 'event' ? t('type.event') : t('type.note'));
                    const old = S.editing ? Store.find(S.editing.date, S.editing.id) : null;
                    const obj = {
                        id: old ? old.id : uid(),
                        type: type,
                        title: title,
                        note: DOM.edNote.value.trim(),
                        time: S.edTimeVal || '',
                        color: Editor.currentColor(),
                        created: old ? (old.created || Date.now()) : Date.now(),
                        done: old ? !!old.done : false
                    };
                    if (S.editing) Store.removeAt(S.editing.date, S.editing.id);
                    Store.add(newDS, obj);
                    S.lastType = type;
                    Editor.close();
                    Settings.save();
                    Render.all();
                    notify(t('notify.saved'));
                },
                remove() {
                    if (!S.editing) return;
                    const ds = S.editing.date, id = S.editing.id;
                    showConfirm(t('confirm.delEvent'), t('btn.delete')).then(function(ok) {
                        if (!ok) return;
                        Store.removeAt(ds, id);
                        Editor.close();
                        Render.all();
                        notify(t('notify.deleted'));
                    });
                },
                toggle(ds, id) {
                    const ev = Store.find(ds, id);
                    if (!ev || ev.type !== 'todo') return;
                    ev.done = !ev.done;
                    Store.persist();
                    Render.all();
                }
            };

            // ================================================================
            // 10. NAVIGATION & VIEW OPTIONS
            // ================================================================
            function syncViewButtons() {
                const map = { month: 'btn-month', week: 'btn-week', list: 'btn-list' };
                const cur = map[S.focusMode ? S.savedView : S.view];
                ['btn-month', 'btn-week', 'btn-list'].forEach(function(id) {
                    const el = document.getElementById(id);
                    if (el) el.classList.toggle('active', id === cur);
                });
            }

            const Nav = {
                go(delta) {
                    const c = S.cursor;
                    S.cursor = S.view === 'week'
                        ? addD(c, delta * 7)
                        : new Date(c.getFullYear(), c.getMonth() + delta, 1);
                    Picker.close();
                    Focus.reset(false);
                    Settings.save();
                    syncViewButtons();
                    swapView(function() { Render.all(); }, delta > 0 ? 'next' : 'prev');
                },
                today() {
                    Picker.close();
                    Focus.reset(true);
                    S.cursor = new Date();
                    S.selDate = todayDS();
                    S.lastSelDs = S.selDate;
                    Settings.save();
                    swapView(function() { Render.all(); }, 'forward');
                },
                goTo(ds) {
                    const c = S.cursor;
                    const d = pd(ds);
                    let anim = 'forward';
                    if (S.view === 'week') {
                        const diff = Math.round((startOfWeek(d) - startOfWeek(c)) / 604800000);
                        anim = diff > 0 ? 'next' : diff < 0 ? 'prev' : 'forward';
                    } else {
                        const a = d.getFullYear() * 12 + d.getMonth();
                        const b = c.getFullYear() * 12 + c.getMonth();
                        anim = a > b ? 'next' : a < b ? 'prev' : 'forward';
                    }
                    Picker.close();
                    Focus.reset(false);
                    S.cursor = d;
                    S.selDate = ds;
                    S.lastSelDs = ds;
                    Settings.save();
                    swapView(function() {
                        Render.all();
                        if (S.view === 'month') setTimeout(function() { Render.flashCell(ds); }, 90);
                    }, anim);
                },
                setView(v) {
                    if (v === (S.focusMode ? S.savedView : S.view)) return;
                    Picker.close();
                    Focus.reset(false);
                    S.view = v;
                    Settings.save();
                    syncViewButtons();
                    swapView(function() { Render.all(); }, 'back');
                },
                cycle(dir) {
                    const order = ['month', 'week', 'list'];
                    const cur = S.focusMode ? S.savedView : S.view;
                    let i = order.indexOf(cur);
                    i = (i + dir + order.length) % order.length;
                    Nav.setView(order[i]);
                }
            };

            function moveSel(dc, dr) {
                if (S.view === 'list') return;
                if (!S.selDate && !S.lastSelDs) S.lastSelDs = todayDS();
                const cur = pd(S.selDate || S.lastSelDs);
                const step = dc + dr * 7;
                if (S.focusMode) Focus.exit();

                if (dc !== 0 && S.view === 'month') {
                    const mat = monthMatrix(S.cursor.getFullYear(), S.cursor.getMonth() + 1);
                    const first = new Date(S.cursor.getFullYear(), S.cursor.getMonth(), 1);
                    let idx = -1;
                    for (let i = 0; i < mat.cells.length; i++) {
                        if (fmt(mat.cells[i]) === fmt(cur)) { idx = i; break; }
                    }
                    if (idx < 0) {
                        idx = dowIndex(first) + Math.round((cur - first) / 86400000);
                    }
                    const row = Math.floor(idx / 7);
                    const col = idx % 7;
                    if ((dc < 0 && col === 0) || (dc > 0 && col === 6)) {
                        const dir = dc > 0 ? 1 : -1;
                        const nm = new Date(S.cursor.getFullYear(), S.cursor.getMonth() + dir, 1);
                        const nmat = monthMatrix(nm.getFullYear(), nm.getMonth() + 1);
                        const nr = Math.min(row, nmat.weeks - 1);
                        const target = nmat.cells[nr * 7 + (dc > 0 ? 0 : 6)];
                        Nav.go(dir);
                        S.selDate = fmt(target);
                        S.lastSelDs = S.selDate;
                        return;
                    }
                } else if (dc !== 0 && S.view === 'week') {
                    const cpos = dowIndex(cur);
                    if ((dc < 0 && cpos === 0) || (dc > 0 && cpos === 6)) {
                        const target = addD(startOfWeek(S.cursor), dc > 0 ? 7 : -1);
                        Nav.go(dc);
                        S.selDate = fmt(target);
                        S.lastSelDs = S.selDate;
                        return;
                    }
                }

                const d = addD(cur, step);
                const nd = fmt(d);
                if (S.view === 'month') {
                    if (!DOM.calendar.querySelector('.cell[data-date="' + nd + '"]')) Nav.go(step > 0 ? 1 : -1);
                } else if (S.view === 'week') {
                    if (fmt(startOfWeek(S.cursor)) !== fmt(startOfWeek(d))) Nav.go(step > 0 ? 1 : -1);
                } else {
                    if (d.getMonth() !== S.cursor.getMonth()) Nav.go(step > 0 ? 1 : -1);
                }
                S.selDate = nd;
                S.lastSelDs = nd;
                requestAnimationFrame(function() {
                    const el = DOM.calendar.querySelector(
                        '.cell[data-date="' + nd + '"],.wcol[data-date="' + nd + '"]');
                    if (!el) return;
                    const prev = DOM.calendar.querySelector('.sel');
                    if (prev) prev.classList.remove('sel');
                    el.classList.add('sel');
                    el.scrollIntoView({ block: 'nearest' });
                });
            }

            const SWAP_ANIMS = {
                forward: ['sw-out', 'sw-in'],
                back: ['sw-back-out', 'sw-back-in'],
                next: ['sl-out-l', 'sl-in-r'],
                prev: ['sl-out-r', 'sl-in-l']
            };

            function swapView(build, anim) {
                const cal = DOM.calendar;
                const pair = SWAP_ANIMS[anim] || SWAP_ANIMS.forward;
                if (S.swapping) { build(); return; }
                S.swapping = true;
                cal.style.transformOrigin = anim === 'forward' ? (S.focusOrigin || 'center center') : 'center center';
                cal.classList.add(pair[0]);
                setTimeout(function() {
                    build();
                    cal.classList.remove(pair[0]);
                    void cal.offsetWidth;
                    cal.classList.add(pair[1]);
                    setTimeout(function() {
                        cal.classList.remove(pair[1]);
                        cal.style.transformOrigin = '';
                        S.swapping = false;
                    }, 310);
                }, 170);
            }

            let SH_TOKEN = 0;
            function softHide(el) {
                if (!el || !el.classList.contains('open')) return;
                const my = ++SH_TOKEN;
                el._sh = my;
                el.classList.add('closing');
                setTimeout(function() {
                    if (el._sh === my) el.classList.remove('open', 'closing');
                }, 150);
            }

            // ================================================================
            // 10.5 FOCUS MODE (multi-select days)
            // ================================================================
            const Focus = {
                reset(keepSel) {
                    if (S.focusMode) {
                        S.focusMode = false;
                        S.multiSel.length = 0;
                        S.view = S.savedView || 'month';
                    } else if (!keepSel) {
                        S.multiSel.length = 0;
                    }
                    UIMgr.syncFocusUI();
                },
                toggleDay(ds, e) {
                    if (e && e.shiftKey && S.lastSelDs) {
                        const a = S.lastSelDs < ds ? S.lastSelDs : ds;
                        const b = S.lastSelDs < ds ? ds : S.lastSelDs;
                        let cur = pd(a);
                        const end = pd(b);
                        while (fmt(cur) <= fmt(end)) {
                            const k = fmt(cur);
                            if (S.multiSel.indexOf(k) < 0) S.multiSel.push(k);
                            cur = addD(cur, 1);
                        }
                    } else {
                        const i = S.multiSel.indexOf(ds);
                        if (i >= 0) S.multiSel.splice(i, 1);
                        else S.multiSel.push(ds);
                    }
                    if (S.multiSel.length > 31) S.multiSel.length = 31;
                    S.lastSelDs = ds;
                    Focus.paint();
                },
                paint() {
                    DOM.calendar.querySelectorAll('[data-date]').forEach(function(z) {
                        if (!z.classList.contains('cell') && !z.classList.contains('wcol')) return;
                        z.classList.toggle('msel', S.multiSel.indexOf(z.dataset.date) >= 0);
                    });
                    UIMgr.syncFocusUI();
                },
                clear() {
                    S.multiSel.length = 0;
                    Focus.paint();
                },
                single() {
                    if (S.focusMode) { Focus.exit(); return; }
                    const ds = S.selDate || S.lastSelDs || todayDS();
                    S.savedView = S.view;
                    S.multiSel.length = 0;
                    S.multiSel.push(ds);
                    S.lastSelDs = ds;
                    Focus.enter();
                    Focus.paint();
                },
                origin() {
                    const zone = document.getElementById('main').getBoundingClientRect();
                    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
                    S.multiSel.forEach(function(ds) {
                        const el = DOM.calendar.querySelector('[data-date="' + ds + '"]');
                        if (!el) return;
                        const r = el.getBoundingClientRect();
                        if (r.left < x0) x0 = r.left;
                        if (r.top < y0) y0 = r.top;
                        if (r.right > x1) x1 = r.right;
                        if (r.bottom > y1) y1 = r.bottom;
                    });
                    if (x0 === Infinity) return 'center center';
                    return Math.round((x0 + x1) / 2 - zone.left) + 'px ' +
                        Math.round(Math.max(0, (y0 + y1) / 2 - zone.top)) + 'px';
                },
                enter() {
                    if (!S.multiSel.length || S.focusMode) return;
                    S.savedView = S.view === 'focus' ? S.savedView : S.view;
                    S.focusOrigin = Focus.origin();
                    S.focusMode = true;
                    swapView(function() {
                        S.view = 'focus';
                        Render.all();
                    }, 'forward');
                },
                exit() {
                    if (!S.focusMode) return;
                    S.focusMode = false;
                    S.focusOrigin = 'center center';
                    const v = S.savedView || 'month';
                    swapView(function() {
                        S.multiSel.length = 0;
                        S.view = v;
                        Render.all();
                    }, 'back');
                }
            };

            function changeZoom(delta) {
                S.zoom = Math.round(Math.min(CONFIG.MAX_ZOOM,
                    Math.max(CONFIG.MIN_ZOOM, +(S.zoom + delta).toFixed(2))) * 100) / 100;
                document.documentElement.style.setProperty('--zoom', S.zoom);
                UIMgr.updateSettingsUI();
                Settings.save();
                notify(t('notify.zoom', Math.round(S.zoom * 100)));
            }

            function changeRadius(delta) {
                S.radius = Math.min(12, Math.max(0, S.radius + delta));
                document.documentElement.style.setProperty('--radius', S.radius + 'px');
                UIMgr.updateSettingsUI();
                Settings.save();
                notify(t('notify.radius', S.radius));
            }

            // ================================================================
            // 11. SEARCH
            // ================================================================
            const SearchMgr = {
                open(btn) {
                    UIMgr.showDropdown('dd-search', btn);
                    DOM.searchInput.value = '';
                    SearchMgr.render('');
                    setTimeout(function() { DOM.searchInput.focus(); }, 50);
                },
                render(q) {
                    q = (q || '').trim().toLowerCase();
                    if (!q) {
                        DOM.searchResults.innerHTML = '<div class="sr-empty">' + esc(t('search.placeholder')) + '</div>';
                        return;
                    }
                    const res = [];
                    Object.keys(Store.events).sort().forEach(function(ds) {
                        Store.sorted(ds).forEach(function(ev) {
                            const hay = (ev.title + ' ' + (ev.note || '')).toLowerCase();
                            if (hay.indexOf(q) >= 0 && res.length < 40) res.push({ ds: ds, ev: ev });
                        });
                    });
                    if (!res.length) {
                        DOM.searchResults.innerHTML = '<div class="sr-empty">' + esc(t('search.empty')) + '</div>';
                        return;
                    }
                    const typeName = { todo: t('type.todo'), event: t('type.event'), note: t('type.note') };
                    let html = '';
                    res.forEach(function(r) {
                        html += '<div class="sr-item" data-date="' + r.ds + '" data-id="' + r.ev.id + '">' +
                            '<span class="sr-date">' + r.ds.slice(5) + '</span>' +
                            '<span class="sr-dot" style="--c:' + r.ev.color + '"></span>' +
                            '<span class="sr-title">' + esc(r.ev.title) + '</span>' +
                            '<span class="sr-type">' + esc(typeName[r.ev.type] || '') + '</span></div>';
                    });
                    DOM.searchResults.innerHTML = html;
                },
                pick(ds, id) {

                    setTimeout(function() { Editor.open({ date: ds, id: id }); }, 150);
                }
            };

            // ================================================================
            // 12. STATS & HELP MODALS
            // ================================================================
            const StatsMgr = {
                show() {
                    const y = S.cursor.getFullYear(), m = S.cursor.getMonth() + 1;
                    const dim = new Date(y, m, 0).getDate();
                    let total = 0, todos = 0, done = 0, events = 0, notes = 0;
                    let busiest = '', busiestN = 0;
                    for (let dd = 1; dd <= dim; dd++) {
                        const ds = y + '-' + pad(m) + '-' + pad(dd);
                        const cc = Store.counts(ds);
                        total += cc.total;
                        todos += cc.todos;
                        done += cc.done;
                        Store.day(ds).forEach(function(e) {
                            if (e.type === 'event') events++;
                            if (e.type === 'note') notes++;
                        });
                        if (Store.day(ds).length > busiestN) { busiestN = Store.day(ds).length; busiest = ds; }
                    }
                    const rate = todos > 0 ? Math.round(done / todos * 100) + '%' : t('stats.none');
                    const busiestTxt = busiest ? busiest.slice(5).replace('-', '.') + ' (' + busiestN + ')' : t('stats.none');
                    let html = StatsMgr.row(t('stats.items'), total);
                    html += StatsMgr.row(t('stats.todos'), done + '/' + todos);
                    html += StatsMgr.row(t('stats.rate'), rate);
                    html += StatsMgr.row(t('stats.events'), events);
                    html += StatsMgr.row(t('stats.notes'), notes);
                    html += StatsMgr.row(t('stats.busiest'), busiestTxt);
                    html += StatsMgr.row(t('stats.streak'), t('stats.days', Store.streak()));
                    UIMgr.showModal(t('stats.title'), html);
                },
                row(label, value) {
                    return '<div class="st-row"><span>' + esc(label) + '</span><b>' + esc(value) + '</b></div>';
                },
                showHelp() {
                    const pairs = t('hk.rows').split('|');
                    let html = '<div class="hk-grid">';
                    for (let i = 0; i + 1 < pairs.length; i += 2) {
                        html += '<div class="hk-row"><span>' + esc(pairs[i]) + '</span><span class="hk-key">' +
                            esc(pairs[i + 1]) + '</span></div>';
                    }
                    html += '</div>';
                    UIMgr.showModal(t('help.title'), html);
                }
            };

            // ================================================================
            // 13. EXPORT / IMPORT / PRINT / CLEAR
            // ================================================================
            const IO = {
                exportJSON() {
                    const data = { app: 'zenplan', version: 1, exportedAt: new Date().toISOString(), events: Store.events };
                    download('zenplan-backup.json', JSON.stringify(data, null, 2), 'application/json');
                    UIMgr.closeDropdowns();
                    notify(t('notify.exported', 'JSON'));
                },
                exportMD() {
                    const y = S.cursor.getFullYear(), m = S.cursor.getMonth() + 1;
                    const dim = new Date(y, m, 0).getDate();
                    const months = t('months').split('|');
                    const wdn = t('wd.row').split('|');
                    let out = '# ' + (S.lang === 'zh' ? y + '年' + m + '月' : months[m - 1] + ' ' + y) + '\n\n';
                    for (let dd = 1; dd <= dim; dd++) {
                        const ds = y + '-' + pad(m) + '-' + pad(dd);
                        const items = Store.sorted(ds);
                        if (!items.length) continue;
                        const d = pd(ds);
                        const info = dayInfo(ds);
                        let head = S.lang === 'zh' ? (m + '月' + dd + '日 ') : (m + '/' + dd + ' ');
                        head += wdn[(d.getDay() + 6) % 7];
                        if (info.tag) head += ' · ' + info.tag;
                        out += '## ' + head + '\n\n';
                        items.forEach(function(ev) {
                            if (ev.type === 'todo') out += '- [' + (ev.done ? 'x' : ' ') + '] ';
                            else if (ev.type === 'event') out += '- **' + (ev.time || '--:--') + '** ';
                            else out += '- ';
                            out += ev.title;
                            if (ev.note) out += ' — ' + ev.note;
                            out += '\n';
                        });
                        out += '\n';
                    }
                    download('zenplan-' + y + pad(m) + '.md', out, 'text/markdown');
                    UIMgr.closeDropdowns();
                    notify(t('notify.exported', 'Markdown'));
                },
                exportPNG() {
                    UIMgr.closeDropdowns();
                    if (typeof html2canvas !== 'function') {
                        notify(t('notify.pngExportFailed', 'html2canvas unavailable'));
                        return;
                    }
                    DOM.exportOverlay.classList.add('active');
                    html2canvas(document.getElementById('main'), {
                        backgroundColor: getComputedStyle(document.body).backgroundColor,
                        scale: 2,
                        logging: false,
                        useCORS: true
                    }).then(function(canvas) {
                        const link = document.createElement('a');
                        link.download = 'zenplan-' + Date.now() + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        notify(t('notify.pngExported'));
                    }).catch(function(err) {
                        notify(t('notify.pngExportFailed', err && err.message ? err.message : 'error'));
                    }).then(function() {
                        DOM.exportOverlay.classList.remove('active');
                    });
                },
                importJSON(file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            const incoming = data.events || data;
                            if (typeof incoming !== 'object' || Array.isArray(incoming) || !incoming) {
                                throw new Error('bad');
                            }
                            const existingIds = {};
                            Object.keys(Store.events).forEach(function(ds) {
                                Store.events[ds].forEach(function(e) { existingIds[e.id] = true; });
                            });
                            let added = 0;
                            Object.keys(incoming).forEach(function(ds) {
                                if (!Array.isArray(incoming[ds])) return;
                                if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
                                incoming[ds].forEach(function(e) {
                                    if (!e || !e.id || existingIds[e.id] || !e.title) return;
                                    Store.add(ds, {
                                        id: String(e.id),
                                        type: ['todo', 'event', 'note'].indexOf(e.type) >= 0 ? e.type : 'todo',
                                        title: String(e.title),
                                        note: String(e.note || ''),
                                        time: /^\d{2}:\d{2}$/.test(e.time || '') ? e.time : '',
                                        color: CONFIG.COLORS.indexOf(e.color) >= 0 ? e.color : '#888888',
                                        done: !!e.done,
                                        created: e.created || 0
                                    });
                                    existingIds[e.id] = true;
                                    added++;
                                });
                            });
                            Store.persist();
                            if (added > 0) { Render.all(); notify(t('notify.imported', added)); }
                            else notify(t('notify.noImport'));
                        } catch (_) {
                            notify(t('notify.invalidFile'));
                        }
                    };
                    reader.readAsText(file);
                },
                clearAll() {
                    showConfirm(t('confirm.clearAll'), t('confirm.ok')).then(function(ok) {
                        if (!ok) return;
                        Store.events = {};
                        Store.persist();
                        Render.all();
                        notify(t('notify.cleared'));
                    });
                }
            };

                n.classList.add('show');
                clearTimeout(S.notifyTimer);
                S.notifyTimer = setTimeout(function() { n.classList.remove('show'); }, CONFIG.NOTIFY_DURATION);
            }

                return new Promise(function(resolve) {

                    DOM.confirmOk.textContent = okText || t('confirm.ok');
                    DOM.confirmOverlay.classList.add('active');

                    document.querySelectorAll('[data-i18n]').forEach(function(el) {
                        el.textContent = t(el.dataset.i18n);
                    });
                    document.querySelectorAll('[data-i18n-title]').forEach(function(el) {

                toggle() {

                    document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
                    Settings.save();
                    Settings.apply();

                showModal(title, bodyHTML) {
                    DOM.modalTitle.textContent = title;

                    DOM.modal.classList.add('open');

                closeModal() { DOM.modal.classList.remove('open'); },

                    document.querySelectorAll('.dropdown.open').forEach(function(d) {
                        softHide(d);
                    });
                    document.querySelectorAll('.menu-btn.active').forEach(function(b) {

                showDropdown(id, btn) {

                    document.getElementById('sv-radius').textContent = S.radius;

                    document.getElementById('sv-lunar').textContent = S.showLunar ? t('on') : t('off');
                    document.getElementById('sv-festival').textContent = S.showFestival ? t('on') : t('off');
                    document.getElementById('sv-hidedone').textContent = S.hideDone ? t('on') : t('off');
                    document.getElementById('sv-statusbar').textContent = S.statusBarVisible ? t('on') : t('off');
                    document.getElementById('sv-lang').textContent = t('lang.' + S.lang);
                    document.querySelectorAll('#sv-bg-options .settings-bg-dot').forEach(function(d) {
                        d.classList.toggle('active', d.dataset.bg === S.bg);
                    });
                },
                syncFocusUI() {
                    const pill = document.getElementById('multi-pill');

            // ================================================================
            // 15. ACTION ROUTING

            const ACTIONS = {

                },

                settingsToggleLunar() {

                settingsToggleFestival() {

                    UIMgr.updateSettingsUI();
                    Render.all();
                    Settings.save();
                },
                settingsToggleHidedone() {
                    S.hideDone = !S.hideDone;
                    UIMgr.updateSettingsUI();
                    Render.all();
                    Settings.save();
                },
                settingsToggleStatusbar() {
                    S.statusBarVisible = !S.statusBarVisible;
                    DOM.statusBar.classList.toggle('hidden', !S.statusBarVisible);
                    UIMgr.updateSettingsUI();
                    Settings.save();
                },
                settingsToggleLang() { I18nManager.toggle(); },
                settingsHelp() { UIMgr.closeDropdowns(); StatsMgr.showHelp(); },
                settingsResetStyles() {
                    S.zoom = 1;
                    S.radius = 0;
                    S.theme = 'light';
                    S.bg = 'bg-void';
                    Settings.apply();
                    notify(t('notify.stylesReset'));
                },
                zoomDown() { changeZoom(-CONFIG.ZOOM_STEP); },
                zoomUp() { changeZoom(CONFIG.ZOOM_STEP); },
                radiusDown() { changeRadius(-2); },
                radiusUp() { changeRadius(2); },
                weekstartToggle() {
                    S.weekStart = S.weekStart === 1 ? 0 : 1;
                    UIMgr.updateSettingsUI();
                    Render.all();
                    Settings.save();
                },
                setBg(el) {
                    S.bg = el.dataset.bg;
                    document.body.classList.remove('bg-void', 'bg-grid', 'bg-dots', 'bg-cross', 'bg-diagonal');
                    document.body.classList.add(S.bg);
                    UIMgr.updateSettingsUI();
                    UIMgr.closeDropdowns();
                    Settings.save();
                },
                exportJson() { IO.exportJSON(); },
                exportMd() { IO.exportMD(); },
                exportPng() { IO.exportPNG(); },
                editorSave() { Editor.save(); },
                editorDelete() { Editor.remove(); },
                editorClose() { Editor.close(); },
                modalClose() { UIMgr.closeModal(); },
            };

            // ================================================================
            // 16. GLOBAL EVENT BINDINGS
            // ================================================================
            function bindGlobalEvents() {
                document.addEventListener('click', function(e) {
                    const sr = e.target.closest('.sr-item');
                    if (sr) { SearchMgr.pick(sr.dataset.date, sr.dataset.id); return; }
                    const pk = e.target.closest('[data-picker]');
                    if (pk) {
                        const kind = pk.dataset.picker;
                        const wasOpenId = Picker.ctx && Picker.ctx.kind === kind ? true : false;
                        Picker.close();
                        if (wasOpenId) return;
                        if (kind === 'date') {
                            Picker.open('date', pk, S.edDateVal, function(v) {
                                S.edDateVal = v;
                                DOM.edDate.textContent = v;
                            });
                        } else if (kind === 'time') {
                            Picker.open('time', pk, S.edTimeVal, function(v) {
                                S.edTimeVal = v;
                                DOM.edTime.textContent = v || '--:--';
                            });
                        } else if (kind === 'goto') {
                            Picker.open('date', pk, fmt(S.cursor), function(v) {
                                Nav.goTo(v);
                            });
                        }
                        return;
                    }
                    const target = e.target.closest('[data-action]');
                    if (target) {
                        if (target.dataset.action === 'toggle') {
                            const host = target.closest('[data-date]');
                            const itemEl = target.closest('[data-id]');
                            if (host && itemEl) {
                                Editor.toggle(host.dataset.date, itemEl.dataset.id);
                                return;
                            }
                        }
                        const fn = ACTIONS[target.dataset.action];
                        if (fn) fn(target);
                        return;
                    }
                    const inDD = e.target.closest('.dropdown');
                    const inMenuBtn = e.target.closest('.menu-btn') || e.target.closest('.pin-btn');
                    const inOverlay = e.target.closest('#custom-confirm.active') ||
                        e.target.closest('#modal.open');
                    if (!ED_GUARD && !inOverlay &&
                        !e.target.closest('#editor') && !e.target.closest('.picker-pop')) {
                        if (DOM.editor.classList.contains('open') && !e.target.closest('[data-action="editorClose"]')) {
                            Editor.close();
                        }
                    }
                    if (!inOverlay) Picker.close();
                    if (!inDD && !inMenuBtn && !inOverlay) {
                        UIMgr.closeDropdowns();
                    }
                });

                const cal = DOM.calendar;
                cal.addEventListener('click', function(e) {
                    if (S.view === 'list') return;
                    if (e.target.closest('[data-action="toggle"]') || e.target.closest('[data-action="quickadd"]')) return;
                    const mzone = e.target.closest('.cell,.wcol');
                    if (mzone && (e.ctrlKey || e.metaKey || e.shiftKey) &&
                        !e.target.closest('.chip')) {
                        Focus.toggleDay(mzone.dataset.date, e);
                        return;
                    }
                    const chip = e.target.closest('.chip,.ag-item');
                    if (chip) {
                        Editor.open({ date: chip.dataset.date, id: chip.dataset.id, anchor: chip });
                        return;
                    }
                    const agHead = e.target.closest('.ag-head');
                    if (agHead) {
                        Editor.open({
                            date: agHead.closest('[data-date]').dataset.date,
                            type: S.lastType || 'todo',
                            anchor: agHead
                        });
                        return;
                    }
                    const cell = e.target.closest('.cell,.wcol');
                    if (cell) {
                        S.selDate = cell.dataset.date;
                        S.lastSelDs = cell.dataset.date;
                        cal.querySelectorAll('.sel').forEach(function(c) { c.classList.remove('sel'); });
                        cell.classList.add('sel');
                    }
                });
                cal.addEventListener('dblclick', function(e) {
                    if (S.view === 'list') return;
                    if (e.target.closest('.chip,.ag-item,[data-action]')) return;
                    const zone = e.target.closest('.cell,.wcol,.ag-day');
                    if (zone) Editor.open({ date: zone.dataset.date, type: S.lastType || 'todo', anchor: zone });
                });

                cal.addEventListener('dragstart', function(e) {
                    if (S.view === 'list') { e.preventDefault(); return; }
                    const chip = e.target.closest('[draggable="true"]');
                    if (!chip) return;
                    S.dragPayload = { from: chip.dataset.date, id: chip.dataset.id };
                    e.dataTransfer.setData('text/plain', 'zenplan');
                    e.dataTransfer.effectAllowed = 'move';
                });
                cal.addEventListener('dragover', function(e) {
                    const zone = e.target.closest('.cell,.wcol');
                    if (zone && S.dragPayload) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        zone.classList.add('drag-over');
                    }
                });
                cal.addEventListener('dragleave', function(e) {
                    const zone = e.target.closest('.cell,.wcol');
                    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
                });
                cal.addEventListener('drop', function(e) {
                    const zone = e.target.closest('.cell,.wcol');
                    if (zone && S.dragPayload) {
                        e.preventDefault();
                        const to = zone.dataset.date;
                        if (to && to !== S.dragPayload.from) {
                            const moved = Store.move(S.dragPayload.from, S.dragPayload.id, to);
                            Render.all();
                            if (moved) notify(t('notify.moved', to.slice(5)));
                        }
                    }
                    S.dragPayload = null;
                    cal.querySelectorAll('.drag-over').forEach(function(z) { z.classList.remove('drag-over'); });
                });
                cal.addEventListener('dragend', function() {
                    S.dragPayload = null;
                    cal.querySelectorAll('.drag-over').forEach(function(z) { z.classList.remove('drag-over'); });
                });

                DOM.searchInput.addEventListener('input', function() { SearchMgr.render(this.value); });
                DOM.searchInput.addEventListener('keydown', function(e) {
                    e.stopPropagation();
                    if (e.key === 'Enter') {
                        const first = DOM.searchResults.querySelector('.sr-item');
                        if (first) SearchMgr.pick(first.dataset.date, first.dataset.id);
                    }
                    if (e.key === 'Escape') UIMgr.closeDropdowns();
                });

                (function() {
                    const head = document.getElementById('ed-head');
                    const pop = DOM.editor;
                    let sx, sy, ox, oy, dragging = false;
                    head.addEventListener('mousedown', function(e) {
                        if (e.target.closest('.ed-close')) return;
                        dragging = true;
                        head.classList.add('dragging');
                        sx = e.clientX;
                        sy = e.clientY;
                        ox = pop.offsetLeft;
                        oy = pop.offsetTop;
                        e.preventDefault();
                    });
                    document.addEventListener('mousemove', function(e) {
                        if (!dragging) return;
                        pop.style.left = Math.max(6, Math.min(window.innerWidth - 80, ox + e.clientX - sx)) + 'px';
                        pop.style.top = Math.max(6, Math.min(window.innerHeight - 40, oy + e.clientY - sy)) + 'px';
                    });
                    document.addEventListener('mouseup', function() {
                        if (dragging) {
                            dragging = false;
                            head.classList.remove('dragging');
                        }
                    });
                })();

                DOM.fileInput.addEventListener('change', function(e) {
                    if (e.target.files[0]) IO.importJSON(e.target.files[0]);
                    e.target.value = '';
                });

                DOM.confirmOk.addEventListener('click', function() {
                    DOM.confirmOverlay.classList.remove('active');
                    if (S.confirmResolve) { S.confirmResolve(true); S.confirmResolve = null; }
                });
                DOM.confirmCancel.addEventListener('click', function() {
                    DOM.confirmOverlay.classList.remove('active');
                    if (S.confirmResolve) { S.confirmResolve(false); S.confirmResolve = null; }
                });

                DOM.editor.addEventListener('keydown', function(e) {
                    e.stopPropagation();
                    if (e.key === 'Escape') { Editor.close(); return; }
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Editor.save(); }
                });
                DOM.edTitle.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); Editor.save(); }
                });
                DOM.edSeg.addEventListener('click', function(e) {
                    const b = e.target.closest('button[data-t]');
                    if (!b) return;
                    DOM.edSeg.querySelectorAll('button').forEach(function(x) { x.classList.remove('active'); });
                    b.classList.add('active');
                    Editor.syncTimeRow(b.dataset.t);
                });
                DOM.edColors.addEventListener('click', function(e) {
                    const d = e.target.closest('.ft-color-dot');
                    if (!d) return;
                    DOM.edColors.querySelectorAll('.ft-color-dot').forEach(function(x) { x.classList.remove('active'); });
                    d.classList.add('active');
                });

                document.getElementById('sv-bg-options').addEventListener('click', function(e) {
                    const d = e.target.closest('.settings-bg-dot');
                    if (d && d.dataset.bg) {
                        const fn = ACTIONS.setBg;
                        if (fn) fn(d);
                    }
                });

                document.getElementById('main').addEventListener('wheel', function(e) {
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        changeZoom(e.deltaY < 0 ? CONFIG.ZOOM_STEP : -CONFIG.ZOOM_STEP);
                    }
                }, { passive: false });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (DOM.confirmOverlay.classList.contains('active')) {
                            DOM.confirmOverlay.classList.remove('active');
                            if (S.confirmResolve) { S.confirmResolve(false); S.confirmResolve = null; }
                            return;
                        }
                        if (Picker.ctx) { Picker.close(); return; }
                        if (DOM.modal.classList.contains('open')) { UIMgr.closeModal(); return; }
                        if (DOM.editor.classList.contains('open')) { Editor.close(); return; }
                        if (S.focusMode) { Focus.exit(); return; }
                        if (S.multiSel.length) { Focus.clear(); return; }
                        UIMgr.closeDropdowns();
                        return;
                    }
                    const tag = (e.target.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
                    switch (e.key) {
                        case 'ArrowLeft': e.preventDefault(); moveSel(-1, 0); break;
                        case 'ArrowRight': e.preventDefault(); moveSel(1, 0); break;
                        case 'ArrowUp': e.preventDefault(); moveSel(0, -1); break;
                        case 'ArrowDown': e.preventDefault(); moveSel(0, 1); break;
                        case 'a': case 'A': Nav.go(-1); break;
                        case 'd': case 'D': Nav.go(1); break;
                        case 'w': case 'W': Nav.cycle(-1); break;
                        case 's': case 'S': Nav.cycle(1); break;
                        case 't': case 'T': Nav.today(); break;
                        case 'n': case 'N':
                            if (S.view === 'list') { notify(t('notify.listReadonly')); break; }
                            Editor.open({
                                date: S.selDate || todayDS(),
                                type: S.lastType,
                                anchor: DOM.calendar.querySelector('.sel')
                            });
                            break;
                        case 'Enter':
                            if (!DOM.editor.classList.contains('open') &&
                                !DOM.modal.classList.contains('open') && S.multiSel.length) {
                                Focus.enter();
                            }
                            break;
                        case 'f': case 'F':
                            if (!DOM.editor.classList.contains('open') &&
                                !DOM.modal.classList.contains('open')) {
                                Focus.single();
                            }
                            break;
                        case '/':
                            e.preventDefault();
                            SearchMgr.open(document.querySelector('[data-action="showSearch"]'));
                            break;
                        case '+': case '=': changeZoom(CONFIG.ZOOM_STEP); break;
                        case '-': changeZoom(-CONFIG.ZOOM_STEP); break;
                        case '?': StatsMgr.showHelp(); break;
                    }
                });
            }

            // ================================================================
            // 17. BOOT
            // ================================================================
            function boot() {
                Settings.load();
                Store.load();
                document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
                bindGlobalEvents();
                Settings.apply();
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && DOM.splash.style.display !== 'none') {
                        const fn = ACTIONS.enter;
                        if (fn) fn();
                    }
                });
            }

            if (typeof module !== 'undefined' && module.exports) {
                module.exports = {
                    solarToLunar: solarToLunar,
                    solarTermName: solarTermName,
                    dayInfo: dayInfo,
                    chinaDay: chinaDay,
                    gzYear: gzYear
                };
            } else {
                boot();
            }
        })();
    </script>
</body>
</html>
