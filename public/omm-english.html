                },

                flip() {
                    const card = $('#fc-card');
                    if (!card) return;
                    if (this.done || this.i >= this.q.length || !card.isConnected) return;
                    this.flipped = !this.flipped;
                    card.classList.toggle('flipped', this.flipped);
                    if (this.flipped) TT.stop();
                },

                grade(g) {
                    if (this.done || this.i >= this.q.length) return;
                    if (!this.flipped) this.flip();
                    const it = this.q[this.i];
                    gradeWord(it.e[0], g);
                    const ts = todayStat(it.rev ? 'r' : 'l');
                    ts[it.rev ? 'r' : 'l']++;
                    if (g === 2) { this.sRight++; this.streak++; if (this.streak > this.best) this.best = this.streak; }
                    else { this.streak = 0; if (g === 0) this.sAgain++; }
                    buzz(g === 2 ? [8] : g === 1 ? [12] : [18]);
                    updateStatus();
                    const card = $('#fc-card');
                    card.classList.remove('flipped', 'slide-l', 'slide-r');
                    void card.offsetWidth;
                    if (g === 0) card.classList.add('nope');
                    else if (g === 2) { card.classList.add('nice'); burst(innerWidth / 2 - 30, innerHeight * 0.35); }
                    setTimeout(() => {
                        card.classList.remove('nope', 'nice');
                        card.classList.add(g === 0 ? 'slide-r' : 'slide-l');
                    }, g === 2 ? 210 : 250);
                    if (!it.rev && learnedToday() >= S.set.dailyNew && !this._goalToasted) {
                        this._goalToasted = true;
                        setTimeout(() => notify('今日新词目标已达成！'), 700);
                    }
                    setTimeout(() => {
                        this.i++;
                        if (this.i >= this.q.length) { this.done = true; }

                                '<div class="stat"><div class="num" data-cu="' + (this.q.length - this.sRight - this.sAgain) + '">0</div><div class="lab">模糊</div></div>' +

                    requestAnimationFrame(() => requestAnimationFrame(() => {

            // ============================================================
            // QUIZ (choice + spelling)
            // ============================================================
            const Quiz = {
                mode: 'choice',
                count: 10,
                scope: 'all',
                qs: [], qi: 0, right: 0, wrongList: [],
                sp: null, t0: 0,

                info() { return this.qs.length && this.qi < this.qs.length ? 'Q' + (this.qi + 1) + '/' + this.qs.length : ''; },

                pool() {
                    const words = activeWords().filter(e => e[2]);
                    if (this.scope === 'star') return words.filter(e => { const p = progOf(e[0]); return p && p.star; });
                    if (this.scope === 'due') return dueList(words);
                    if (this.scope === 'new') return newList(words);
                    return words;
                },

                makeQuestions() {
                    const pool = this.pool();
                    const all = activeWords();
                    let src = shuffle(pool).slice(0, this.count);
                    if (src.length < 4 && all.length >= 4) src = shuffle(all).slice(0, this.count);
                    if (src.length < 1) return [];
                    this.qs = src.map(e => {
                        const en = Math.random() < 0.55;
                        const distract = shuffle(all.filter(x => nkey(x[0]) !== nkey(e[0]))).slice(0, 3);
                        const opts = shuffle([e[2]].concat(distract.map(d => d[2])));
                        return { e, opts, ans: opts.indexOf(e[2]), en };
                    });
                    this.qi = 0; this.right = 0; this.wrongList = [];
                    return this.qs;
                },

                render() {
                    if (this.qs.length && this.qi < this.qs.length) { this.mode === 'spell' ? this.renderSpell() : this.renderQuestion(); return; }
                    if (this.qs.length && this.qi >= this.qs.length) { this.renderResult(); return; }
                    this.renderSetup();
                },

                renderSetup() {

                            '</div></div>' +
                            '<div class="ed-field"><span class="ed-label">题量</span><div class="seg">' +
                                [10, 20, 30].map(n => '<button data-action="qCount" data-n="' + n + '" class="' + (this.count === n ? 'active' : '') + '">' + n + ' 题</button>').join('') +
                            '</div></div>' +
                            '<div class="ed-field"><span class="ed-label">范围</span><div class="seg">' +
                                '<button data-action="qScope" data-s="all" class="' + (this.scope === 'all' ? 'active' : '') + '">全部</button>' +
                                '<button data-action="qScope" data-s="due" class="' + (this.scope === 'due' ? 'active' : '') + '">待复习</button>' +

                            '</div></div>' +

                },

                renderQuestion() {
                    const q = this.qs[this.qi];
                    const e = q.e;
                    $('#v-quiz').innerHTML =
                        '<div class="qz-wrap">' +
                            '<div class="qz-head"><span>选择 · Q' + (this.qi + 1) + '/' + this.qs.length + '</span><span>正确 ' + this.right + '</span></div>' +
                            '<div class="qz-q">' +
                                (q.en
                                    ? '<div class="qz-word">' + esc(e[0]) + '</div>' + (S.set.showPhon && e[1] ? '<div class="qz-ph">' + esc(e[1]) + '</div>' : '')
                                    : '<div class="qz-meaning">' + esc(e[2]) + '</div>') +
                                '<span class="mini-btn" style="margin-top:14px;padding:3px 10px" data-action="quizSpeak">' + ICO('spk') + ' 发音</span>' +
                            '</div>' +
                            '<div id="opts">' +
                                q.opts.map((o, i) =>
                                    '<div class="opt row-in" style="animation-delay:' + i * 45 + 'ms" data-action="optPick" data-i="' + i + '"><span class="ol">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></div>').join('') +
                            '</div>' +
                        '</div>';
                    if (q.en && S.set.autoSpeak) TT.speak(e[0]);
                },

                pick(i) {
                    const q = this.qs[this.qi];
                    const ok = i === q.ans;
                    const opts = $$('#opts .opt');
                    opts.forEach(o => o.classList.add('locked'));
                    opts[q.ans].classList.add('correct');
                    if (!ok) {
                        opts[i].classList.add('wrong');
                        opts.forEach((o, j) => { if (j !== q.ans && j !== i) o.classList.add('dim-off'); });
                        buzz([16, 40, 16]);
                    } else {
                        opts.forEach((o, j) => { if (j !== q.ans) o.classList.add('dim-off'); });
                        burst(innerWidth / 2, innerHeight * 0.4);
                        buzz([8, 30, 10]);
                    }
                    this.record(ok, q);
                    setTimeout(() => this.next(), ok ? 700 : 1400);
                },

                record(ok, q) {
                    const t = todayStat();
                    t.qa = (t.qa || 0) + 1;
                    if (ok) { this.right++; t.qo = (t.qo || 0) + 1; }
                    else this.wrongList.push(q.e);
                    save();
                },

                next() {
                    this.qi++;
                    if (this.qi >= this.qs.length) this.renderResult();
                    else this.mode === 'spell' ? this.renderSpell() : this.renderQuestion();
                    updateHead();
                },
                renderSpell() {
                    const e = this.sp.e;
                    const w = e[0];
                    const val = this.sp.val || '';
                    let boxes = '';
                    for (let k = 0; k < w.length; k++) {
                        const ch = w[k];
                        if (ch === ' ') { boxes += '<span class="sl-gap"></span>'; continue; }
                        if (!/[a-zA-Z]/.test(ch)) { boxes += '<span class="sl-gap" style="width:10px"></span>'; continue; }
                        const filled = k < val.length;
                        let cls = 'sl';
                        if (this.sp.checked) {
                            cls += filled ? (val[k].toLowerCase() === ch.toLowerCase() ? ' ok' : ' bad') : ' missed';
                        } else {
                            if (filled) cls += ' fill';
                            if (k === val.length) cls += ' cur';
                        }
                        const dc = this.sp.checked && filled && val[k].toLowerCase() !== ch.toLowerCase() ? ' data-c="' + esc(ch) + '"' : '';
                        boxes += '<span class="' + cls + '"' + dc + '>' + (filled ? esc(val[k]) : '') + '</span>';
                    }
                    $('#v-quiz').innerHTML =
                        '<div class="qz-wrap">' +
                            '<div class="qz-head"><span>拼写 · Q' + (this.qi + 1) + '/' + this.qs.length + '</span><span>正确 ' + this.right + '</span></div>' +
                            '<div class="qz-q"><div class="qz-meaning">' + esc(e[2]) + '</div>' +
                                '<div style="margin-top:12px"><button class="mini-btn" data-action="spSay">' + ICO('spk') + ' 再听一次</button></div></div>' +
                            '<input id="sp-hid" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />' +
                            '<div class="spell-boxes" id="spell-boxes" data-action="spFocus">' + boxes + '</div>' +
                            '<div style="display:flex;gap:10px;justify-content:center;margin-top:4px">' +
                                '<button class="mini-btn" data-action="spHint">提示一个字母</button>' +
                                '<button class="mini-btn solid" data-action="spCheck">提 交</button>' +
                                '<button class="mini-btn danger" data-action="spSkip">跳过</button>' +
                            '</div>' +
                            '<div id="sp-fb" class="dict-out hidden"></div>' +
                        '</div>';
                    const hid = $('#sp-hid');
                    hid.value = val;
                    this.bindSpellInput();
                    if (!this.sp.checked) setTimeout(() => { try { hid.focus(); } catch (er) { } }, 30);
                    if (S.set.autoSpeak) TT.speak(w);
                },

                bindSpellInput() {
                    const hid = $('#sp-hid');
                    if (!hid || hid._bound) return;
                    hid._bound = true;
                    hid.addEventListener('input', () => {
                        if (!this.sp || this.sp.checked) { hid.value = this.sp.val || ''; return; }
                        let v = hid.value.replace(/[^a-zA-Z'\- ]/g, '');
                        if (v.length > this.sp.e[0].length) v = v.slice(0, this.sp.e[0].length);
                        this.sp.val = v;
                        hid.value = v;
                        buzz(6);
                        const keepFocus = document.activeElement === hid;
                        const scroll = $('#v-quiz') ? $('#v-quiz').scrollTop : 0;
                        this.renderSpell();
                        if ($('#v-quiz')) $('#v-quiz').scrollTop = scroll;
                        if (keepFocus && !this.sp.checked) { try { $('#sp-hid').focus(); } catch (e) { } }
                    });
                    hid.addEventListener('keydown', ev => {
                        if (ev.key === 'Enter') { ev.preventDefault(); ACT.spCheck(); }
                    });
                },

                markBoxes(word, val) {
                    const wrap = $('#spell-boxes');
                    if (!wrap) return;
                    const letters = word.split('').filter(c => /[a-zA-Z]/.test(c));
                    wrap.querySelectorAll('.sl').forEach((el, idx) => {
                        const ch = (letters[idx] || '').toLowerCase();
                        const uv = (val[idx] || '').toLowerCase();
                        el.classList.remove('cur', 'fill', 'ok', 'bad', 'missed');
                        el.removeAttribute('data-c');
                        if (!uv) { el.classList.add('missed'); return; }
                        if (uv === ch) el.classList.add('ok');
                        else { el.classList.add('bad'); el.setAttribute('data-c', letters[idx] || ''); }
                    });
                },

                checkSpell() {
                    if (!this.sp || this.sp.checked) return;
                    const e = this.sp.e;
                    const val = this.sp.val || '';
                    if (!val.trim()) { notify('先在格子里拼出单词'); return; }
                    const ok = nkey(val.replace(/\s+/g, '')) === nkey(e[0].replace(/\s+/g, ''));
                    this.sp.checked = true;
                    this.markBoxes(e[0], val);
                    const fb = $('#sp-fb');
                    fb.classList.remove('hidden');
                    fb.style.borderStyle = 'solid';
                    if (ok) {
                        fb.innerHTML = '<span class="w-ok">✓ 拼写正确！' + esc(e[0]) + '</span>';
                        waveBoxes();
                        burst(innerWidth / 2, innerHeight * 0.42);
                        buzz([10, 40, 14]);
                    } else {
                        fb.innerHTML = '<span class="w-bad" data-c="' + esc(e[0]) + '">' + esc(val) + '</span>';
                        const bx = $('#spell-boxes');
                        if (bx) { bx.classList.add('shake'); setTimeout(() => bx.classList.remove('shake'), 500); }
                        buzz([16, 40, 16]);
                    }
                    this.record(ok, this.sp.q);
                    setTimeout(() => {
                        $('#sp-fb').insertAdjacentHTML('beforeend',
                            '<div style="margin-top:10px"><button class="mini-btn solid" data-action="spNext">' + ICO('chevR') + ' 下一题</button></div>');
                    }, 450);
                },

                spellHint() {
                    if (!this.sp || this.sp.checked) return;
                    const w = this.sp.e[0];
                    const isL = c => /[a-zA-Z]/.test(c);
                    let target = -1;
                    for (let k = 0; k < w.length; k++) {
                        if (!isL(w[k])) continue;
                        if ((this.sp.val || '').length <= k) { target = k; break; }
                    }
                    if (target < 0) { notify('已经全部填好啦，直接提交'); return; }
                    let v = w.slice(0, target + 1);
                    while (v.length < w.length && !isL(w[v.length]) && w[v.length] !== ' ') v += w[v.length];
                    this.sp.val = v;
                    this.drawBoxes();
                    buzz(8);
                },
                drawBoxes() {
                    const hid = $('#sp-hid');
                    const keep = hid && document.activeElement === hid;
                    const scroll = $('#v-quiz') ? $('#v-quiz').scrollTop : 0;
                    this.renderSpell();
                    if ($('#v-quiz')) $('#v-quiz').scrollTop = scroll;
                    if (keep && !this.sp.checked) { try { $('#sp-hid').focus(); } catch (e) { } }
                },
                skipSpell() {
                    if (!this.sp || this.sp.checked) return;
                    this.sp.checked = true;
                    this.sp.val = '';
                    this.record(false, this.sp.q);
                    this.wrongList.push(this.sp.e);
                    const fb = $('#sp-fb');
                    fb.classList.remove('hidden');
                    fb.style.borderStyle = 'solid';
                    fb.innerHTML = '<span class="w-miss">答案：<b style="font-style:normal;color:var(--text)">' + esc(this.sp.e[0]) + '</b> — 已加入错词列表</span>';
                    this.markBoxes(this.sp.e[0], '');
                    setTimeout(() => {
                        fb.insertAdjacentHTML('beforeend',
                            '<div style="margin-top:10px"><button class="mini-btn solid" data-action="spNext">' + ICO('chevR') + ' 下一题</button></div>');
                    }, 300);
                },

                start() {
                    this.t0 = Date.now();
                    if (this.mode === 'spell') {
                        const src = shuffle(this.pool().length >= 4 ? this.pool() : activeWords()).slice(0, this.count);
                        if (!src.length) { notify('当前范围没有可用单词'); return; }
                        this.qs = src.map(e => ({ e }));
                        this.qi = 0; this.right = 0; this.wrongList = [];
                        this.nextSpell(true);
                    } else {
                        if (!this.makeQuestions().length) { notify('当前范围没有可用单词'); return; }
                        this.render();
                    }
                    updateHead();
                },
                nextSpell(first) {
                    if (this.qi >= this.qs.length) { this.renderResult(); updateHead(); return; }
                    this.sp = { q: this.qs[this.qi], e: this.qs[this.qi].e, val: '', checked: false };
                    this.renderSpell();
                },

                renderResult() {
                    const total = this.qs.length;
                    const pct = total ? Math.round(this.right / total * 100) : 0;
                    const dur = Math.max(1, Math.round((Date.now() - (this.t0 || Date.now())) / 1000));
                    const C = 326.7;
                    const wrongRows = this.wrongList.map(e =>
                        '<div class="wl-row"><span class="wl-w">' + esc(e[0]) + '</span><span class="wl-m">' + esc(e[2]) + '</span>' +
                        '<button class="mini-btn" style="padding:3px 9px" data-action="wlRelearn" data-w="' + esc(e[0]) + '">重学</button></div>').join('');
                    $('#v-quiz').innerHTML =
                        '<div class="setup-box">' +
                            '<div class="result-ring"><svg class="ring" width="150" height="150" viewBox="0 0 120 120">' +
                                '<circle class="r-bg" cx="60" cy="60" r="52"></circle>' +
                                '<circle class="r-fg" id="ring-fg" cx="60" cy="60" r="52" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"></circle></svg>' +
                                '<div class="rt-num" id="rr-num" style="font-size:24px;font-weight:600;margin-top:-96px;margin-bottom:64px">' + pct + '%</div>' +
                            '</div>' +
                            '<div class="setup-note">答对 <b>' + this.right + '</b> / ' + total + ' 题 · 用时 ' + dur + ' 秒</div>' +
                            (wrongRows ? '<div class="panel" style="padding:12px"><div class="panel-t" style="margin-bottom:6px">错词回顾</div><div class="wrong-list">' + wrongRows + '</div></div>' : '') +
                            '<div style="display:flex;gap:10px">' +
                                '<button class="ed-btn" data-action="quizReset">再测一轮</button>' +
                                (this.wrongList.length ? '<button class="ed-btn primary" data-action="quizWrongAll">错词全部重学</button>' : '<button class="ed-btn primary" data-action="go" data-v="home">返回总览</button>') +
                            '</div>' +
                        '</div>';
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        const fg = $('#ring-fg');
                        fg.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(1);
                    }));
                    if (pct >= 80) { burst(innerWidth / 2, innerHeight * 0.38); burst(innerWidth / 2 - 70, innerHeight * 0.42); burst(innerWidth / 2 + 70, innerHeight * 0.42); }
                },

                reset() { this.qs = []; this.qi = 0; this.right = 0; this.wrongList = []; this.sp = null; }
            };

                    save();
                    t.classList.toggle('on', p.star);
                    t.innerHTML = p.star ? '★' : '☆';
                    if (p.star) { buzz(8); t.classList.add('pop'); setTimeout(() => t.classList.remove('pop'), 350); }
                },

                drawerClose,
                wdSpeak() { if (DR) TT.speak(DR.e[0]); },
                wdSpeakEx() { if (DR && DR.e[3]) TT.speak(DR.e[3]); },
                wdStar() {
                    if (!DR) return;
                    const p = ensureProg(DR.e[0]);
                    p.star = !p.star;
                    save();
                    const btn = $('.tag-toggle[data-action="wdStar"]');
                    if (btn) btn.classList.toggle('on', p.star);
                    notify(p.star ? '已标记为难词' : '已取消难点标记');
                },
                wdFavToggle() {
                    if (!DR) return;
                    const w = DR.e[0];
                    if (inFav(w)) {
                        S.books.fav.w = S.books.fav.w.filter(x => nkey(x[0]) !== nkey(w));
                        DICT = null; save();
                        const btn = $('.tag-toggle[data-action="wdFavToggle"]');
                        if (btn) btn.classList.remove('on');
                        notify('已移出生词本');
                    } else {
                        addToFav(DR.e);
                        const btn = $('.tag-toggle[data-action="wdFavToggle"]');
                        if (btn) btn.classList.add('on');
                        notify('已收入生词本');
                    }
                    buzz(8);
                },
                noteSave() {
                    if (!DR) return;
                    const n = ensureNotes(DR.e[0]);
                    n.ex = ($('#dn-ex').value || '').trim();
                    n.zh = ($('#dn-zh').value || '').trim();
                    n.story = ($('#dn-story').value || '').trim();
                    save();
                    buzz(8);
                    notify('备注已保存，背卡背面' + (S.set.showNote ? '会展示' : '当前不展示（设置中可开）'));
                },
                wdReset() {
                    if (!DR) return;
                    confirmBox('重置 "' + DR.e[0] + '" 的学习进度？', () => {
                        delete S.prog[nkey(DR.e[0])];
                        save(); openDrawer(DR.e, DR.b); refreshView();
                    });
                },
                wdDel() {
                    if (!DR) return;
                    const bId = DR.b, w = DR.e[0];
                    confirmBox('从词书中删除 "' + w + '" ？', () => {
                        const b = S.books[bId];
                        b.w = b.w.filter(x => x[0] !== w);
                        DICT = null;
                        save(); drawerClose(); renderWords(); updateHead();
                    });
                },

                addWordOpen() {
                    const opts = Object.values(S.books).filter(b => b.id === 'fav' || !b.builtin)
                        .map(b => '<option value="' + b.id + '"' + (b.id === WV.book ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('');
                    modalOpen('添加单词',
                        '<div class="ed-field"><span class="ed-label">目标词书</span><select class="ed-input" id="aw-book">' + opts + '</select></div>' +
                        '<div class="ed-field"><span class="ed-label">单词 *</span><input class="ed-input" id="aw-w" /></div>' +
                        '<div class="ed-field"><span class="ed-label">音标</span><input class="ed-input" id="aw-ph" /></div>' +
                        '<div class="ed-field"><span class="ed-label">释义</span><input class="ed-input" id="aw-m" placeholder="词性. 中文含义" /></div>' +
                        '<div class="ed-field"><span class="ed-label">例句</span><textarea class="ed-area" id="aw-ex" rows="2"></textarea></div>',
                        '<button class="ed-btn" data-action="modalClose">取消</button>' +
                        '<button class="ed-btn primary" data-action="addWordSave">保 存</button>');
                    setTimeout(() => { const w = $('#aw-w'); w && w.focus(); }, 60);
                },
                addWordSave() {
                    const w = ($('#aw-w').value || '').trim();
                    if (!w) { notify('单词不能为空'); return; }
                    const bid = $('#aw-book').value;
                    const b = S.books[bid];
                    if (b.w.some(x => nkey(x[0]) === nkey(w))) { notify('该词书已有此单词'); return; }
                    b.w.push([w, $('#aw-ph').value.trim(), $('#aw-m').value.trim(), $('#aw-ex').value.trim()]);
                    DICT = null;
                    save(); modalClose(); notify('已添加 ' + w);
                    refreshView();
                },

                bmUse(t) {
                    const id = t.closest('.bm-row').dataset.id;
                    S.activeBook = id; WV.book = id;
                    DICT = null; save(); manageBooksModal(); updateHead();
                    notify('当前词书：' + S.books[id].name);
                },
                bmExport(t) { exportBook(t.closest('.bm-row').dataset.id, false); },
                bmDelete(t) {
                    const id = t.closest('.bm-row').dataset.id;
                    const b = S.books[id];
                    confirmBox('删除词书 "' + b.name + '"（' + b.w.length + ' 词）？', () => {
                        delete S.books[id];
                        if (S.activeBook === id) S.activeBook = 'cet6';
                        if (WV.book === id) WV.book = S.activeBook;
                        DICT = null; save(); manageBooksModal(); refreshView();
                    });
                },
                bmRename(t) {
                    const row = t.closest('.bm-row');
                    const id = row.dataset.id;
                    const span = row.querySelector('.bm-name');
                    if (span.querySelector('input')) return;
                    const old = S.books[id].name;
                    span.innerHTML = '<input class="ed-input" style="padding:2px 6px;font-size:12px;width:140px" value="' + esc(old) + '" />';
                    const inp = span.querySelector('input');
                    inp.focus(); inp.select();
                    const fin = () => {
                        const v = inp.value.trim() || old;
                        S.books[id].name = v;
                        save(); manageBooksModal();
                    };
                    inp.addEventListener('blur', fin);
                    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') inp.blur(); });
                },

                qaReview() { Flash.start('review'); },
                qaLearn() { Flash.start('new'); },
                qaDict() { Listen.mode = 'lib'; switchView('listen'); },
                startReview() { Flash.start('review'); },

                fStart(t) { Flash.start(t.dataset.m); },
                fcFlip() { Flash.flip(); },
                fcSpeak() { Flash.speakCurrent(); },
                fcSpeakEx() { const it = Flash.q[Flash.i]; if (it && it.e[3]) TT.speak(it.e[3]); },
                fcStar() {
                    const it = Flash.q[Flash.i];
                    if (!it) return;
                    const p = ensureProg(it.e[0]);
                    p.star = !p.star;
                    save();
                    const c = $('.fc-corner.l');
                    c.classList.toggle('on', p.star);
                    c.textContent = p.star ? '★' : '☆';
                    if (p.star) { buzz(8); c.classList.add('pop'); setTimeout(() => c.classList.remove('pop'), 350); }
                },
                fcGrade(t) { Flash.grade(+t.dataset.g); },

                qMode(t) { Quiz.mode = t.dataset.m; refreshSetupSeg(t); },
                qCount(t) { Quiz.count = +t.dataset.n; refreshSetupSeg(t); },
                qScope(t) { Quiz.scope = t.dataset.s; refreshSetupSeg(t); },
                quizStart() { Quiz.start(); },
                quizSpeak() { TT.speak(Quiz.mode === 'spell' && Quiz.sp ? Quiz.sp.e[0] : (Quiz.qs[Quiz.qi] ? Quiz.qs[Quiz.qi].e[0] : '')); },
                optPick(t) { Quiz.pick(+t.dataset.i); },
                spCheck() { Quiz.checkSpell(); },
                spFocus() { const h = $('#sp-hid'); if (h) { try { h.focus(); } catch (e) { } } },
                spHint() { Quiz.spellHint(); },
                spSay() { if (Quiz.sp) TT.speak(Quiz.sp.e[0]); },
                spSkip() { Quiz.skipSpell(); },
                spNext() { Quiz.qi++; Quiz.nextSpell(); },
                quizReset() { Quiz.reset(); Quiz.render(); updateHead(); },
                quizWrongAll() {
                    if (!Quiz.wrongList.length) return;
                    TT.stop();
                    Flash.q = Quiz.wrongList.map(e => ({ e, rev: true }));
                    Flash.i = 0; Flash.done = false; Flash.started = true;
                    Flash.flipped = false; Flash.sRight = 0; Flash.sAgain = 0;
                    Quiz.wrongList = [];
                    switchView('flash');
                    notify('错词已加入卡片队列');
                },
                wlRelearn(t) {
                    gradeWord(t.dataset.w, 0);
                    t.textContent = '✓ 已排期';
                    t.disabled = true;
                    t.style.opacity = 0.4;
                    notify('"' + t.dataset.w + '" 已加入今日复习');
                },

                lsOpen(t) { Listen.openPlay(t.dataset.id); },
                lsBackLib() { Listen.mode = 'lib'; Listen.render(); updateHead(); },
                lsDelete(t) {
                    const id = t.dataset.id;
                    const it = S.listen.find(x => x.id === id);
                    confirmBox('删除资源 "' + (it ? it.title : '') + '" ？', () => {
                        S.listen = S.listen.filter(x => x.id !== id);
                        if (AUD[id]) { URL.revokeObjectURL(AUD[id]); delete AUD[id]; }
                        Listen._all = null;
                        save(); Listen.renderLib(); updateHead();
                    });
                },
                lsImportOpen() { lsImportModal(); },
                lsPickAudio() { $('#fi-ls-audio').value = ''; $('#fi-ls-audio')._target = null; $('#fi-ls-audio').click(); },
                lsBind() {
                    const fi = $('#fi-ls-audio');
                    fi._target = Listen.cur.id;
                    fi.value = '';
                    fi.click();
                },
                lsPickSubs() { $('#fi-ls-subs').value = ''; $('#fi-ls-subs').click(); },
                lsSaveItem,
                lsZh(t) {
                    document.body.classList.toggle('hide-zh');
                    t.textContent = document.body.classList.contains('hide-zh') ? '译文:关' : '译文:开';
                },
                lsQuizBtn() {
                    const qz = $('#qz-blocks');
                    if (!qz) return;
                    qz.classList.toggle('hidden');
                    if (!qz.classList.contains('hidden')) qz.scrollIntoView({ behavior: 'smooth', block: 'start' });
                },
                lsToDict() { Dict.enter(Listen.cur.id); },
                playToggle() { Listen.toggle(); },
                sentPrev() { Listen.jump(-1); },
                sentNext() { Listen.jump(1); },
                trLine(t) { Listen.trLine(+t.dataset.i); },
                loopTog(t) {
                    Listen.loopOne = !Listen.loopOne;
                    t.classList.toggle('on', Listen.loopOne);
                },
                rateCyc(t) {
                    const i = RATES.indexOf(Listen.rate);
                    Listen.rate = RATES[(i + 1) % RATES.length];
                    t.textContent = '×' + String(Listen.rate.toFixed(2)).replace(/\.?0+$/, '');
                    if (Listen.hasAudio()) ensureAudio().playbackRate = Listen.rate;
                },
                abMark(t) {
                    if (!Listen.hasAudio()) return;
                    const au = ensureAudio();
                    if (!Listen.ab.on) {
                        Listen.ab.on = true;
                        Listen.ab.a = au.currentTime;
                        t.classList.add('on');
                        notify('A 点已设 ' + fmtTime(Listen.ab.a));
                    } else {
                        const bpt = au.currentTime;
                        if (bpt - Listen.ab.a < 1) {
                            Listen.ab.on = false;
                            t.classList.remove('on');
                            notify('区间太短，A-B 已取消');
                        } else {
                            Listen.ab.b = bpt;
                            notify('A-B 循环 ' + fmtTime(Listen.ab.a) + ' → ' + fmtTime(bpt));
                        }
                    }
                },
                lqPick(t) {
                    const qi = +t.dataset.q, oi = +t.dataset.i;
                    const qz = Listen.cur.qs[qi];
                    const block = t.closest('.qz-block');
                    if (block.dataset.done) return;
                    block.dataset.done = '1';
                    const opts = block.querySelectorAll('.opt');
                    opts.forEach(o => o.classList.add('locked'));
                    opts[qz.a].classList.add('correct');
                    if (oi !== qz.a) { t.classList.add('wrong'); Listen.answers[qi] = false; buzz([16, 40, 16]); }
                    else { Listen.answers[qi] = true; buzz([8, 30, 10]); }
                    $('#lqfb-' + qi).textContent = oi === qz.a ? '✓ 回答正确' : ('✗ 正确答案：' + 'ABCD'[qz.a]);
                    if (Listen.answers.filter(x => x != null).length === Listen.cur.qs.length) {
                        const rct = Listen.answers.filter(Boolean).length;
                        setTimeout(() => {
                            notify('答题完成：' + rct + ' / ' + Listen.cur.qs.length);
                            if (rct >= Math.ceil(Listen.cur.qs.length * 0.66)) burst(innerWidth / 2, innerHeight * 0.4);
                        }, 350);
                    }
                },
                popClose() { hidePop(); },
                popSpeak() { TT.speak($('#wpop').dataset.w); },
                popFav() {
                    const w = $('#wpop').dataset.w;
                    const hit = dictLookup(w)[0];
                    if (hit && addToFav(hit.e)) notify('"' + hit.e[0] + '" 已加入生词本');
                    else notify('未找到词条或已在生词本中');
                    hidePop();
                },
                popWordSay(t) { TT.speak(t.dataset.w); },

                dPlay() { Dict.play(false); },
                dSlow() { Dict.play(true); },
                dLoop(t) { Dict.d.loop = !Dict.d.loop; t.classList.toggle('on', Dict.d.loop); },
                dCheck() { Dict.check(); },
                dHint() { Dict.hint(); },
                dSkip() { Dict.skip(); },
                dNext() { Dict.next(); },
                dRestart() { Dict.enter(Listen.cur.id); }
            });

            function closeMoreSafe() {
                const ms = $('#more-sheet');
                if (ms) ACT.closeMore();
            }

            function refreshSetupSeg(t) {
                const seg = t.closest('.seg');
                seg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                t.classList.add('active');
            }

            // ============================================================
            // EVENT DELEGATION
            // ============================================================
            const DROP_OPENERS = { showSettings: 1, showExportDd: 1, showBookDd: 1, showExamPicker: 1, showVoicePicker: 1 };
            const CLOSE_AFTER = { exportFull: 1, exportBookJson: 1, exportBookTxt: 1 };

            document.addEventListener('click', e => {
                const tw = e.target.closest('.tw');
                if (tw) { twClick(tw); return; }
                const inPop = !!e.target.closest('#wpop');
                if (!inPop) hidePop();
                const inPk = !!e.target.closest('.picker-pop');
                if (!inPk) closePops();
                const t = e.target.closest('[data-action]');
                if (!t) {
                    if (!e.target.closest('.dropdown')) closeDrops();
                    return;
                }
                const a = t.dataset.action;
                if (!DROP_OPENERS[a]) {
                    if (CLOSE_AFTER[a]) closeDrops();
                    else if (!t.closest('.dropdown') && !inPop && !inPk) closeDrops();
                }
                if (ACT[a]) {
                    try { ACT[a](t, e); } catch (err) {
                        console.error(err);
                        notify('操作异常：' + err.message);
                    }
                }
                if (t.closest('#more-sheet') && a !== 'openMore') ACT.closeMore();
            });

            document.addEventListener('keydown', e => {
                const tag = (e.target.tagName || '').toUpperCase();
                const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
                if (e.key === 'Escape') {
                    if ($('#custom-confirm').classList.contains('active')) { $('#custom-confirm').classList.remove('active'); return; }
                    closePops();
                    if ($('#modal').classList.contains('open')) { modalClose(); return; }
                    if ($('#drawer').classList.contains('open')) { drawerClose(); return; }
                    hidePop(); closeDrops();
                    if (typing) e.target.blur();
                    return;
                }
                if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
                if (curView === 'flash' && Flash.started && !Flash.done) {
                    if (e.code === 'Space') { e.preventDefault(); Flash.flip(); return; }
                    if (e.key === '1') { Flash.grade(0); return; }
                    if (e.key === '2') { Flash.grade(1); return; }
                    if (e.key === '3') { Flash.grade(2); return; }
                    if (e.key.toLowerCase() === 's') { Flash.speakCurrent(); return; }
                }
                if (curView === 'listen' && Listen.mode === 'play') {
                    if (e.code === 'Space') { e.preventDefault(); Listen.toggle(); return; }
                    if (e.key === 'ArrowRight') { Listen.jump(1); return; }
                    if (e.key === 'ArrowLeft') { Listen.jump(-1); return; }
                }
                if (curView === 'listen' && Listen.mode === 'dict' && Dict.d) {
                    if (e.key.toLowerCase() === 's') { Dict.play(false); return; }
                }
                if (e.key === '?') { ACT.showHelp(); }
            });

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                rebuildCache();
                applyAll();

                $$('#sv-bg-options .settings-bg-dot').forEach(d => {
                    d.addEventListener('click', ev => {
                        ev.stopPropagation();
                        S.set.bg = d.dataset.bg;
                        applyAll(); save();
                    });
                });

                const ttBtn = document.querySelector('[data-action="ttsTest"]');
                if (ttBtn) ttBtn.innerHTML = ICO('spk') + ' 测试发音';
                const backBar = document.getElementById('back-bar');
                if (backBar) backBar.innerHTML = ICO('chevL') + '<span style="margin-left:6px">返回</span>';

                $('#confirm-ok').addEventListener('click', () => {
                    $('#custom-confirm').classList.remove('active');
                    const cb = _cfCb; _cfCb = null;
                    if (cb) cb();
                });
                $('#confirm-cancel').addEventListener('click', () => {
                    $('#custom-confirm').classList.remove('active');
                    _cfCb = null;
                });
                $('#custom-confirm').addEventListener('click', e => {
                    if (e.target.id === 'custom-confirm') { $('#custom-confirm').classList.remove('active'); _cfCb = null; }
                });
                $('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') modalClose(); });

                $('#fi-backup').addEventListener('change', ev => {
                    const f = ev.target.files[0];
                    if (f) importBackupFile(f);
                    ev.target.value = '';
                });
                $('#fi-vocab').addEventListener('change', ev => {
                    const f = ev.target.files[0];
                    if (!f) return;
                    const rd = new FileReader();
                    rd.onload = () => {
                        const ta = $('#im-text');
                        if (ta) {
                            ta.value = rd.result;
                            const nm = $('#im-name');
                            if (nm && !nm.value) nm.value = f.name.replace(/\.[^.]+$/, '');
                        } else {
                            showImportModal(f.name.replace(/\.[^.]+$/, ''));
                            $('#im-text').value = rd.result;
                        }
                        notify('文件已读取：' + f.name);
                    };
                    rd.readAsText(f);
                    ev.target.value = '';
                });
                $('#fi-ls-audio').addEventListener('change', ev => {
                    const f = ev.target.files[0];
                    if (!f) return;
                    const target = ev.target._target;
                    if (target) {
                        if (AUD[target]) URL.revokeObjectURL(AUD[target]);
                        AUD[target] = URL.createObjectURL(f);
                        const it = S.listen.find(x => x.id === target);
                        if (it) { it.audioName = f.name; save(); Listen._all = null; }
                        if (Listen.cur && Listen.cur.id === target) { Listen.playing = false; Listen.renderPlayer(); }
                        notify('音频已加载');
                    } else {
                        PEND_AUDIO = { name: f.name, file: f };
                        const lb = $('#ls-audio-name');
                        if (lb) lb.textContent = f.name;
                    }
                    ev.target.value = '';
                });
                $('#fi-ls-subs').addEventListener('change', ev => {
                    const f = ev.target.files[0];
                    if (!f) return;
                    const rd = new FileReader();
                    rd.onload = () => {
                        const ta = $('#ls-text');
                        if (ta) ta.value = rd.result;
                        notify('字幕已读取：' + f.name);
                    };
                    rd.readAsText(f);
                    ev.target.value = '';
                });

                if ('speechSynthesis' in window) {
                    TT.refresh();
                    speechSynthesis.onvoiceschanged = () => TT.refresh();
                }

                if (matchMedia('(pointer:coarse)').matches || innerWidth < 720) {
                    if (!S.set.pinned) { S.set.pinned = true; applyAll(); }
                }

                window.addEventListener('beforeunload', () => {
                    TT.stop();
                    if (window._zeSkipFlush) { try { localStorage.removeItem(LS_KEY); } catch (e) { } return; }
                    try { clearTimeout(_saveT); localStorage.setItem(LS_KEY, JSON.stringify(serializeS())); } catch (e) { }
                });

                switchView('home');
            }

            init();
        })();
    </script>
</body>
</html>
