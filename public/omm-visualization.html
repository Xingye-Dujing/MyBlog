<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>可视化图表</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@7.4.0/dist/apexcharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
    <style>
      :root {
        --bg: #fff;
        --paper: #fff;
        --text: #1a1a1a;
        --text-dim: rgba(26, 26, 26, 0.4);
        --text-faint: rgba(26, 26, 26, 0.15);
        --border: #1a1a1a;
        --border-dim: rgba(26, 26, 26, 0.15);
        --border-faint: rgba(26, 26, 26, 0.06);
        --hover: rgba(26, 26, 26, 0.06);
        --active-bg: #777;
        --active-text: #fff;
        --ink: #1a1a1a;
        --dim: rgba(26, 26, 26, 0.4);
        --faint: rgba(26, 26, 26, 0.15);
        --line: rgba(26, 26, 26, 0.15);
        --line2: rgba(26, 26, 26, 0.06);
        --inverse: #fff;
        --ok: #4e8061;
        --warn: #9a7740;
        --err: #a85454;
        --serif: 'Literata', 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', '宋体', serif;
        --sans: 'Literata', 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', '宋体', serif;
        --radius: 0px;
        --menuH: 48px;
        --fscale: 1;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border-radius: var(--radius);
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }
      body {
        font-family: var(--serif);
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        user-select: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        font-family: var(--serif);
      }
      button {
        color: inherit;
      }
      ::selection {
        background: rgba(80, 80, 80, 0.16);
      }
      .body-grid {
        background-image:
          linear-gradient(var(--line2) 1px, transparent 1px),
          linear-gradient(90deg, var(--line2) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .body-dots {
        background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .body-cross {
        background-image:
          linear-gradient(var(--line2) 1px, transparent 1px),
          linear-gradient(90deg, var(--line2) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: 20px 20px;
      }
      .body-diagonal {
        background-image: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 28px,
          var(--line2) 28px,
          var(--line2) 29px
        );
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        font-family: var(--serif);
        font-size: calc(30px * var(--fscale));
        color: var(--text);
        letter-spacing: 10px;
        margin-bottom: 8px;
      }
      .splash-tagline {
        font-size: calc(10px * var(--fscale));
        color: var(--text-dim);
        letter-spacing: 3px;
        margin-bottom: 40px;
      }
      .splash-enter {
        padding: 10px 32px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--serif);
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 500;
      }
      .splash-enter:hover {
        color: var(--text);
        border-color: var(--border);
        box-shadow: inset 0 -2px 0 var(--text);
        background: var(--hover);
      }

      #menu-trigger {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 8px;
        z-index: 1000;
      }
      #top-menu {
        position: fixed;
        left: 0;
        top: -48px;
        width: 100%;
        height: 48px;
        z-index: 999;
        background: var(--bg);
        border-bottom: 1px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 0 10px;
        overflow: auto;
        scrollbar-width: none;
        transition: top 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #top-menu::-webkit-scrollbar {
        display: none;
      }
      #menu-trigger:hover ~ #top-menu,
      #top-menu:hover,
      #top-menu.pinned,
      body.submenu-open #top-menu {
        top: 0;
      }
      .menu-group {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 6px;
        position: relative;
        flex-shrink: 0;
      }
      .menu-group + .menu-group:before {
        content: '';
        position: absolute;
        left: -1px;
        top: 50%;
        transform: translateY(-50%);
        width: 1px;
        height: 19px;
        background: var(--line);
      }
      .menu-label {
        font-size: 9px;
        letter-spacing: 1.7px;
        color: var(--faint);
        padding: 0 4px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .menu-btn,
      .pin-btn {
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        border-radius: var(--radius);
        transition: all 0.15s;
        color: var(--dim);
      }
      .menu-btn {
        font-size: 11px;
        letter-spacing: 0.4px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .menu-btn:hover {
        color: var(--text);
        border-color: var(--border);
        background: var(--hover);
      }
      .menu-btn.active {
        color: var(--text);
        background: var(--hover);
        border-color: var(--border);
        box-shadow: inset 0 -2px 0 var(--text);
      }
      .pin-btn {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: var(--text-faint);
        flex-shrink: 0;
      }
      .pin-btn svg {
        width: 14px;
        height: 14px;
        transition: transform 0.15s ease;
      }
      .pin-btn:hover {
        color: var(--text);
        border-color: var(--border);
        background: var(--hover);
      }
      .pin-btn.pinned {
        color: var(--text);
        border-color: var(--border);
        background: var(--hover);
        box-shadow: inset 0 -2px 0 var(--text);
      }
      .pin-btn.pinned svg {
        transform: rotate(180deg);
      }
      .pin-btn:focus-visible {
        outline: none;
        color: var(--text);
        border-color: var(--border);
        background: var(--hover);
        box-shadow: inset 0 -2px 0 var(--text);
      }
      .dropdown {
        display: none;
        position: fixed;
        z-index: 1800;
        background: var(--bg);
        border: 1px solid var(--ink);
        min-width: 220px;
        padding: 4px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        border-radius: var(--radius);
        animation: dropIn 0.14s ease;
      }
      .dropdown.open {
        display: block;
      }
      @keyframes dropIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .dd-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 7px 10px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--dim);
        cursor: pointer;
        text-align: left;
        font-size: 11px;
        letter-spacing: 0.3px;
      }
      .dd-item:hover,
      .dd-item-row:hover {
        background: var(--hover);
        color: var(--ink);
        border-color: var(--line);
      }
      .dd-item:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      .dd-item:disabled:hover {
        background: transparent;
        color: var(--dim);
        border-color: transparent;
      }
      .dd-item.active,
      .dd-item.selected {
        color: var(--ink);
        background: var(--hover);
        border-color: var(--ink);
        box-shadow: inset 0 -2px 0 var(--ink);
      }
      .dd-divider {
        height: 1px;
        background: var(--line);
        margin: 4px 0;
      }
      .dd-item-row > span:first-child {
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.3px;
        flex: 0 0 auto;
      }
      .dd-label {
        padding: 7px 10px 4px;
        color: var(--faint);
        font-size: 9px;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }
      .dd-item-row {
        display: flex;
        overflow: hidden;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 28px;
        padding: 7px 10px;
        background: transparent;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.3px;
        white-space: nowrap;
        gap: 10px;
      }
      .settings-control {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .settings-btn {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-dim);
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 13px;
        user-select: none;
        border-radius: var(--radius);
        flex-shrink: 0;
      }
      .settings-value {
        min-width: 42px;
        text-align: center;
        color: var(--text);
        font-size: 11px;
        white-space: nowrap;
      }
      .settings-btn:hover {
        border-color: var(--border);
        color: var(--text);
        background: var(--hover);
      }
      .settings-bg-options {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .settings-bg-dot {
        display: block;
        width: 20px;
        height: 20px;
        cursor: pointer;
        border: 1px solid transparent;
        background-color: var(--bg);
        transition: all 0.1s;
        border-radius: var(--radius);
        flex: 0 0 20px;
      }
      .settings-bg-dot:hover {
        border-color: var(--text-dim);
      }
      .settings-bg-dot.active {
        border-color: var(--ink);
        outline: none;
        box-shadow: none;
        background-color: var(--bg);
      }
      .settings-bg-dot[data-bg='plain'] {
        background: var(--bg);
      }
      .settings-bg-dot[data-bg='body-grid'] {
        background-image:
          linear-gradient(var(--border-dim) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
        background-size: 6px 6px;
      }
      .settings-bg-dot[data-bg='body-dots'] {
        background-image: radial-gradient(circle, var(--text-dim) 1px, transparent 1px);
        background-size: 5px 5px;
      }
      .settings-bg-dot[data-bg='body-cross'] {
        background-image:
          linear-gradient(var(--border-dim) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
        background-size: 6px 6px;
        background-position: 3px 3px;
      }
      .settings-bg-dot[data-bg='body-diagonal'] {
        background-image: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 5px,
          var(--border-dim) 5px,
          var(--border-dim) 6px
        );
      }
      #workspace {
        position: absolute;
        inset: 0;
        padding: 14px 20px 54px;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 290px;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px;
        z-index: 1;
        transition: padding-top 0.36s cubic-bezier(0.16, 1, 0.3, 1);
      }
      body.submenu-open:not(.menu-pinned) #workspace {
        padding-top: 60px;
      }
      body.menu-pinned #workspace {
        padding-top: 60px;
      }
      .zen-head {
        grid-column: 1/-1;
        display: flex;
        align-items: end;
        justify-content: space-between;
        padding: 6px 0 10px;
        border-bottom: 1px solid var(--line);
        min-height: 48px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 14px;
        min-width: 0;
      }
      .brand h1 {
        font-size: 23px;
        font-weight: 500;
        letter-spacing: 3px;
        white-space: nowrap;
      }
      .brand p {
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--dim);
        white-space: nowrap;
      }
      .head-meta {
        display: flex;
        gap: 16px;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .head-meta b {
        color: var(--ink);
        font-weight: 500;
      }
      .panel {
        min-height: 0;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-head {
        position: relative;
        z-index: 4;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 10px 11px 8px;
        border-bottom: 1px solid var(--line2);
        flex-shrink: 0;
      }
      .panel-title {
        font-size: 10px;
        letter-spacing: 1.8px;
        color: var(--dim);
        text-transform: uppercase;
      }
      .panel-note {
        font-size: 9px;
        color: var(--faint);
        letter-spacing: 0.6px;
      }
      .panel-body {
        min-height: 0;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .panel-body::-webkit-scrollbar {
        width: 4px;
      }
      .panel-body::-webkit-scrollbar-thumb {
        background: rgba(26, 26, 26, 0.18);
      }
      .library {
        min-width: 0;
      }
      .library .panel-body {
        padding: 6px;
      }
      .section {
        padding: 5px 0 7px;
      }
      .section-title {
        padding: 5px 7px 7px;
        font-size: 9px;
        color: var(--faint);
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }
      .lib-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .lib-btn {
        min-height: 42px;
        padding: 6px;
        background: transparent;
        border: 1px solid var(--line2);
        cursor: pointer;
        text-align: left;
        color: var(--dim);
        font-size: 10px;
        line-height: 1.35;
        letter-spacing: 0.2px;
      }
      .lib-btn:hover {
        color: var(--ink);
        border-color: var(--line);
      }
      .lib-btn.disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .lib-btn.disabled:hover {
        color: var(--dim);
        border-color: var(--line2);
        background: transparent;
      }
      .lib-btn.active {
        color: var(--ink);
        border-color: var(--ink);
        box-shadow: inset 0 -2px 0 var(--ink);
      }
      .lib-btn small {
        display: block;
        color: var(--faint);
        font-size: 8px;
        margin-top: 2px;
      }

      .data-panel {
        grid-column: 1/2;
        grid-row: 3;
        display: none;
      }
      .stage-panel {
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      .canvas-head-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
      }
      .stage-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .stage-title strong {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.6px;
        white-space: nowrap;
      }
      .stage-title span {
        font-size: 9px;
        color: var(--faint);
        letter-spacing: 0.7px;
        white-space: nowrap;
      }
      .stage-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
      }
      .ghost-btn {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        padding: 5px 8px;
        cursor: pointer;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.7px;
      }
      .ghost-btn:hover {
        color: var(--ink);
        border-color: var(--ink);
        background: var(--bg);
      }
      .stage-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        z-index: 0;
      }
      #chart-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 14px;
      }
      #chart-frame {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--paper);
        border: 1px solid var(--line);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        margin: 0;
      }
      #chart-mount {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #zen-svg {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #chart-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: Literata, Georgia, SimSun, serif;
        color: var(--ink);
        --layout-pad-top: 0px;
        --layout-pad-right: 0px;
        --layout-pad-bottom: 0px;
        --layout-pad-left: 0px;
      }
      .layout-title,
      .layout-legend {
        position: absolute;
        pointer-events: none;
        z-index: 5;
      }
      .layout-title {
        max-width: calc(100% - 24px - var(--layout-pad-left) - var(--layout-pad-right));
        line-height: 1.15;
      }
      .layout-title.horizontal {
        white-space: nowrap;
      }
      .layout-title.vertical {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: normal;
      }
      .layout-title .layout-title-main {
        font-family: Literata, Georgia, SimSun, serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 1px;
        color: #151515;
      }
      .layout-title .layout-title-sub {
        display: block;
        margin-top: 4px;
        font-size: 9px;
        letter-spacing: 0.8px;
        color: rgba(21, 21, 21, 0.45);
      }
      .layout-title.vertical .layout-title-sub {
        margin-top: 6px;
        margin-right: 0;
      }
      .layout-title[data-pos='top-left'],
      .layout-legend[data-pos='top-left'] {
        left: calc(14px + var(--layout-pad-left));
        top: calc(14px + var(--layout-pad-top));
      }
      .layout-title[data-pos='top'],
      .layout-legend[data-pos='top'] {
        left: 50%;
        top: calc(14px + var(--layout-pad-top));
        transform: translateX(-50%);
      }
      .layout-title[data-pos='top-right'],
      .layout-legend[data-pos='top-right'] {
        right: calc(14px + var(--layout-pad-right));
        top: calc(14px + var(--layout-pad-top));
      }
      .layout-title[data-pos='left'],
      .layout-legend[data-pos='left'] {
        left: calc(14px + var(--layout-pad-left));
        top: 50%;
        transform: translateY(-50%);
      }
      .layout-title[data-pos='right'],
      .layout-legend[data-pos='right'] {
        right: calc(14px + var(--layout-pad-right));
        top: 50%;
        transform: translateY(-50%);
      }
      .layout-title[data-pos='bottom-left'],
      .layout-legend[data-pos='bottom-left'] {
        left: calc(14px + var(--layout-pad-left));
        bottom: calc(14px + var(--layout-pad-bottom));
      }
      .layout-title[data-pos='bottom'],
      .layout-legend[data-pos='bottom'] {
        left: 50%;
        bottom: calc(14px + var(--layout-pad-bottom));
        transform: translateX(-50%);
      }
      .layout-title[data-pos='bottom-right'],
      .layout-legend[data-pos='bottom-right'] {
        right: calc(14px + var(--layout-pad-right));
        bottom: calc(14px + var(--layout-pad-bottom));
      }
      .layout-legend {
        display: flex;
        align-items: center;
        gap: 7px;
        max-width: calc(100% - 24px - var(--layout-pad-left) - var(--layout-pad-right));
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line2);
        padding: 3px 5px;
        box-sizing: border-box;
      }
      .layout-legend.horizontal {
        flex-direction: row;
      }
      .layout-legend.vertical {
        flex-direction: column;
        align-items: flex-start;
      }
      .layout-legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        border: 1px solid transparent;
        padding: 2px 4px;

        function directionButtons(key, value) {

        function fieldPadding() {

  <div class="layout-pad-cell"><span>上</span><input type="range" min="0" max="180" step="2" value="${state.paddingTop}" data-layout-prop="paddingTop"><b data-layout-val="paddingTop">${state.paddingTop}</b></div>
  <div class="layout-pad-cell"><span>右</span><input type="range" min="0" max="180" step="2" value="${state.paddingRight}" data-layout-prop="paddingRight"><b data-layout-val="paddingRight">${state.paddingRight}</b></div>
  <div class="layout-pad-cell"><span>下</span><input type="range" min="0" max="180" step="2" value="${state.paddingBottom}" data-layout-prop="paddingBottom"><b data-layout-val="paddingBottom">${state.paddingBottom}</b></div>
  <div class="layout-pad-cell"><span>左</span><input type="range" min="0" max="180" step="2" value="${state.paddingLeft}" data-layout-prop="paddingLeft"><b data-layout-val="paddingLeft">${state.paddingLeft}</b></div>
 </div></div>`

        function fieldScale(label, key, value) {

        }
        function field(label, type, key, value) {
          return `<div class="field"><label>${label}</label><input type="${type}" id="field-${key}" value="${escapeHtml(value)}"></div>`
        }
        function fieldNumber(label, key, value) {
          return `<div class="field"><label>${label}</label><input type="number" step="any" id="field-${key}" value="${value ?? ''}" placeholder="自动"></div>`
        }
        function fieldRange(label, key, min, max, step, value) {
          return `<div class="field"><label>${label}</label><div class="range-wrap"><input id="field-${key}" data-prop="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"><span class="range-val" id="val-${key}">${value}</span></div></div>`
        }
        function fieldToggle(label, key, value) {
          return `<div class="field"><label>${label}</label><button class="toggle single ${value ? 'on' : ''}" data-prop-toggle="${key}">${value ? '开启' : '关闭'}</button></div>`
        }
        function fieldSelect(label, key, value, opts) {
          return `<div class="field"><label>${label}</label>${zenSelect(key, value, opts, false)}</div>`
        }
        function zenSelect(key, value, opts, multiple = false) {
          const current = multiple
            ? String(value || '')
                .split(',')
                .filter(Boolean)
            : [String(value ?? '')]
          const label = multiple
            ? opts
                .filter((o) => current.includes(String(o[0])))
                .map((o) => o[1])
                .join('、') || '请选择'
            : opts.find((o) => String(o[0]) === String(value))?.[1] || '请选择'
          return `<div class="zen-select${multiple ? ' multi' : ''}" id="zen-select-${key}" data-select-key="${escapeHtml(key)}" data-multiple="${multiple ? 'true' : 'false'}" data-value="${escapeHtml(String(value ?? ''))}" aria-expanded="false"><button type="button" class="zen-select-button">${escapeHtml(label)}</button><div class="zen-select-menu">${opts.length ? opts.map(([v, n]) => `<button type="button" class="zen-select-option${current.includes(String(v)) ? ' active' : ''}" data-value="${escapeHtml(v)}">${escapeHtml(n)}</button>`).join('') : '<div class="zen-select-empty">暂无选项</div>'}</div></div>`
        }
        function closeCustomSelects(except) {
          $$('.zen-select[aria-expanded="true"]').forEach((x) => {
            if (x !== except) x.setAttribute('aria-expanded', 'false')
          })
        }
        function bindCustomSelects(host = document) {
          host.querySelectorAll('.zen-select').forEach(function (sel) {
            if (sel.dataset.bound) return
            sel.dataset.bound = '1'
            const btn = sel.querySelector('.zen-select-button')
            const opts = function () {
              return Array.from(sel.querySelectorAll('.zen-select-option'))
            }
            const multi = sel.dataset.multiple === 'true'
            if (!btn) return
            btn.addEventListener('click', function (e) {
              e.stopPropagation()
              const open = sel.getAttribute('aria-expanded') === 'true'
              closeCustomSelects(sel)
              sel.setAttribute('aria-expanded', open ? 'false' : 'true')
            })
            opts().forEach(function (opt) {
              opt.addEventListener('click', function (e) {
                e.stopPropagation()
                const v = opt.dataset.value
                if (multi) {
                  opt.classList.toggle('active')
                  const vals = opts()
                    .filter(function (x) {
                      return x.classList.contains('active')
                    })
                    .map(function (x) {
                      return x.dataset.value
                    })
                  sel.dataset.value = vals.join(',')
                  btn.textContent =
                    opts()
                      .filter(function (x) {
                        return x.classList.contains('active')
                      })
                      .map(function (x) {
                        return x.textContent.trim()
                      })
                      .join('、') || '请选择'
                  sel.dispatchEvent(
                    new CustomEvent('zenchange', { bubbles: true, detail: { value: vals } }),
                  )
                } else {
                  opts().forEach(function (x) {
                    x.classList.remove('active')
                  })
                  opt.classList.add('active')
                  sel.dataset.value = v
                  btn.textContent = opt.textContent.trim()
                  sel.setAttribute('aria-expanded', 'false')
                  sel.dispatchEvent(
                    new CustomEvent('zenchange', { bubbles: true, detail: { value: v } }),
                  )
                }
              })
            })
          })
        }
        document.addEventListener('click', function (e) {
          if (!e.target.closest('.zen-select')) closeCustomSelects()
        })
        function getCustomValue(key) {
          const el = document.querySelector(`.zen-select[data-select-key="${CSS.escape(key)}"]`)
          return el ? el.dataset.value : ''
        }
        function bindInspector() {
          ;['title', 'subtitle', 'xTitle', 'yTitle'].forEach((k) => {
            const el = $('#field-' + k)
            if (!el) return
            el.oninput = () => {
              state[k] = el.value
              scheduleRender()
            }
            el.onchange = flushRender
          })
          $$('.range-wrap input[type=range]').forEach((el) => {
            el.oninput = () => {
              const k = el.dataset.prop,
                val = Number(el.value)
              if (k === 'exportScale') state.exportScale = val
              else setChartProp(k, val)
              const v = $('#val-' + k)
              if (v) v.textContent = el.value
              scheduleRender()
            }
            el.onchange = flushRender
          })
          $$('.field input[type=number]').forEach((el) => {
            el.oninput = () => {
              const k = el.id.replace('field-', '')
              const raw = el.value
              if (k === 'width' || k === 'height') {
                const v = Math.max(120, Math.min(5000, Number(raw) || 0))
                state[k] = v
                scheduleRender()
              } else {
                const val = raw === '' ? '' : Number(raw)
                setChartProp(k, val)
                scheduleRender()
              }
            }
            el.onchange = flushRender
          })
          $$('.toggle[data-prop-toggle]').forEach(
            (b) =>
              (b.onclick = () => {
                const k = b.dataset.propToggle
                setChartProp(k, !chartProp(k, false))
                renderInspector()
                flushRender()
              }),
          )
          bindCustomSelects(document)
          $$(`.zen-select[data-select-key]`).forEach((el) => {
            el.addEventListener('zenchange', (e) => {
              const k = el.dataset.selectKey,
                val = el.dataset.value
              if (k === 'orientation') {
                state.pdfOrientation = val
                return
              }
              setChartProp(k, val)
              flushRender()
            })
          })
          $$('.direction-btn').forEach(
            (b) =>
              (b.onclick = () => {
                state[b.dataset.directionKey] = b.dataset.direction
                renderInspector()
                flushRender()
              }),
          )
          $$('.layout-segment button[data-choice-key]').forEach(
            (b) =>
              (b.onclick = () => {
                state[b.dataset.choiceKey] = b.dataset.choice
                renderInspector()
                flushRender()
              }),
          )
          $$('input[data-layout-prop]').forEach(
            (el) =>
              (el.oninput = () => {
                const k = el.dataset.layoutProp,
                  v = Number(el.value)
                if (!Number.isFinite(v)) return
                state[k] = v
                const out = el.parentElement.querySelector(`[data-layout-val="${CSS.escape(k)}"]`)
                if (out) out.textContent = k === 'contentScale' ? v + '%' : String(v)
                applyChartMountLayout()
                if (
                  k === 'contentScale' &&
                  state.chart &&
                  typeof state.chart.resize === 'function'
                ) {
                  try {
                    state.chart.resize()
                  } catch (e) {
                    reportError('图表比例更新失败', e, false)
                  }
                }
                schedulePersist()
              }),
          )
          $$('input[data-layout-prop]').forEach(
            (el) =>
              (el.onchange = () => {
                schedulePersist()
                if (el.dataset.layoutProp === 'contentScale') resizeChart()
              }),
          )
          $$('.palette-pick').forEach(
            (b) =>
              (b.onclick = () => {
                state.palette = b.dataset.palette
                renderInspector()
                flushRender()
              }),

        function clearMount() {
          const mount = $('#chart-mount')
          const old = state.chart
          state.chart = null
          if (old) {
            try {
              if (typeof old.dispose === 'function') old.dispose()
              else if (typeof old.destroy === 'function') old.destroy()
              else console.warn('[ZENVIZ] 旧图表实例没有标准销毁方法，已跳过销毁：', old)
            } catch (e) {
              reportError('旧图表销毁失败', e, true)
            }
          }
          const apex = mount._apex
          if (apex && apex !== old) {
            try {
              if (typeof apex.destroy === 'function') apex.destroy()
              else console.warn('[ZENVIZ] ApexCharts 实例没有 destroy 方法，已跳过销毁：', apex)
            } catch (e) {
              reportError('旧 ApexCharts 图表销毁失败', e, true)
            }
          }
          mount._apex = null
          if (window.echarts && typeof window.echarts.getInstanceByDom === 'function') {
            try {
              const inst = window.echarts.getInstanceByDom(mount)
              if (inst && inst !== old && typeof inst.dispose === 'function') inst.dispose()
            } catch (e) {
              reportError('旧 ECharts 图表销毁失败', e, true)
            }
          }
          mount.innerHTML = ''
          $('#zen-svg').style.display = 'none'
          mount.style.display = 'block'

        function renderChart(animate = true) {

              state.engine === 'zen'
                ? 'ZEN'
                : state.engine === 'chartjs'
                  ? 'Chart.js'
                  : state.engine === 'apexcharts'
                    ? 'ApexCharts'
                    : 'ECharts'
            if (!fitChartFrame()) throw new Error('图表可用空间计算失败')
            applyChartMountLayout()
            clearMount()
            if (state.engine === 'zen') {
              renderZen()

            }
            if (state.engine === 'chartjs') {

            if (state.engine === 'apexcharts') {

            setStatus('图表渲染失败 · ' + (err.message || '未知错误'), 'err')
          }
        }

        /* 属性连续调整采用尾部防抖：拖动时立即更新数值，停止操作约 140ms 后再真正重绘。
   单次点击类操作仍然立即重绘，避免交互迟钝。 */
        const RENDER_DEBOUNCE_MS = 140
        let renderTimer = 0
        function scheduleRender() {
          schedulePersist()
          clearTimeout(renderTimer)
          renderTimer = setTimeout(() => {
            renderTimer = 0
            renderChart(false)
          }, RENDER_DEBOUNCE_MS)
        }
        function flushRender() {
          schedulePersist()
          if (renderTimer) {
            clearTimeout(renderTimer)
            renderTimer = 0
          }
          renderChart(false)
        }
        function echartsTitle() {
          return { show: false, text: '', subtext: '' }

        function legendVisible() {

            .series.map((s) => s.name)
            .filter(Boolean)
        }
        function applyChartMountLayout() {
          const frame = $('#chart-frame'),
            mount = $('#chart-mount'),
            svg = $('#zen-svg'),
            overlay = $('#chart-overlay')
          if (!frame) return
          const pt = Math.max(0, Math.min(180, Number(state.paddingTop) || 0))
          const pr = Math.max(0, Math.min(180, Number(state.paddingRight) || 0))
          const pb = Math.max(0, Math.min(180, Number(state.paddingBottom) || 0))
          const pl = Math.max(0, Math.min(180, Number(state.paddingLeft) || 0))
          const scale = Math.max(0.6, Math.min(1.8, (Number(state.contentScale) || 100) / 100))
          if (overlay) {
            overlay.style.setProperty('--layout-pad-top', pt + 'px')
            overlay.style.setProperty('--layout-pad-right', pr + 'px')
            overlay.style.setProperty('--layout-pad-bottom', pb + 'px')
            overlay.style.setProperty('--layout-pad-left', pl + 'px')
          }
          // 四向“边界留白”只控制标题/图例与图表边界之间的安全距离，
          // 不再缩小 chart-mount / zen-svg 的可用绘图区，避免坐标轴与数据在四周被裁掉。
          ;[mount, svg].forEach((el) => {
            if (!el) return
            el.style.left = '0'
            el.style.right = 'auto'
            el.style.top = '0'
            el.style.bottom = 'auto'
            el.style.width = '100%'
            el.style.height = '100%'
            el.style.transformOrigin = '50% 50%'
            el.style.transform = `scale(${scale})`
          })
        }

        function renderOverlay() {

            title.innerHTML = `<div class="layout-title-main">${escapeHtml(state.title)}</div>${state.subtitle ? `<div class="layout-title-sub">${escapeHtml(state.subtitle)}</div>` : ''}`
            host.appendChild(title)
          }
          if (legendVisible()) {
            const names = currentLegendNames()
            if (names.length) {
              const saved = legendSelectionByType[state.type] || {}
              const legend = document.createElement('div')
              legend.className = `layout-legend ${state.legendOrientation === 'vertical' ? 'vertical' : 'horizontal'}`
              legend.dataset.pos = state.legendPosition || 'top'
              names.forEach((name, index) => {
                const on = Object.prototype.hasOwnProperty.call(saved, name) ? !!saved[name] : true
                const item = document.createElement('button')
                item.type = 'button'
                item.className = `layout-legend-item${on ? '' : ' off'}`
                item.dataset.legendName = name
                item.dataset.legendIndex = String(index)
                item.style.setProperty('--legend-color', palette()[index % palette().length])
                item.innerHTML = `<span class="layout-legend-mark"></span><span>${escapeHtml(name)}</span>`
                item.onclick = (e) => {
                  e.preventDefault()
                  e.stopPropagation()
                  toggleCustomLegend(name, index)

        function refreshOverlayLegendState() {

          const saved = legendSelectionByType[state.type] || {}
          host.querySelectorAll('.layout-legend-item').forEach((item) => {
            const name = item.dataset.legendName
            const on = Object.prototype.hasOwnProperty.call(saved, name) ? !!saved[name] : true
            item.classList.toggle('off', !on)

        function toggleCustomLegend(name, index) {
          const saved = { ...(legendSelectionByType[state.type] || {}) }
          const current = Object.prototype.hasOwnProperty.call(saved, name) ? !!saved[name] : true
          saved[name] = !current
          legendSelectionByType[state.type] = saved
          try {
            if (
              state.engine === 'echarts' &&
              state.chart &&
              typeof state.chart.dispatchAction === 'function'
            )
              state.chart.dispatchAction({
                type: saved[name] ? 'legendSelect' : 'legendUnSelect',
                name,
              })
            else if (state.engine === 'chartjs' && state.chart) {
              if (typeof state.chart.setDatasetVisibility === 'function')
                state.chart.setDatasetVisibility(index, saved[name])
              state.chart.update('none')
            } else if (state.engine === 'apexcharts' && state.chart) state.chart.toggleSeries(name)
          } catch (e) {
            reportError('图例状态更新失败', e, true)
          }
          refreshOverlayLegendState()
          schedulePersist()
        }

        function boxOption() {
          const p = chartProps.boxplot
          const s = rowsToSeries()
          const data = s.series.map((a) =>
            a.data
              .map(numeric)
              .filter((v) => v != null)
              .sort((a, b) => a - b),
          )
          function q(arr, pct) {
            const idx = (arr.length - 1) * pct,
              lo = Math.floor(idx),
              hi = Math.ceil(idx)
            return arr[lo] + (arr[hi] - arr[lo]) * (idx - lo)
          }
          const boxes = data.map((a) => [a[0], q(a, 0.25), q(a, 0.5), q(a, 0.75), a[a.length - 1]])

              const v = i === j ? 1 : 0.2 + ((i + j + 1) % 5) * 0.13,

        function fitChartFrame() {

          const w = Math.max(1, Math.floor(targetW * scale)),

        function parseTextData(raw) {
          const lines = raw.split(/\r?\n/).filter((x) => x.trim())
          const delim = lines[0].includes('\t')
            ? '\t'
            : lines[0].includes(',')
              ? ','
              : lines[0].includes(';')
                ? ';'
                : /\s{2,}/.test(lines[0])
                  ? 'whitespace'
                  : ' '
          const split = (l) =>
            delim === 'whitespace' ? l.trim().split(/\s{2,}/) : l.split(delim).map((x) => x.trim())
          let headers = split(lines[0])
          let rows = lines.slice(1).map(split)
          const max = Math.max(headers.length, ...rows.map((r) => r.length))
          if (headers.length < max)
            while (headers.length < max) headers.push('列' + (headers.length + 1))
          rows = rows.map((r) => {
            while (r.length < max) r.push('')
            return r
          })
          return { headers, rows }
        }

              const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' })
              state.data = aoaToData(aoa)
            } else {

        function aoaToData(a) {

          if (!rows.length) return structuredClone(sample)
          const headers = rows.shift().map((v, i) => v || '列' + (i + 1))
          const width = Math.max(headers.length, ...rows.map((r) => r.length))
          while (headers.length < width) headers.push('列' + (headers.length + 1))
          return {
            headers,
            rows: rows.map((r) => {
              while (r.length < width) r.push('')
              return r
            }),
          }
        }

        async function svgToCanvas() {
          return new Promise((resolve, reject) => {
            const img = new Image()
            img.onload = () => {
              const c = document.createElement('canvas')
              c.width = 1000 * state.exportScale
              c.height = 620 * state.exportScale
              const ctx = c.getContext('2d')
              ctx.fillStyle = '#fff'
              ctx.fillRect(0, 0, c.width, c.height)
              ctx.drawImage(img, 0, 0, c.width, c.height)
              resolve(c)
            }
            img.onerror = reject
            img.src = dataURIFromSVG()
          })
        }
        async function exportSVG() {

            if (state.typeMetaEngine === 'zen' || $('#zen-svg').style.display !== 'none') {

            } else if (state.engine === 'echarts') {
              svgString = state.chart?.getDataURL ? null : null
            }
            if (!svgString) {
              const canvas = await getExportCanvas()
              const png = canvas.toDataURL('image/png')
              svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvas.width}" height="${canvas.height}" viewBox="0 0 ${canvas.width} ${canvas.height}"><image href="${png}" width="${canvas.width}" height="${canvas.height}"/></svg>`
            }
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' })
            const a = document.createElement('a')
            a.download = safeName(state.title) + '.svg'
            a.href = URL.createObjectURL(blob)

          try {
            if (!window.jspdf) throw Error('jsPDF 未加载')
            const c = state.engine === 'zen' ? await svgToCanvas() : await getExportCanvas()
            const { jsPDF } = window.jspdf
            const pdf = new jsPDF({ orientation: state.pdfOrientation, unit: 'mm', format: 'a4' })
            const pageW = state.pdfOrientation === 'landscape' ? 297 : 210,
              pageH = state.pdfOrientation === 'landscape' ? 210 : 297
            const margin = 12,
              maxW = pageW - margin * 2,
              maxH = pageH - margin * 2
            const ratio = c.width / c.height
            let w = maxW,
              h = w / ratio
            if (h > maxH) {
              h = maxH
              w = h * ratio
            }
            pdf.addImage(
              c.toDataURL('image/png'),
              'PNG',
              (pageW - w) / 2,
              (pageH - h) / 2,
              w,
              h,
              'ZENVIZ',
              'FAST',
            )
            pdf.setFontSize(7)
            pdf.setTextColor(110)
            pdf.text('ZENVIZ · ' + state.title, margin, pageH - 5)
            pdf.save(safeName(state.title) + '.pdf')
            setStatus('PDF 已导出')
          } catch (e) {
            reportError('PDF 导出失败', e, true)
          }
        }
        $('#save-png-btn').onclick = exportPNG
        $('#save-svg-btn').onclick = exportSVG
        $('#save-pdf-btn').onclick = exportPDF
        $('#reset-btn').onclick = () => {
          state.data = structuredClone(sample)
          state.engine = 'echarts'
          state.type = 'line'
          state.category = '论文'
          state.palette = 'science'
          state.radius = 0
          state.bg = 'body-grid'
          state.titlePosition = 'top-left'
          state.titleOrientation = 'horizontal'
          state.legendPosition = 'top'
          state.legendOrientation = 'horizontal'
          state.paddingTop = 4
          state.paddingRight = 4
          state.paddingBottom = 4
          state.paddingLeft = 4
          state.contentScale = 100
          applyRadius()
          applyBg('body-grid')
          state.subtitle = ''
          state.showLegend = true
          state.showGrid = true
          state.smooth = false
          state.showPoints = true
          state.pointSize = 5
          state.lineWidth = 2
          state.opacity = 0.9
          renderCategories('论文')
          renderTypeList(categories[state.category])
          renderEngines()
          renderInspector()
          renderChart()
          setStatus('工作区已重置')
        }
        document.addEventListener('keydown', (e) => {
          const mod = e.metaKey || e.ctrlKey
          if (mod && e.key.toLowerCase() === 'p') {
            e.preventDefault()
            exportPNG()
          }
          if (mod && e.shiftKey && e.key.toLowerCase() === 'p') {
            e.preventDefault()
            exportPDF()
          }
          if (!mod && e.key.toLowerCase() === 'i') $('#file-input').click()
          if (!mod && e.key.toLowerCase() === 'd') openDataModal()
          if (e.key === 'Escape') {
            closeDropdowns()
            closeDataModal()
          }
        })

        document.getElementById('splash-enter').addEventListener('click', () => {
          const splash = document.getElementById('splash')
          splash.classList.add('fade-out')
          setTimeout(() => {
            splash.style.display = 'none'
          }, 600)
        })

        function init() {
          restorePersistedState()
          migrateOuterMarginLayout()
          normalizeLayoutPrefs()
          restoreStylePrefs()
          applyBg(state.bg || 'body-grid')
          const readyEngine = ['echarts', 'chartjs', 'apexcharts', 'zen'].find(engineReady) || 'zen'
          if (!engineReady(state.engine)) state.engine = readyEngine
          const preferred = typeSupported(state.type)
            ? state.type
            : engineSupportedTypes(state.engine)[0] || 'line'
          state.type = preferred
          state.category = getActiveCategoryForType(preferred)
          schedulePersist()
          renderCategories(state.category)
          renderTypeList(categories[state.category] || [])
          renderEngines()
          renderInspector()
          resizeChart()
          renderChart()
          setStatus(
            engineReady(state.engine)
              ? 'ZENVIZ 已就绪 · 可导入 CSV / TXT / XLSX'
              : 'ZENVIZ · 当前使用自绘引擎',
          )
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init)
        else init()
      })()
    </script>
  </body>
</html>
