name: academic
title: 学术论文
description: 严格对照「格式模板参考.docx」：A4、上下 2.54cm / 左右 3.175cm、五号宋体、1.5 倍行距、无编号标题、目录页、摘要关键词与图表题注。
version: "1.0"

content_anchor: "{{CONTENT}}"

page:
  size: A4
  margins_cm:
    top: 2.54
    bottom: 2.54
    left: 3.175
    right: 3.175

styles:
  title: "ZEN Title"
  subtitle: "ZEN Subtitle"
  abstract: "ZEN Abstract"
  keywords: "ZEN Keywords"
  toc_title: "ZEN TOC Title"
  toc_entry: "ZEN TOC Entry"
  h1: "Heading 1"
  h2: "Heading 2"
  h3: "Heading 3"
  h4: "Heading 4"
  paragraph: "ZEN Body"
  bullet_list_l1: "ZEN List 1"
  bullet_list_l2: "ZEN List 2"
  bullet_list_l3: "ZEN List 3"
  ordered_list_l1: "ZEN List 1"
  ordered_list_l2: "ZEN List 2"
  ordered_list_l3: "ZEN List 3"
  code_block: "ZEN Code"
  quote: "ZEN Quote"
  table: "Table Grid"
  table_text: "ZEN Table Text"
  image: "ZEN Image"
  caption: "ZEN Caption"
  math: "ZEN Math"
  bibliography_title: "ZEN Reference Title"
  bibliography: "ZEN Reference"

image:
  max_width_cm: 14.0
  default_align: center

toc:
  enabled: true
  title: 目录
  levels: 2
  field: true
  include_references: true

metadata:
  required: [title]
  optional: [author, subtitle, abstract, keywords, date, subject, version, department, references, toc, toc_title, toc_levels, toc_include_references]
  core_properties:
    title: title
    author: author
    subject: subject
    keywords: keywords
    comments: version
    category: department
  header:
    - placeholder: "{{TITLE}}"
      field: title
    - placeholder: "{{DEPT}}"
      field: department
    - placeholder: "{{DATE}}"
      field: date
  footer:
    - placeholder: "{{AUTHOR}}"
      field: author

features:
  - 目录页
  - 摘要 / 关键词
  - 无编号标题
  - 表格 / 图片题注
  - 参考文献

tuning:
  margins:
    top: 2.54
    bottom: 2.54
    left: 3.175
    right: 3.175
  body:
    font_size: 10.5
    line_spacing: 1.5
    first_line_indent: 2
    font: songti
  fonts:
    heading: heiti
  headings:
    title_size: 15
    h1_size: 12
    h2_size: 10.5
    h3_size: 10.5
