name: academic
title: 学术论文（TeX）
description: 严格对照「格式模板参考.tex」：A4、左右 3.18cm / 上下 2.54cm、仿宋五号、行距 13.1pt、无编号标题、图题「图N」表题「表N」、自动参考文献。
version: "1.0"
file: template.tex.j2
engine: xelatex
documentclass: article
classoptions: [a4paper]
features:
  - 仿宋五号
  - 无编号标题
  - 图表题注
  - 数学公式
  - 参考文献
  - LaTeX 原生图表（TikZ / pgfplots）

metadata:
  required: [title]
  optional: [author, subtitle, abstract, keywords, date, subject, version, department, references]
  core_properties: {}
  header: []
  footer: []
  meta_patterns:
    title: 'pdftitle=\{([^{}]*)\}'
    author: 'pdfauthor=\{([^{}]*)\}'
    subject: 'pdfsubject=\{([^{}]*)\}'
    keywords: 'pdfkeywords=\{([^{}]*)\}'

image:
  default_width: '0.9\textwidth'
