[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdforge"
version = "1.0.0"
description = "Markdown to reference-grade DOCX / TeX studio with a Python backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "markdown-it-py>=3.0",
  "python-docx>=1.1",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "Pillow>=10.0",
  "Flask>=2.3",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mdforge = "mdforge.cli:cli"

[tool.setuptools]
packages = ["mdforge"]

[tool.setuptools.package-data]
mdforge = ["templates/**/*", "templates/**/**/*"]

[tool.pytest.ini_options]
testpaths = ["mdforge/tests"]
python_files = ["test_*.py"]
