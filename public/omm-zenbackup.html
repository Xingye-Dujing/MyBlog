<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>统一备份</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
    <link rel="stylesheet" href="zen-ui.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <span class="brand">ZenBackup 统一备份</span>
        <span class="spacer"></span>
        <div class="actions"><button class="btn sm" id="theme-btn">深浅色</button></div>
      </header>
      <main class="narrow">
        <div class="panel">
          <h2>收集本地数据</h2>
          <p class="hint">扫描本产品域下的 localStorage，勾选要纳入备份的键。各产品的导出的 JSON 也可手动粘贴。</p>
          <button class="btn" id="scan-btn">扫描 localStorage</button>
          <div class="list" id="scan-list" style="margin-top:10px"></div>
          <div class="row tight" style="margin-top:10px">
            <input id="manual-id" placeholder="产品 id，如 writer" />
            <input id="manual-data" placeholder="粘贴该产品的 JSON 数据" />
            <button class="btn" id="manual-add">添加</button>
          </div>
        </div>
        <div class="panel">
          <h2>当前清单 <span id="manifest-count" class="badge">0</span></h2>
          <div class="list" id="manifest-list"></div>
          <div class="row tight" style="margin-top:10px">
            <button class="btn primary" id="pack-btn">打包下载全量备份</button>
            <label class="btn" style="display:inline-flex;align-items:center;justify-content:center">导入备份<input type="file" id="import-file" accept=".json" hidden /></label>
          </div>
        </div>
        <div class="panel">
          <h2>ZenPack 工作区包</h2>
          <p class="hint">按工作区键目录一键收集卡片、剪藏、规则、笔记与设置，打包成可移植文件。打包与恢复仍由 ZenBackup 统一处理。</p>
          <div class="row tight">
            <button class="btn" id="zp-collect">收集整个工作区</button>
            <button class="btn primary" id="zp-export">导出 ZenPack</button>
            <label class="btn" style="display:inline-flex;align-items:center;justify-content:center">导入 ZenPack<input type="file" id="zp-file" accept=".json" hidden /></label>
            <button class="btn danger" id="zp-restore">恢复工作区</button>
          </div>
          <pre class="code" id="zp-diff" style="margin-top:10px">尚未导入工作区包。</pre>
        </div>
        <div class="panel" id="import-panel" hidden>
          <h2>导入的备份</h2>
          <pre class="code" id="diff-out"></pre>
          <div class="row tight" style="margin-top:10px">
            <button class="btn" id="merge-btn">合并到当前清单</button>
            <button class="btn danger" id="restore-btn">按导入内容恢复本地数据</button>
          </div>
        </div>
      </main>
      <footer class="status"><span><i class="dot"></i>ZenBackup · 全产品备份与恢复</span><span id="status-text"></span></footer>
    </div>
    <div id="toast"></div>
    <script type="module">
      import { ZenBackup } from './zen-backup.js'
      import { ZenPack } from './zen-pack.js'
      let zpIncoming = null
      const $ = (id) => document.getElementById(id)
      let products = []
      let incoming = null
      function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800) }
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])) }
      function manifest() { return ZenBackup.collect(products, { name: 'OMM-ZEN 全量备份' }) }
      /* 扫描列表与导出文件都可能离开本机，先按与 ZenPack 相同的规则遮罩敏感字段。 */
      function safePreview(data) {
        const masked = ZenBackup.redactSecrets({ products: [{ id: 'preview', data }] }).products[0].data
        return esc(JSON.stringify(masked).slice(0, 80))
      }
      function render() {
        $('manifest-count').textContent = products.length
        $('status-text').textContent = products.length + ' 个产品'
        $('manifest-list').innerHTML = products.length
          ? products.map((p, i) => `<div class="item"><div class="body"><div class="title">${esc(p.name)} <span class="badge">${esc(p.id)}</span></div><div class="meta">${Array.isArray(p.data) ? p.data.length + ' 条记录' : typeof p.data} · ${esc(p.savedAt || '')}</div></div><div class="ops"><button class="btn sm danger" data-i="${i}">移除</button></div></div>`).join('')
          : '<div class="empty">还没有数据，先扫描或手动添加。</div>'
        $('manifest-list').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { products.splice(Number(b.dataset.i), 1); render() }))
      }
      function scan() {
        const rows = []
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i)
          const raw = localStorage.getItem(key)
          let data = raw
          try { data = JSON.parse(raw) } catch {}
          rows.push({ id: key, name: key, data })
        }
        $('scan-list').innerHTML = rows.length
          ? rows.map((r, i) => `<div class="item"><div class="body"><div class="title">${esc(r.name)}</div><div class="meta">${safePreview(r.data)}</div></div><div class="ops"><button class="btn sm" data-i="${i}">加入</button></div></div>`).join('')
          : '<div class="empty">没有本地数据</div>'
        $('scan-list').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
          const r = rows[Number(b.dataset.i)]
          if (!products.find((p) => p.id === r.id)) { products.push({ id: r.id, name: r.name, data: r.data }); render() }
          toast('已加入清单')
        }))
      }
      function bind() {
        $('theme-btn').addEventListener('click', () => { document.body.classList.toggle('theme-dark'); localStorage.setItem('zen.theme', document.body.classList.contains('theme-dark') ? 'dark' : 'light') })
        $('scan-btn').addEventListener('click', scan)
        $('manual-add').addEventListener('click', () => {
          const id = $('manual-id').value.trim(); if (!id) return toast('请填产品 id')
          let data; try { data = JSON.parse($('manual-data').value || '[]') } catch { return toast('JSON 解析失败') }
          if (!products.find((p) => p.id === id)) products.push({ id, name: id, data })
          else products = products.map((p) => (p.id === id ? Object.assign(p, { data }) : p))
          render(); toast('已添加')
        })
        $('pack-btn').addEventListener('click', () => {
          const m = ZenBackup.redactSecrets(manifest()); const check = ZenBackup.validate(m)
          if (!check.ok) return toast(check.errors[0])
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(m, null, 2)], { type: 'application/json' })); a.download = 'omm-zen-backup.json'; a.click(); URL.revokeObjectURL(a.href)
        })
        $('import-file').addEventListener('change', async (e) => {
          const f = e.target.files[0]; if (!f) return
          try {
            incoming = JSON.parse(await f.text())
            const check = ZenBackup.validate(incoming)
            if (!check.ok) { toast('校验失败：' + check.errors[0]); incoming = null; return }
            const d = ZenBackup.diff(manifest(), incoming)
            $('diff-out').textContent = `新增：${d.added.join(', ') || '无'}\n删除：${d.removed.join(', ') || '无'}\n变更：${d.changed.join(', ') || '无'}`
            $('import-panel').hidden = false
            toast('备份校验通过')
          } catch (err) { toast('导入失败：' + err.message) }
        })
        $('merge-btn').addEventListener('click', () => {
          if (!incoming) return toast('先导入备份')
          const merged = ZenBackup.merge(manifest(), incoming)
          products = merged.products.map((p) => ({ id: p.id, name: p.name, data: p.data, savedAt: p.savedAt }))
          render(); toast('已合并')
        })
        $('restore-btn').addEventListener('click', () => {
          if (!incoming) return toast('先导入备份')
          if (!confirm('按导入的备份覆盖本地对应数据？此操作不可撤销。')) return
          const entries = ZenBackup.restorableEntries(incoming, Object.keys(localStorage))
          entries.forEach((e) => {
            try { localStorage.setItem(e.key, e.value) } catch {}
          })
          toast('已恢复 ' + entries.length + ' 个键，请刷新页面')
        })
        $('zp-collect').addEventListener('click', () => {
          products = ZenPack.scanWorkspace(localStorage)
          render(); toast('已收集 ' + products.length + ' 个工作区键')
        })
        $('zp-export').addEventListener('click', () => {
          const m = ZenPack.makePack(localStorage)
          const a = document.createElement('a')
          a.href = URL.createObjectURL(new Blob([JSON.stringify(m, null, 2)], { type: 'application/json' }))
          a.download = 'omm-zenpack.json'; a.click(); URL.revokeObjectURL(a.href)
          toast('ZenPack 已导出')
        })
        $('zp-file').addEventListener('change', async (e) => {
          const f = e.target.files[0]; if (!f) return
          try {
            zpIncoming = ZenPack.readPack(await f.text())
            const d = ZenPack.planPack(manifest(), zpIncoming).diff
            $('zp-diff').textContent = `新增：${d.added.join(', ') || '无'}\n删除：${d.removed.join(', ') || '无'}\n变更：${d.changed.join(', ') || '无'}`
            toast('ZenPack 校验通过')
          } catch (err) { zpIncoming = null; toast('导入失败：' + err.message) }
        })
        $('zp-restore').addEventListener('click', () => {
          if (!zpIncoming) return toast('先导入 ZenPack')
          if (!confirm('按 ZenPack 覆盖当前工作区数据？此操作不可撤销。')) return
          const n = ZenPack.applyPack(zpIncoming, localStorage)
          toast('已恢复 ' + n + ' 个键，请刷新页面')
        })
      }
      if (localStorage.getItem('zen.theme') === 'dark') document.body.classList.add('theme-dark')
      bind(); render()
    </script>
  </body>
</html>
