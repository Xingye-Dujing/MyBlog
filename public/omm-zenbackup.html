<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="zen/foundation/util.js"></script>
    <script src="zen/components/layer.js"></script>
    <script src="zen/components/toast.js"></script>
    <script src="zen/components/dialog.js"></script>
    <script src="zen/components/select.js"></script>
    <script src="zen/components/menu.js"></script>
    <script src="zen/components/shortcuts.js"></script>
    <script src="zen/components/index.js"></script>
    <script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>统一备份</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="zen/zen.css">
    <link rel="stylesheet" href="zen/features/tool.css" />
    <link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
  </head>
  <body data-omm-app="zenbackup">
    <div id="app">
      <header class="top">
        <span class="brand">ZenBackup 统一备份</span>
        <span id="mode-badge" class="badge">同源模式</span>
        <span class="spacer"></span>
        <div class="actions"><button class="zt-btn sm" id="theme-btn">深浅色</button></div>
      </header>
      <main class="narrow">
        <div class="zt-panel">
          <h2>收集工作区数据</h2>
          <p id="mode-note" class="hint">扫描同源 localStorage 中已显式注册的产品键；不会把当前 origin 当作隔离桌面的全产品存储。</p>
          <button class="zt-btn" id="scan-btn">扫描 localStorage</button>
          <div id="scan-list" class="list"></div>
          <div class="zt-row tight">
            <input id="manual-id" placeholder="产品 id，如 writer" />
            <input id="manual-data" placeholder="粘贴该产品的 JSON 数据" />
            <button class="zt-btn" id="manual-add">添加</button>
          </div>
        </div>
        <div class="zt-panel">
          <h2>当前清单 <span id="manifest-count" class="badge">0</span></h2>
          <div id="manifest-list" class="list"></div>
          <div class="zt-row tight">
            <button class="zt-btn primary" id="pack-btn">打包下载当前清单</button>
            <label class="zt-btn">导入备份<input type="file" id="import-file" accept=".json" hidden /></label>
          </div>
        </div>
        <div class="zt-panel">
          <h2>ZenPack 工作区包</h2>
          <p class="hint">按显式产品键目录收集可移植状态。桌面与嵌入模式通过 Hub 采集/恢复；Web 同源模式只扫描本站注册键。</p>
          <div class="zt-row tight">
            <button class="zt-btn" id="zp-collect">收集整个工作区</button>
            <button class="zt-btn primary" id="zp-export">导出 ZenPack</button>
            <label class="zt-btn">导入 ZenPack<input type="file" id="zp-file" accept=".json" hidden /></label>
            <button class="zt-btn danger" id="zp-restore">恢复工作区</button>
          </div>
          <p id="coverage-out" class="hint" aria-live="polite">尚未采集，未报告产品覆盖情况。</p>
          <pre id="zp-diff" class="code">尚未导入工作区包。</pre>
        </div>
        <div class="zt-panel" id="import-panel" hidden>
          <h2>导入的备份</h2>
          <pre id="diff-out" class="code"></pre>
          <div class="zt-row tight">
            <button class="zt-btn" id="merge-btn">合并到当前清单</button>
            <button class="zt-btn danger" id="restore-btn">按导入内容恢复本地数据</button>
          </div>
        </div>
      </main>
      <footer class="status"><span><i class="dot"></i>ZenBackup · 全产品备份与恢复</span><span id="status-text"></span></footer>
    </div>
    <script type="module">
      import { ZenBackup } from './lib/zen-backup.js'
      import { ZenPack } from './lib/zen-pack.js'
      let zpIncoming = null
      const $ = (id) => document.getElementById(id)
      let products = []
      let incoming = null
      let coverage = null
      const hub = ZenPack.hubMode(window)
      const modeLabel = hub ? 'Hub 全产品模式' : 'Web 同源模式'
      function toast(msg) { return window.ZenUI.toast(msg) }
      function esc(s) { return ZenUtil.esc(s, { apos: false }) }
      function manifest() { return ZenBackup.collect(products, { name: hub ? 'OMM-ZEN 全产品备份' : 'OMM-ZEN 同源备份' }) }
      function safePreview(data) {
        const masked = ZenBackup.redactSecrets({ products: [{ id: 'preview', data }] }).products[0].data
        return esc(String(JSON.stringify(masked)).slice(0, 80))
      }
      function productName(id) {
        const product = ZenPack.WORKSPACE_PRODUCTS.find((item) => item.id === id)
        return product ? product.name : id
      }
      function coverageText(value) {
        if (!value) return '尚未采集，未报告产品覆盖情况。'
        const lines = [modeLabel + '：' + products.length + ' 个已保存键。']
        if (value.failedProducts && value.failedProducts.length) {
          lines.push('失败产品：' + value.failedProducts.map(productName).join('、'))
        }
        if (value.missingProducts && value.missingProducts.length) {
          lines.push('未发现已保存状态：' + value.missingProducts.map(productName).join('、'))
        }
        if (value.failures && value.failures.length) {
          lines.push(value.failures.map((failure) => (failure.key || failure.app || '存储') + '：' + failure.error).join('；'))
        }
        return lines.join('\n')
      }
      function render() {
        $('manifest-count').textContent = products.length
        $('status-text').textContent = modeLabel + ' · ' + products.length + ' 个键'
        $('coverage-out').textContent = coverageText(coverage)
        $('manifest-list').innerHTML = products.length
          ? products.map((p, i) => `<div class="item"><div class="body"><div class="title">${esc(p.name)} <span class="badge">${esc(p.id)}</span></div><div class="meta">${Array.isArray(p.data) ? p.data.length + ' 条记录' : typeof p.data} · ${esc(p.savedAt || '')}</div></div><div class="ops"><button class="zt-btn sm danger" data-i="${i}">移除</button></div></div>`).join('')
          : '<div class="empty">还没有数据，先扫描或手动添加。</div>'
        $('manifest-list').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { products.splice(Number(b.dataset.i), 1); render() }))
      }
      async function collectCurrent() {
        if (hub) {
          const reply = await ZenPack.requestHub('collect', null)
          coverage = reply.coverage
          return reply.manifest
        }
        const collected = ZenPack.collectWorkspace(localStorage, { name: 'OMM-ZEN 同源工作区备份' })
        coverage = collected.coverage
        return collected
      }
      async function scan() {
        try {
          const collected = await collectCurrent()
          products = collected.products
          $('scan-list').innerHTML = products.length
            ? products.map((p, i) => `<div class="item"><div class="body"><div class="title">${esc(p.name)}</div><div class="meta">${safePreview(p.data)}</div></div><div class="ops"><button class="zt-btn sm" data-i="${i}">已收集</button></div></div>`).join('')
            : '<div class="empty">没有发现已保存的注册键</div>'
          render()
          const failed = coverage.failedProducts.length
          toast(failed ? '采集完成，但有产品失败，请查看覆盖提示' : '已收集 ' + products.length + ' 个工作区键')
        } catch (error) { toast('采集失败：' + error.message) }
      }
      function exportManifest(value, name) {
        const safe = ZenBackup.redactSecrets(value)
        const check = ZenBackup.validate(safe)
        if (!check.ok) return toast('导出失败：' + check.errors[0])
        coverage = ZenPack.workspaceCoverage(safe, safe.coverage && safe.coverage.failures, hub ? 'hub' : 'local')
        render()
        if (!ZenUtil.saveJSON(name, safe)) return toast('导出失败：无法写入下载文件')
        const missing = coverage.missingProducts.length
        const failed = coverage.failedProducts.length
        toast('已导出' + (missing ? '；' + missing + ' 个产品未发现状态，已在包内记录' : '') + (failed ? '；' + failed + ' 个产品失败' : ''))
      }
      async function showDiff(pack, output) {
        const current = await collectCurrent()
        const d = ZenPack.planPack(current, pack).diff
        output.textContent = `新增：${d.added.join(', ') || '无'}\n删除：${d.removed.join(', ') || '无'}\n变更：${d.changed.join(', ') || '无'}`
      }
      function failureText(failures) {
        return failures.map((failure) => (failure.app || failure.key || '未知产品') + '：' + failure.error).join('；')
      }
      async function restoreWorkspace(pack) {
        try { ZenPack.readPack(pack) } catch (error) { return toast('恢复失败：' + error.message) }
        const count = pack.products.filter((entry) => {
          const product = ZenPack.WORKSPACE_PRODUCTS.find((item) => item.id === entry.id)
          return (product || ZenPack.isWorkspaceKey(entry.id)) && !ZenBackup.isSecretKey(entry.id)
        }).length
        if (!count) return toast('备份中没有可恢复的已注册键')
        const ok = await window.ZenUI.dialog.confirm(
          `按导入内容恢复 ${count} 个工作区键？敏感字段只跳过遮蔽路径，其余状态会被覆盖。`,
          { danger: true, title: '确认恢复' },
        )
        if (!ok) return
        if (hub) {
          let previous = null
          let attempted = false
          try {
            previous = await collectCurrent()
            if (previous.coverage && previous.coverage.failedProducts.length) {
              throw new Error('无法创建完整恢复快照：' + previous.coverage.failedProducts.map(productName).join('、'))
            }
            attempted = true
            const reply = await ZenPack.requestHub('restore', pack)
            const failures = ZenPack.normalizeResults(reply.results)
            if (reply.ok !== true || failures.length) {
              throw new Error(failures.length ? failureText(failures) : reply.error || 'Hub 未确认恢复成功')
            }
            toast('Hub 已确认恢复；失败产品：无')
          } catch (error) {
            let rollbackError = ''
            if (attempted && previous) {
              try {
                const reply = await ZenPack.requestHub('restore', previous)
                const failures = ZenPack.normalizeResults(reply.results)
                if (reply.ok !== true || failures.length) {
                  throw new Error(failures.length ? failureText(failures) : reply.error || 'Hub 未确认回滚')
                }
              } catch (rollbackFailure) { rollbackError = '；回滚失败：' + rollbackFailure.message }
            }
            toast('恢复失败：' + error.message + rollbackError)
          }
          return
        }
        try {
          const entries = ZenBackup.restorableEntries(pack, null, ZenPack.WORKSPACE_KEYS, localStorage)
          const saved = ZenPack.snapshot(entries, localStorage)
          const result = ZenPack.applyPack(pack, localStorage)
          if (result && typeof result === 'object' && result.failures.length) {
            const restored = ZenPack.rollback(saved, localStorage)
            const rollbackError = restored.failures.length ? '；回滚失败：' + failureText(restored.failures) : '；已回滚'
            toast('恢复失败：' + failureText(result.failures) + rollbackError)
            return
          }
          toast('已恢复 ' + result + ' 个键，请刷新产品页面')
        } catch (error) { toast('恢复失败：' + error.message) }
      }
      function bind() {
        $('theme-btn').addEventListener('click', () => ZenUtil.themeToggle())
        $('scan-btn').addEventListener('click', scan)
        $('manual-add').addEventListener('click', () => {
          const id = $('manual-id').value.trim(); if (!id) return toast('请填产品 id')
          let data; try { data = JSON.parse($('manual-data').value || '[]') } catch { return toast('JSON 解析失败') }
          if (!products.find((p) => p.id === id)) products.push({ id, name: id, data })
          else products = products.map((p) => (p.id === id ? Object.assign(p, { data }) : p))
          render(); toast('已添加；未注册键不会出现在恢复白名单中')
        })
        $('pack-btn').addEventListener('click', async () => {
          try {
            const value = hub ? await collectCurrent() : manifest()
            if (!value.products.length) return toast('没有可导出的数据')
            products = value.products
            exportManifest(value, 'omm-zen-backup.json')
          } catch (error) { toast('导出失败：' + error.message) }
        })
        $('import-file').addEventListener('change', async (e) => {
          const f = e.target.files[0]; if (!f) return
          try {
            incoming = ZenPack.readPack(await f.text())
            await showDiff(incoming, $('diff-out'))
            $('import-panel').hidden = false
            toast('备份校验通过')
          } catch (error) { incoming = null; toast('导入失败：' + error.message) }
          finally { e.target.value = '' }
        })
        $('merge-btn').addEventListener('click', () => {
          if (!incoming) return toast('先导入备份')
          const merged = ZenBackup.merge(manifest(), incoming)
          products = merged.products.map((p) => ({ id: p.id, name: p.name, data: p.data, savedAt: p.savedAt, raw: p.raw, encoding: p.encoding, app: p.app, redacted: p.redacted, maskedPaths: p.maskedPaths }))
          render(); toast('已合并')
        })
        $('restore-btn').addEventListener('click', () => { if (incoming) restoreWorkspace(incoming) })
        $('zp-collect').addEventListener('click', scan)
        $('zp-export').addEventListener('click', async () => {
          try {
            const value = hub ? await collectCurrent() : ZenPack.makePack(localStorage)
            products = value.products
            exportManifest(value, 'omm-zenpack.json')
          } catch (error) { toast('导出失败：' + error.message) }
        })
        $('zp-file').addEventListener('change', async (e) => {
          const f = e.target.files[0]; if (!f) return
          try {
            zpIncoming = ZenPack.readPack(await f.text())
            await showDiff(zpIncoming, $('zp-diff'))
            toast('ZenPack 校验通过')
          } catch (error) { zpIncoming = null; toast('导入失败：' + error.message) }
          finally { e.target.value = '' }
        })
        $('zp-restore').addEventListener('click', () => { if (zpIncoming) restoreWorkspace(zpIncoming) })
      }
      $('mode-badge').textContent = modeLabel
      $('mode-note').textContent = hub
        ? '通过父 Hub 的专用协议采集与恢复全部内置产品；只信任 URL 中明确的 Hub origin 与父窗口。'
        : '扫描同源 localStorage 中已显式注册的产品键；不会把当前 origin 当作隔离桌面的全产品存储。'
      ZenUtil.themeInit()
      bind(); render()
    </script>
  </body>
</html>
