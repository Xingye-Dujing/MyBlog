<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的插件</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --paper: #ffffff;
        --soft: #f7f6f2;
        --accent: #f0b400;
        --serif: 'Literata', Georgia, 'Songti SC', SimSun, serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        display: flex;
        flex-direction: column;
      }
      header {
        height: 46px;
        border-bottom: 1px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
      }
      .mark {
        width: 22px;
        height: 22px;
        border: 1px solid var(--ink);
        display: grid;
        place-items: center;
        font-family: var(--serif);
        font-weight: 700;
      }
      .mark::after {
        content: '';
        position: absolute;
      }
      h1 { font-family: var(--serif); font-size: 14px; margin: 0; letter-spacing: 0.04em; }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        width: min(520px, 100%);
        border: 1px solid var(--ink);
        padding: 24px;
      }
      .card h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 10px; }
      .card p { font-size: 13px; line-height: 1.9; color: rgba(26,26,26,.62); margin: 0 0 16px; }
      .tip {
        border-left: 3px solid var(--accent);
        background: var(--soft);
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.8;
      }
      code { font-family: 'Literata', monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">我</span>
      <h1>我的插件</h1>
    </header>
    <main>
      <section class="card">
        <h2>插件已经运行</h2>
        <p>
          这是 <code>plugin-template</code> 的最小示例。把 <code>plugin.json</code>
          和页面资源一起压成 zip，就可以在 OMM-ZEN 的「插件 → 导入」中安装。
        </p>
        <div class="tip">
          入口页面写进 <code>plugin.json</code> 的 <code>entry</code>；
          所有资源使用相对路径，不要依赖 CDN，这样离线也能完整工作。
        </div>
      </section>
    </main>
  </body>
</html>
