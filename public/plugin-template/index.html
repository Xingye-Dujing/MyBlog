<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的插件</title>
    <link rel="stylesheet" href="../zen-style/zen.css" />
    <link rel="stylesheet" href="../zen-style/products/plugin-template.css" />
  </head>
  <body>
    <header class="template-head">
      <span class="mark">我</span>
      <h1>我的插件</h1>
    </header>
    <main class="template-main">
      <section class="card template-card">
        <h2>插件已经运行</h2>
        <p>
          这是 <code>plugin-template</code> 的最小示例。把 <code>plugin.json</code>
          和页面资源一起压成 zip，就可以在 OMM-ZEN 的“插件 → 导入”中安装。
        </p>
        <div class="tip template-tip">
          入口页面写进 <code>plugin.json</code> 的 <code>entry</code>；
          所有资源使用相对路径，不要依赖 CDN，这样离线也能完整工作。
        </div>
      </section>
    </main>
  </body>
</html>
