<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OMM-ZEN 工作台</title>
    <link rel="icon" href="icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
    <link rel="stylesheet" href="omm-hub.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button class="brand" id="brand" type="button" title="应用面板　Ctrl+0">
          <span class="brand-mark">Z</span>
          <span class="brand-name">OMM-ZEN</span>
        </button>

        <div class="tabs" id="tabs" role="tablist" aria-label="已打开的应用"></div>
        <button class="tab-add" id="tab-add" type="button" title="打开应用　Ctrl+0">＋</button>

        <div class="tools">
          <button class="tool" type="button" data-act="split-v" title="左右分屏　Ctrl+\">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" />
              <path d="M12 4v16" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="split-h" title="上下分屏　Ctrl+Shift+\">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" />
              <path d="M3 12h18" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="layout" title="布局预设">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="7" height="7" />
              <rect x="14" y="4" width="7" height="7" />
              <rect x="3" y="13" width="7" height="7" />
              <rect x="14" y="13" width="7" height="7" />
            </svg>
          </button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" data-act="focus" title="专注当前窗格　Ctrl+Shift+M">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
            </svg>
          </button>
          <button class="tool active" type="button" data-act="dock" title="显示/隐藏 Dock　Ctrl+Shift+D">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="15" width="18" height="5" />
              <path d="M6 15V9M12 15V6M18 15v-4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="plugins" title="插件管理">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 4h4v3a2 2 0 1 0 4 0V4h3v5h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H5v-7h3a2 2 0 1 0 0-4H5V4h4z" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="launcher" title="所有应用　Ctrl+0">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </button>
        </div>
      </header>

      <main id="workspace">
        <div id="pane-layer"></div>
        <div id="iframe-layer"></div>
        <div id="splitter-layer"></div>
        <div id="drop-layer">
          <div id="drop-hint"><span></span></div>
        </div>
      </main>

      <footer id="dock" aria-label="应用 Dock"></footer>
    </div>

    <div class="popover" id="launcher" hidden></div>
    <div class="popover" id="layout-menu" hidden>
      <button class="menu-item" type="button" data-preset="single"><span class="check"></span>单窗格</button>
      <button class="menu-item" type="button" data-preset="v2"><span class="check"></span>左右双栏</button>
      <button class="menu-item" type="button" data-preset="h2"><span class="check"></span>上下双栏</button>
      <button class="menu-item" type="button" data-preset="grid"><span class="check"></span>四宫格</button>
      <div class="menu-sep"></div>
      <button class="menu-item" type="button" data-preset="focus"><span class="check"></span>专注当前窗格<span class="hint">Esc</span></button>
    </div>
    <div class="popover" id="ctx-menu" hidden></div>
    <div id="plugin-panel" class="plugin-panel" hidden>
      <div class="pp-card" role="dialog" aria-modal="true" aria-labelledby="pp-title">
        <header class="pp-head">
          <div>
            <div class="pp-title" id="pp-title">插件管理</div>
            <div class="pp-status" id="pp-status">按需安装产品，或导入自己的插件</div>
          </div>
          <button class="pp-close" type="button" id="pp-close" title="关闭">×</button>
        </header>
        <nav class="pp-tabs">
          <button class="pp-tab active" type="button" data-pp-tab="installed">已安装</button>
          <button class="pp-tab" type="button" data-pp-tab="online">在线插件</button>
          <button class="pp-tab" type="button" data-pp-tab="import">导入插件</button>
          <button class="pp-tab" type="button" data-pp-tab="spec">插件规范</button>
        </nav>
        <div class="pp-body" id="pp-body"></div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="omm-hub.js"></script>
  </body>
</html>
