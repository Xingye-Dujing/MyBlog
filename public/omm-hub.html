<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OMM-ZEN 工作台</title>
    <link rel="icon" href="icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
    <link rel="stylesheet" href="omm-hub.css" />
  </head>
  <body data-omm-shell="hub">
    <div id="app">
      <header id="topbar">
        <button class="brand" id="brand" type="button" title="应用面板　Ctrl+0">
          <span class="brand-mark"><img src="icon.ico" alt="OMM-ZEN" /></span>
          <span class="brand-name">OMM-ZEN</span>
        </button>

        <div class="tabs" id="tabs" role="tablist" aria-label="已打开的应用"></div>
        <button class="tab-add" id="tab-add" type="button" title="打开应用　Ctrl+0">＋</button>

        <div class="tools">
          <button class="tool" type="button" data-act="split-v" title="左右分屏　Ctrl+\">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" />
              <path d="M12 4v16" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="split-h" title="上下分屏　Ctrl+Shift+\">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" />
              <path d="M3 12h18" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="layout" title="布局预设">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="7" height="7" />
              <rect x="14" y="4" width="7" height="7" />
              <rect x="3" y="13" width="7" height="7" />
              <rect x="14" y="13" width="7" height="7" />
            </svg>
          </button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" data-act="focus" title="专注当前窗格　Ctrl+Shift+M">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
            </svg>
          </button>
          <button class="tool active" type="button" data-act="dock" title="显示/隐藏 Dock　Ctrl+Shift+D">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="15" width="18" height="5" />
              <path d="M6 15V9M12 15V6M18 15v-4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="archive" title="存档：保存路径、快照与共享文件">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h18v12H3z" />
              <path d="M3 7l2-3h14l2 3" />
              <path d="M10 12h4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="plugins" title="插件管理">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 4h4v3a2 2 0 1 0 4 0V4h3v5h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H5v-7h3a2 2 0 1 0 0-4H5V4h4z" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="settings" title="外观设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 3a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 3h5l.3-3a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="launcher" title="所有应用　Ctrl+0">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </button>
        </div>
      </header>

      <main id="workspace">
        <div id="pane-layer"></div>
        <div id="iframe-layer"></div>
        <div id="splitter-layer"></div>
        <div id="drop-layer">
          <div id="drop-hint"><span></span></div>
        </div>
      </main>

      <footer id="dock" aria-label="应用 Dock"></footer>
      <button id="topbar-reveal" class="topbar-reveal" type="button" title="显示顶部菜单栏">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>

    <div class="popover" id="launcher" hidden></div>
    <div class="popover" id="layout-menu" hidden>
      <button class="menu-item" type="button" data-preset="single"><span class="check"></span>单窗格</button>
      <button class="menu-item" type="button" data-preset="v2"><span class="check"></span>左右双栏</button>
      <button class="menu-item" type="button" data-preset="h2"><span class="check"></span>上下双栏</button>
      <button class="menu-item" type="button" data-preset="grid"><span class="check"></span>四宫格</button>
      <div class="menu-sep"></div>
      <button class="menu-item" type="button" data-preset="focus"><span class="check"></span>专注当前窗格<span class="hint">Esc</span></button>
    </div>
    <div class="popover" id="ctx-menu" hidden></div>
    <div id="plugin-panel" class="plugin-panel" hidden>
      <div class="pp-card" role="dialog" aria-modal="true" aria-labelledby="pp-title">
        <header class="pp-head">
          <div>
            <div class="pp-title" id="pp-title">插件管理</div>
            <div class="pp-status" id="pp-status">按需安装产品，或导入自己的插件</div>
          </div>
          <button class="pp-close" type="button" id="pp-close" title="关闭">×</button>
        </header>
        <nav class="pp-tabs">
          <button class="pp-tab active" type="button" data-pp-tab="installed">已安装</button>
          <button class="pp-tab" type="button" data-pp-tab="online">在线插件</button>
          <button class="pp-tab" type="button" data-pp-tab="import">导入插件</button>
          <button class="pp-tab" type="button" data-pp-tab="update">更新</button>
          <button class="pp-tab" type="button" data-pp-tab="spec">插件规范</button>
        </nav>
        <div class="pp-body" id="pp-body"></div>
      </div>
    </div>
    <div id="hub-settings" class="plugin-panel" hidden>
      <div class="pp-card settings-card" role="dialog" aria-modal="true" aria-labelledby="hub-settings-title">
        <header class="pp-head">
          <div>
            <div class="pp-title" id="hub-settings-title">外观设置</div>
            <div class="pp-status">只影响工作台外壳，不改变各产品页面</div>
          </div>
          <button class="pp-close" type="button" id="hub-settings-close" title="关闭">×</button>
        </header>
        <div class="settings-body">
          <section class="setting">
            <div class="setting-label">圆角</div>
            <div class="segmented" id="hub-radius-options">
              <button type="button" data-hub-radius="0">0</button>
              <button type="button" data-hub-radius="4">4</button>
              <button type="button" data-hub-radius="8">8</button>
              <button type="button" data-hub-radius="12">12</button>
              <button type="button" data-hub-radius="16">16</button>
            </div>
          </section>
          <section class="setting">
            <div class="setting-label">强调色</div>
            <div class="swatches" id="hub-accent-options">
              <button type="button" data-hub-accent="amber" title="琥珀"></button>
              <button type="button" data-hub-accent="olive" title="橄榄"></button>
              <button type="button" data-hub-accent="rust" title="赭石"></button>
              <button type="button" data-hub-accent="blue" title="雾蓝"></button>
            </div>
          </section>
          <section class="setting">
            <div class="setting-label">界面动效</div>
            <button class="switch" id="hub-motion" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span>
              <span>启用过渡与进度动画</span>
            </button>
          </section>
          <section class="setting">
            <div class="setting-label">顶部菜单栏</div>
            <button class="switch" id="hub-topbar" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span>
              <span>显示顶部标签与工具</span>
            </button>
          </section>
          <section class="setting">
            <div class="setting-label">快捷键</div>
            <dl class="shortcut-list">
              <div><dt>Ctrl + 0</dt><dd>所有应用</dd></div>
              <div><dt>Ctrl + 1…9</dt><dd>打开第 N 个应用</dd></div>
              <div><dt>Ctrl + Tab</dt><dd>切换到下一个标签</dd></div>
              <div><dt>Ctrl + Shift + Tab</dt><dd>切换到上一个标签</dd></div>
              <div><dt>Ctrl + W</dt><dd>关闭当前标签</dd></div>
              <div><dt>Ctrl + \</dt><dd>左右分屏</dd></div>
              <div><dt>Ctrl + Shift + \</dt><dd>上下分屏</dd></div>
              <div><dt>Ctrl + Shift + M</dt><dd>专注当前窗格</dd></div>
              <div><dt>Ctrl + Shift + D</dt><dd>显示 / 隐藏 Dock</dd></div>
              <div><dt>Esc</dt><dd>关闭弹窗与浮层</dd></div>
            </dl>
          </section>
        </div>
        <footer class="settings-foot">
          <button class="pp-btn" type="button" id="hub-settings-reset">恢复默认</button>
          <button class="pp-btn primary" type="button" id="hub-settings-done">完成</button>
        </footer>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="omm-desktop.js"></script>
    <script src="omm-icons.js"></script>
    <script src="omm-hub.js"></script>
  </body>
</html>
