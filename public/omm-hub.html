<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>静书房</title>
    <link rel="icon" href="icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="zen/zen.css">
<link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
    <link rel="stylesheet" href="zen/products/hub.css" />
</head>
  <body data-omm-shell="hub">
    <div id="app">
      <header id="topbar">
        <button class="brand" id="brand" type="button" title="应用面板　Ctrl+0">
          <span class="brand-mark"><img src="icon.ico" alt="静书房" /></span>
          <span class="brand-name">静书房</span>
        </button>

        <div class="tabs" id="tabs" role="tablist" aria-label="已打开的应用"></div>
        <button class="tab-add" id="tabs-overflow" type="button" title="更多标签" hidden>»</button>
        <button class="tab-add" id="tab-add" type="button" title="打开应用　Ctrl+0">＋</button>

        <div class="tools">
          <button class="tool" type="button" data-act="split-v" title="左右分屏　Ctrl+\">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" />
              <path d="M12 4v16" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="split-h" title="上下分屏　Ctrl+Shift+\">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" />
              <path d="M3 12h18" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="layout" title="布局预设">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="7" height="7" />
              <rect x="14" y="4" width="7" height="7" />
              <rect x="3" y="13" width="7" height="7" />
              <rect x="14" y="13" width="7" height="7" />
            </svg>
          </button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" data-act="zen" id="zen-btn" title="静心专注模式　Ctrl+Shift+Z">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3c-3 3.5-5 6.4-5 9a5 5 0 0 0 10 0c0-2.6-2-5.5-5-9z" />
              <path d="M9.5 14.5c.6 1.4 1.6 2.2 2.5 2.2s1.9-.8 2.5-2.2" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="focus" title="专注当前窗格　Ctrl+Shift+M">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
            </svg>
          </button>
          <button class="tool active" type="button" data-act="dock" title="显示/隐藏 Dock　Ctrl+Shift+D">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="15" width="18" height="5" />
              <path d="M6 15V9M12 15V6M18 15v-4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="command" id="command-btn" title="命令面板　Ctrl+K">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6" />
              <path d="M16 16l4 4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="today" id="today-btn" title="今日：各产品数据一屏总览">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="timeline" id="timeline-btn" title="最近动态：跨产品时间线">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3.5 2" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="globalsearch" id="globalsearch-btn" title="全局内容搜索　Ctrl+Shift+F">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M15.5 15.5L21 21M7.5 9.5h6M7.5 12.5h4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="graph" id="knowledge-graph-btn" title="知识图谱：跨产品卡片关系图">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="6" r="2.3" /><circle cx="18" cy="7" r="2.3" /><circle cx="12" cy="18" r="2.3" />
              <path d="M8 7l8 0M7 8l4 8M17 9l-4 7" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="flow" id="data-flow-btn" title="数据流：产品间共享通道与实时流转">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9M4 12h13M4 17h9" /><path d="M15 4l3 3-3 3M17 14l3 3-3 3" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="notify" id="notify-btn" title="通知　Ctrl+Shift+N">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
              <path d="M10 21h4" />
            </svg>
            <span class="tool-badge" id="notify-badge" hidden>0</span>
          </button>
          <button class="tool" type="button" data-act="archive" data-omm-archive-toggle title="存档：保存路径、快照与共享文件">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h18v12H3z" />
              <path d="M3 7l2-3h14l2 3" />
              <path d="M10 12h4" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="plugins" title="插件管理">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 4h4v3a2 2 0 1 0 4 0V4h3v5h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H5v-7h3a2 2 0 1 0 0-4H5V4h4z" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="settings" title="外观设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 3a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 3h5l.3-3a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z" />
            </svg>
          </button>
          <button class="tool" type="button" data-act="launcher" title="所有应用　Ctrl+0">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </button>
        </div>
      </header>

      <main id="workspace">
        <div id="pane-layer"></div>
        <div id="iframe-layer"></div>
        <div id="splitter-layer"></div>
        <div id="drop-layer">
          <div id="drop-hint"><span></span></div>
        </div>
      </main>

      <footer id="dock" aria-label="应用 Dock"></footer>
      <button id="topbar-reveal" class="topbar-reveal" type="button" title="显示顶部菜单栏">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>

    <div class="popover" id="launcher" hidden></div>
    <div class="popover" id="layout-menu" hidden>
      <button class="menu-item" type="button" data-preset="single"><span class="check"></span>单窗格</button>
      <button class="menu-item" type="button" data-preset="v2"><span class="check"></span>左右双栏</button>
      <button class="menu-item" type="button" data-preset="h2"><span class="check"></span>上下双栏</button>
      <button class="menu-item" type="button" data-preset="grid"><span class="check"></span>四宫格</button>
      <div class="menu-sep"></div>
      <button class="menu-item" type="button" data-preset="focus"><span class="check"></span>专注当前窗格<span class="hint">Esc</span></button>
    </div>
    <!-- Hub dialogs: the shared ZenUI.modal owns the shell (backdrop, Escape,
         stacking, focus). Product content is stamped into a hidden holder and
         mounted into the shared modal on open. -->
    <template id="hub-plugin-tpl">
        <header class="pp-head">
          <div>
            <div class="pp-title" id="pp-title">插件管理</div>
            <div class="pp-status" id="pp-status">按需安装产品，或导入自己的插件</div>
          </div>
          <button class="pp-close" type="button" id="pp-close" title="关闭">×</button>
        </header>
        <nav class="pp-tabs">
          <button class="pp-tab active" type="button" data-pp-tab="installed">已安装</button>
          <button class="pp-tab" type="button" data-pp-tab="online">在线插件</button>
          <button class="pp-tab" type="button" data-pp-tab="import">导入插件</button>
          <button class="pp-tab" type="button" data-pp-tab="update">更新</button>
          <button class="pp-tab" type="button" data-pp-tab="spec">插件规范</button>
        </nav>
        <div class="pp-body" id="pp-body"></div>
    </template>
    <template id="hub-settings-tpl">
        <header class="pp-head">
          <div>
            <div class="pp-title" id="hub-settings-title">设置</div>
            <div class="pp-status">外观、启动、存储与备份；不改变各产品页面</div>
          </div>
          <button class="pp-close" type="button" id="hub-settings-close" title="关闭">×</button>
        </header>
        <div class="settings-body">
          <section class="setting">
            <div class="setting-label">外观</div>
            <div class="setting-hint">工作台固定使用 OMM-ZEN 统一样式（中性配色、浅色主题、0 圆角），不再提供主题色与深浅切换。</div>
          </section>
          <section class="setting">
            <div class="setting-label">顶部菜单栏</div>
            <button class="switch" id="hub-topbar" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span>
              <span>显示顶部标签与工具</span>
            </button>
          </section>
          <section class="setting">
            <div class="setting-label">静心专注</div>
            <label class="setting-inline" for="hub-focus-pomodoro">
              <span>专注时长</span>
              <select class="settings-select" id="hub-focus-pomodoro" data-zen-select>
                <option value="15">15 分钟</option><option value="25">25 分钟</option>
                <option value="45">45 分钟</option><option value="60">60 分钟</option>
                <option value="90">90 分钟</option>
              </select>
            </label>
            <label class="setting-inline" for="hub-focus-break">
              <span>休息时长</span>
              <select class="settings-select" id="hub-focus-break" data-zen-select>
                <option value="5">5 分钟</option><option value="10">10 分钟</option><option value="15">15 分钟</option>
              </select>
            </label>
            <label class="setting-inline" for="hub-focus-sound">
              <span>环境音（离线合成）</span>
              <select class="settings-select" id="hub-focus-sound" data-zen-select>
                <option value="none">关闭</option><option value="rain">雨声</option>
                <option value="noise">轻白噪</option><option value="coffee">咖啡馆低语</option>
              </select>
            </label>
            <button class="switch" id="hub-focus-dim" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span><span>专注时淡化其他窗格</span>
            </button>
            <button class="switch" id="hub-focus-dnd" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span><span>免打扰：隐藏通知提示</span>
            </button>
            <div class="setting-hint">点击顶部“静”按钮或按 Ctrl+Shift+Z 进入静心模式：番茄钟计时、可选环境音，让书桌只留下当前一件事。</div>
          </section>
          <section class="setting">
            <div class="setting-label">启动与会话</div>
            <button class="switch" id="hub-restore" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span>
              <span>启动时恢复上次的标签与分屏</span>
            </button>
            <label class="setting-inline" for="hub-sleep">
              <span>隐藏标签自动休眠</span>
              <select class="settings-select" id="hub-sleep" data-zen-select>
                <option value="0">从不</option>
                <option value="5">5 分钟</option>
                <option value="15">15 分钟</option>
                <option value="30">30 分钟</option>
              </select>
            </label>
            <label class="setting-inline" for="hub-snap">
              <span>定时快照（当前产品）</span>
              <select class="settings-select" id="hub-snap" data-zen-select>
                <option value="0">关闭</option>
                <option value="5">每 5 分钟</option>
                <option value="10">每 10 分钟</option>
                <option value="15">每 15 分钟</option>
                <option value="30">每 30 分钟</option>
                <option value="45">每 45 分钟</option>
                <option value="60">每 1 小时</option>
                <option value="120">每 2 小时</option>
                <option value="240">每 4 小时</option>
                <option value="360">每 6 小时</option>
                <option value="720">每 12 小时</option>
                <option value="1440">每 24 小时</option>
              </select>
            </label>
            <div class="setting-hint">休眠会释放隐藏产品的内存，再次点击标签时重新启动；应用数据不受影响。定时快照只记录当前正在使用的产品，内容没变化时自动跳过。</div>
          </section>
          <section class="setting">
            <div class="setting-label">AI 服务（全产品共用）</div>
            <label class="setting-inline" for="hub-ai-provider">
              <span>服务商</span>
              <select class="settings-select" id="hub-ai-provider" data-zen-select>
                <option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option>
                <option value="openrouter">OpenRouter</option><option value="zhipu">智谱</option>
                <option value="custom">自定义</option>
              </select>
            </label>
            <label class="setting-inline" for="hub-ai-base"><span>Base URL</span><input class="settings-input" id="hub-ai-base" type="text" spellcheck="false" placeholder="https://api.deepseek.com" /></label>
            <label class="setting-inline" for="hub-ai-model"><span>模型</span><input class="settings-input" id="hub-ai-model" type="text" spellcheck="false" placeholder="deepseek-flash" /></label>
            <label class="setting-inline" for="hub-ai-key"><span>API Key</span><input class="settings-input" id="hub-ai-key" type="password" autocomplete="off" placeholder="留空表示不修改" /></label>
            <label class="setting-inline" for="hub-ai-system"><span>系统提示词</span><textarea class="settings-input" id="hub-ai-system" rows="3" style="min-height:64px;resize:vertical" placeholder="可选，所有产品共用"></textarea></label>
            <div class="setting-actions">
              <button class="pp-btn primary" type="button" id="hub-ai-save">保存 AI 配置</button>
              <button class="pp-btn" type="button" id="hub-ai-load">读取当前配置</button>
              <button class="pp-btn" type="button" id="hub-ai-clear">清除密钥</button>
            </div>
            <div class="setting-hint" id="hub-ai-hint">在这里填写一次，所有支持 AI 的产品（如所思所想、语料库）都能通过工作台读取；各产品仍可保留自己的独立配置。密钥保存在本机 shared.json 中，不会随设置备份上传。</div>
          </section>
          <section class="setting">
            <div class="setting-label">布局与窗口</div>
            <button class="switch" id="hub-multimonitor" type="button" role="switch" aria-checked="true">
              <span class="switch-track"></span><span>按显示器记住各自的布局与分屏</span>
            </button>
            <div class="setting-hint">多屏使用时，每个显示器会恢复自己上次的标签与分屏。标签右键“脱离为独立窗口”可把某个产品放到单独窗口。</div>
            <div class="setting-actions">
              <button class="pp-btn" type="button" id="hub-reset-layout">重置布局</button>
              <button class="pp-btn" type="button" id="hub-close-all">关闭所有标签</button>
            </div>
          </section>
          <section class="setting">
            <div class="setting-label">存储与备份</div>
            <div class="storage-grid" id="hub-storage"><span class="storage-dim">正在统计…</span></div>
            <div class="setting-actions">
              <button class="pp-btn" type="button" id="hub-refresh-storage">刷新占用</button>
              <button class="pp-btn" type="button" id="hub-open-save">保存目录</button>
              <button class="pp-btn" type="button" id="hub-open-shared">共享目录</button>
            </div>
            <div class="setting-actions">
              <button class="pp-btn" type="button" id="hub-backup">备份设置与规则</button>
              <button class="pp-btn" type="button" id="hub-restore-pick">恢复备份…</button>
              <input type="file" id="hub-restore-file" accept=".json,application/json" hidden />
            </div>
            <div class="setting-hint">“设置与规则”备份只包含保存路径、快照/共享设置与频道规则，不包含文件或插件包；恢复前会自动备份当前配置。</div>
            <div class="setting-actions">
              <button class="pp-btn primary" type="button" id="hub-full-backup">全量备份（含文档…）</button>
              <button class="pp-btn" type="button" id="hub-full-restore-pick">从全量备份恢复…</button>
              <input type="file" id="hub-full-restore-file" accept=".zip,application/zip" hidden />
            </div>
            <div class="setting-hint" id="hub-full-backup-hint">全量备份会把所有产品的设置、共享空间、快照和已保存文档打成一个 zip，适合迁移到新电脑或长期归档。恢复会覆盖同名文件（不删除未包含的文件），并自动备份当前配置。</div>
          </section>
          <section class="setting">
            <div class="setting-label">云备份（可选，WebDAV）</div>
            <button class="switch" id="hub-cloud-enabled" type="button" role="switch" aria-checked="false">
              <span class="switch-track"></span><span>启用云备份（默认关闭）</span>
            </button>
            <label class="setting-inline" for="hub-cloud-url">
              <span>WebDAV 地址</span>
              <input class="settings-input" id="hub-cloud-url" type="text" spellcheck="false" placeholder="https://dav.example.com/jing-shufang/backup.zip" />
            </label>
            <label class="setting-inline" for="hub-cloud-user"><span>用户名</span><input class="settings-input" id="hub-cloud-user" type="text" autocomplete="off" /></label>
            <label class="setting-inline" for="hub-cloud-password"><span>密码 / 应用密码</span><input class="settings-input" id="hub-cloud-password" type="password" autocomplete="off" /></label>
            <label class="setting-inline" for="hub-cloud-schedule">
              <span>自动备份</span>
              <select class="settings-select" id="hub-cloud-schedule" data-zen-select>
                <option value="manual">仅手动</option><option value="daily">每天一次</option><option value="weekly">每周一次</option>
              </select>
            </label>
            <div class="setting-actions">
              <button class="pp-btn primary" type="button" id="hub-cloud-upload">立即上传备份</button>
              <button class="pp-btn" type="button" id="hub-cloud-download">下载并恢复</button>
              <button class="pp-btn" type="button" id="hub-cloud-clear">清除凭据</button>
            </div>
            <div class="setting-hint" id="hub-cloud-hint">完全可选：不启用时所有数据仍只在本机。凭据保存在工作台本地设置里，不写入 shared.json，也不会随设置备份导出。下载恢复会覆盖同名文件，恢复前自动备份当前配置。</div>
          </section>
          <section class="setting">
            <div class="setting-label">使用统计</div>
            <div class="usage-list" id="hub-usage"><span class="storage-dim">暂无记录</span></div>
            <div class="setting-actions">
              <button class="pp-btn" type="button" id="hub-dock-usage">Dock 按使用频率排序</button>
              <button class="pp-btn" type="button" id="hub-dock-fixed">恢复默认排序</button>
            </div>
            <div class="setting-hint">统计记录在工作台本地，只包含打开次数与使用时长。</div>
          </section>
          <section class="setting">
            <div class="setting-label">关于</div>
            <div class="about-line"><span>静书房</span><code id="hub-version">—</code></div>
            <div class="setting-actions">
              <button class="pp-btn" type="button" id="hub-check-update">检查框架更新</button>
            </div>
          </section>
          <section class="setting">
            <div class="setting-label">无障碍与阅读</div>
            <label class="setting-inline" for="hub-a11y-font">
              <span>工作台字号</span>
              <select class="settings-select" id="hub-a11y-font" data-zen-select>
                <option value="0.85">较小 85%</option><option value="1">标准 100%</option>
                <option value="1.15">较大 115%</option><option value="1.3">大号 130%</option>
                <option value="1.5">特大 150%</option>
              </select>
            </label>
            <button class="switch" id="hub-a11y-contrast" type="button" role="switch" aria-checked="false">

    <script>
    /* Hub dialogs use the shared OMM-ZEN modal stack.
     * omm-hub.js owns the dialog logic and caches the legacy wrapper ids at init;
     * each wrapper is recreated here as a hidden holder. Setting holder.hidden=false
     * mounts its (unchanged) content into a ZenUI.modal, and setting it to true
     * closes that modal. The shared shell supplies Escape / backdrop / stacking /
     * focus management, so no private dialog shell is needed. */
    (function () {
      'use strict';
      var modal = window.ZenUI && window.ZenUI.modal;
      if (!modal) return;
      var defs = [
        { id: 'plugin-panel',    tpl: 'hub-plugin-tpl',   title: '插件管理',      width: 'min(880px, 94vw)' },
        { id: 'hub-settings',    tpl: 'hub-settings-tpl', title: '设置',          width: 'min(450px, 94vw)' },
        { id: 'command-palette', tpl: 'hub-cmdk-tpl',     title: '命令面板',      width: 'min(640px, 94vw)' },
        { id: 'global-search',   tpl: 'hub-gsearch-tpl',  title: '全局内容搜索',  width: 'min(760px, 94vw)' },
        { id: 'knowledge-graph', tpl: 'hub-graph-tpl',    title: '知识图谱',      width: 'min(1100px, 94vw)' },
        { id: 'data-flow',       tpl: 'hub-flow-tpl',     title: '数据流',        width: 'min(880px, 94vw)' },
        { id: 'today-panel',     tpl: 'hub-today-tpl',    title: '今日',          width: 'min(560px, 94vw)' },
        { id: 'timeline-panel',  tpl: 'hub-timeline-tpl', title: '最近动态',      width: 'min(720px, 94vw)' }
      ];
      defs.forEach(function (def) {
        var tpl = document.getElementById(def.tpl);
        var holder = document.getElementById(def.id);
        if (!holder) {
          holder = document.createElement('div');
          holder.id = def.id;
          document.body.appendChild(holder);
        }
        if (tpl) holder.appendChild(tpl.content.cloneNode(true));

        var open = false;
        var handle = null;
        var restore = null;

        function focusInput() {
          var input = holder.querySelector('input:not([type="hidden"]):not([hidden]), textarea');
          if (!input || !input.focus) return;
          try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        }
        function openDialog() {
          if (open) { focusInput(); return; }
          open = true;
          holder.removeAttribute('hidden');
          restore = document.activeElement;
          handle = modal.open({
            title: def.title,
            width: def.width,
            ids: { title: 'hub-modal-title', body: 'hub-modal-body', foot: 'hub-modal-foot', close: 'hub-modal-close' },
            onMount: function (body) {
              body.appendChild(holder);
              focusInput();
            },
            onClose: function () {
              if (holder.parentNode !== document.body) document.body.appendChild(holder);
              holder.setAttribute('hidden', '');
              handle = null;
              open = false;
              if (restore && restore.focus) {
                try { restore.focus({ preventScroll: true }); } catch (e) { restore.focus(); }
              }
              restore = null;
            }
          });
        }
        function closeDialog() {
          if (!open) return;
          if (handle) handle.close();
          else { open = false; holder.setAttribute('hidden', ''); }
        }
        Object.defineProperty(holder, 'hidden', {
          configurable: true,
          get: function () { return !open; },
          set: function (value) { if (value) closeDialog(); else openDialog(); }
        });
        holder.setAttribute('hidden', '');
      });
    })();
    </script>
