<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>智能搜索</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="vendor/fonts/literata-sub.css" />
    <style>
      :root {
        --font-en: 'Literata', 'Georgia', 'Times New Roman', serif;
        --font-mono: 'Literata', 'SimSun', '宋体', 'NSimSun', serif;
        --bg: #fff;
        --text: #000;
        --text-dim: rgba(0, 0, 0, 0.35);
        --text-faint: rgba(0, 0, 0, 0.12);
        --border: #000;
        --border-dim: rgba(0, 0, 0, 0.15);
        --border-faint: rgba(0, 0, 0, 0.06);
        --hover: rgba(0, 0, 0, 0.04);
        --active-bg: #000;
        --active-text: #fff;
        --accent-red: #cc3333;
        --accent-green: #339933;
        --accent-blue: #3366cc;
        --accent-orange: #cc6600;
        --fscale: 1;
        --radius: 0px;
        --border-width: 1px;
        --border-style: solid;
        --border-alpha: 0.15;
      }
      body.theme-dark {
        --bg: #000;
        --text: #fff;
        --text-dim: rgba(255, 255, 255, 0.38);
        --text-faint: rgba(255, 255, 255, 0.14);
        --border: #fff;
        --border-dim: rgba(255, 255, 255, 0.16);
        --border-faint: rgba(255, 255, 255, 0.07);
        --hover: rgba(255, 255, 255, 0.06);
        --active-bg: #fff;
        --active-text: #000;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      *:not(svg):not(path):not(polyline):not(circle) { border-radius: var(--radius); }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: calc(13px * var(--fscale))/1.5 var(--font-mono);
        overflow: hidden;
        user-select: none;
        transition: background-color 0.25s, color 0.25s;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
      }
      button, input, textarea, select {
        font: inherit; color: var(--text); border-radius: var(--radius);
      }
      input, textarea, select { user-select: text; }
      button, input, select, textarea {
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      ::selection { background: rgba(51, 102, 204, 0.22); }
      body.theme-dark ::selection { background: rgba(80, 160, 255, 0.28); }

      body.bg-grid {
        background-image:
          linear-gradient(var(--border-faint) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-faint) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      body.bg-dots {
        background-image: radial-gradient(circle, var(--border-dim) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      body.bg-cross {
        background-image:
          linear-gradient(var(--border-faint) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-faint) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: 20px 20px;
      }
      body.bg-diagonal {
        background-image: repeating-linear-gradient(
          45deg, transparent, transparent 28px, var(--border-faint) 28px, var(--border-faint) 29px
        );
      }

      /* ---------- splash ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 9999; background: var(--bg);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.6s;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      .splash-logo {
        font-family: var(--font-mono); font-size: 28px; font-weight: 400;
        color: var(--text); letter-spacing: 8px; margin-bottom: 8px;
      }
      .splash-tagline {
        font-size: 10px; color: var(--text-dim); letter-spacing: 3px;
        text-transform: uppercase; margin-bottom: 40px; text-align: center;
      }
      .splash-enter {
        padding: 10px 32px; background: transparent;
        border: var(--border-width) var(--border-style) var(--border);
        color: var(--text); font-family: var(--font-mono); font-size: 11px;
        letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
        transition: all 0.15s; font-weight: 500;
      }
      .splash-enter:hover { box-shadow: inset 0 -2px 0 var(--text); background: var(--hover); }

      /* ---------- hidden top menu ---------- */
      #menu-trigger {
        position: fixed; top: 0; left: 0; width: 100%; height: 8px; z-index: 2000;
      }
      #top-menu {
        position: fixed; top: -48px; left: 0; width: 100%; height: 48px;
        background: var(--bg); border-bottom: var(--border-width) var(--border-style) var(--border);
        display: flex; align-items: center; justify-content: center; gap: 2px;
        z-index: 1999; transition: top 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        padding: 0 12px; overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      #top-menu::-webkit-scrollbar { display: none; }
      #menu-trigger:hover ~ #top-menu, #top-menu:hover, #top-menu.pinned,
      body.submenu-open #top-menu { top: 0; }
      .menu-group {
        display: flex; align-items: center; gap: 2px; padding: 0 6px;
        position: relative; flex-shrink: 0; touch-action: manipulation;
      }
      .menu-group + .menu-group:before {
        content: ''; position: absolute; left: -2px; top: 50%; transform: translateY(-50%);
        width: 1px; height: 20px; background: var(--border-dim);
      }
      .menu-label {
        font-size: calc(9px * var(--fscale)); letter-spacing: 1.5px; color: var(--text-faint);
        text-transform: uppercase; padding: 0 4px; font-weight: 500; white-space: nowrap;
      }
      .menu-btn {
        color: var(--text-dim); cursor: pointer; padding: 4px 10px;
        border: var(--border-width) var(--border-style) transparent; background: transparent;
        font-size: calc(11px * var(--fscale)); letter-spacing: 0.4px; white-space: nowrap;
        transition: 0.15s; min-height: 36px; display: inline-flex; align-items: center;
      }
      .menu-btn:hover { color: var(--text); border-color: var(--border); background: var(--hover); }
      .menu-btn.active { color: var(--text); border-color: var(--border); box-shadow: inset 0 -2px 0 var(--text); }
      .pin-btn {
        width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
        border: var(--border-width) var(--border-style) transparent; cursor: pointer;
        color: var(--text-faint); transition: all 0.15s; margin-left: 2px; background: transparent;
        flex-shrink: 0;
      }
      .pin-btn:hover { color: var(--text); border-color: var(--border-dim); }
      .pin-btn.pinned {
        color: var(--text); border-color: var(--border); background: var(--hover);
        box-shadow: inset 0 -2px 0 var(--text);
      }
      .pin-btn svg { width: 14px; height: 14px; display: block; }

      /* ---------- dropdowns ---------- */
      .dropdown {
        position: fixed; top: 52px; left: 8px; min-width: 240px; max-width: min(360px, 92vw);
        background: var(--bg); border: var(--border-width) var(--border-style) var(--border);
        padding: 6px; z-index: 2100; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-4px);
        transition: opacity 0.18s, transform 0.18s, visibility 0.18s;
      }
      .dropdown.open { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
      .dd-title {
        font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-faint);
        padding: 8px 8px 5px; border-bottom: var(--border-width) var(--border-style) var(--border-faint);
        margin-bottom: 4px;
      }
      .dd-title:not(:first-child) { margin-top: 6px; }
      .dd-item {
        display: block; width: 100%; text-align: left; padding: 7px 9px; border: 0;
        background: transparent; color: var(--text-dim); cursor: pointer; font-size: 11px;
        letter-spacing: 0.3px;
      }
      .dd-item:hover { background: var(--hover); color: var(--text); }
      .dd-item .k { color: var(--text-faint); float: right; font-size: 10px; }
      .dd-field {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 5px 8px; font-size: 11px; color: var(--text-dim);
      }
      .dd-field > span { flex-shrink: 0; }
      .dd-input, .dd-select {
        flex: 1; min-width: 0; background: transparent; border: var(--border-width) var(--border-style) var(--border-dim);
        padding: 5px 7px; outline: none; color: var(--text); font-size: 11px;
      }
      .dd-input:focus, .dd-select:focus { border-color: var(--text); }
      .dd-check { display: flex; align-items: center; gap: 8px; padding: 7px 8px; font-size: 11px; color: var(--text-dim); cursor: pointer; }
      .dd-check input { accent-color: var(--text); }
      .dd-actions { display: flex; gap: 6px; padding: 8px; }
      .dd-note {
        font-size: 10px; line-height: 1.7; color: var(--text-faint); padding: 8px;
        border-top: var(--border-width) var(--border-style) var(--border-faint); margin-top: 4px;
      }
      .history-item {
        display: block; width: 100%; text-align: left; border: 0; background: transparent;
        padding: 8px 9px; cursor: pointer; border-bottom: var(--border-width) var(--border-style) var(--border-faint);
      }
      .history-item:hover { background: var(--hover); }
      .history-item .h-q { font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .history-item .h-m { font-size: 9px; color: var(--text-faint); margin-top: 2px; }
      .h-del { float: right; border: 0; background: transparent; color: var(--text-faint); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
      .h-del:hover { color: var(--accent-red); }

      /* ---------- main ---------- */
      #app { position: absolute; inset: 0; overflow-y: auto; user-select: text; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 24px 90px; }
      .hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .brand { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
      .brand-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.6px; }
      .brand-sub .free { color: var(--accent-green); }
      .searchbar {
        display: flex; align-items: stretch; border: var(--border-width) var(--border-style) var(--border);
        margin-top: 18px; background: var(--bg);
      }
      .searchbar:focus-within { box-shadow: inset 0 -2px 0 var(--text); }
      .searchbar input.q {
        flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
        padding: 16px 18px; font-size: calc(16px * var(--fscale)); color: var(--text);
      }
      .searchbar input.q::placeholder { color: var(--text-faint); }
      .searchbar button {
        border: 0; border-left: var(--border-width) var(--border-style) var(--border-dim);
        background: transparent; padding: 0 22px; cursor: pointer; font-size: 11px;
        letter-spacing: 2px; transition: background 0.15s; white-space: nowrap;
      }
      .searchbar button:hover { background: var(--hover); }
      .searchbar button.stop { display: none; color: var(--accent-red); }
      .searchbar.searching button.go { display: none; }
      .searchbar.searching button.stop { display: block; }
      .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
      .chip {
        border: var(--border-width) var(--border-style) var(--border-dim); background: transparent;
        color: var(--text-dim); padding: 5px 10px; font-size: 11px; cursor: pointer; transition: 0.15s;
      }
      .chip:hover { border-color: var(--text); color: var(--text); }

      .statusbar {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 9px 0; margin-top: 26px; border-bottom: var(--border-width) var(--border-style) var(--border-faint);
        font-size: 11px; color: var(--text-dim); min-height: 34px;
      }
      .status-dot { width: 6px; height: 6px; background: var(--text-faint); flex-shrink: 0; }
      .status-dot.busy { background: var(--accent-blue); animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      #status-text { color: var(--text); }
      .status-meta { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
      .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0 14px; }
      .seg { display: inline-flex; }
      .seg button {
        background: transparent; border: var(--border-width) var(--border-style) var(--border-dim);
        color: var(--text-dim); padding: 6px 11px; cursor: pointer;
        font-size: calc(11px * var(--fscale)); letter-spacing: 1px;
      }
      .seg button + button { border-left: 0; }
      .seg button.active {
        background: var(--hover); color: var(--text); border-color: var(--border);
        box-shadow: inset 0 -2px 0 var(--text);
      }
      .mini-btn {
        border: var(--border-width) dashed var(--border-dim); background: transparent;
        color: var(--text-dim); padding: 6px 12px; cursor: pointer;
        font-size: calc(11px * var(--fscale)); letter-spacing: 1px;
      }
      .mini-btn:hover { border-style: solid; border-color: var(--border); color: var(--text); }
      .mini-btn.primary { border-style: solid; color: var(--text); }

      .results { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 22px; align-items: start; }
      @media (max-width: 840px) { .results { grid-template-columns: 1fr; } }
      .panel { border: var(--border-width) var(--border-style) var(--border-dim); background: var(--bg); padding: 20px 22px; }
      .panel-t {
        font-size: calc(10px * var(--fscale)); letter-spacing: 2px; text-transform: uppercase;
        color: var(--text-dim); margin-bottom: 14px; display: flex; justify-content: space-between;
      }
      .answer-body { font-size: calc(14px * var(--fscale)); line-height: 1.85; word-break: break-word; }
      .answer-body h1, .answer-body h2, .answer-body h3, .answer-body h4 {
        font-weight: 600; line-height: 1.4; margin: 1.1em 0 0.5em;
      }
      .answer-body h1 { font-size: 1.35em; } .answer-body h2 { font-size: 1.2em; }
      .answer-body h3 { font-size: 1.08em; } .answer-body h4 { font-size: 1em; }
      .answer-body p { margin: 0 0 0.9em; }
      .answer-body ul, .answer-body ol { margin: 0 0 0.9em; padding-left: 1.6em; }
      .answer-body li { margin: 0.2em 0; }
      .answer-body strong { font-weight: 600; }
      .answer-body a { color: var(--accent-blue); text-decoration: underline; text-underline-offset: 2px; }
      .answer-body code {
        font-family: var(--font-mono); background: var(--hover); padding: 1px 4px; font-size: 0.9em;
      }
      .answer-body pre {
        background: var(--hover); padding: 12px 14px; overflow-x: auto; margin: 0 0 1em;
        border-left: 2px solid var(--border-dim);
      }
      .answer-body pre code { background: transparent; padding: 0; }
      .answer-body blockquote {
        border-left: 2px solid var(--border); padding-left: 14px; color: var(--text-dim); margin: 0 0 1em;
      }
      .answer-body table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 0.9em; }
      .answer-body th, .answer-body td {
        border: var(--border-width) var(--border-style) var(--border-dim); padding: 6px 9px; text-align: left;
      }
      .answer-body th { color: var(--text-dim); font-weight: 500; }
      .cite {
        color: var(--accent-blue); font-size: 9px; vertical-align: super; cursor: pointer;
        padding: 0 1px; line-height: 0;
      }
      .cite:hover { text-decoration: underline; }
      .err-box { color: var(--accent-red); font-size: 12px; line-height: 1.8; }
      .source-list { display: block; }
      .source {
        display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px;
        padding: 12px 4px; border-bottom: var(--border-width) var(--border-style) var(--border-faint);
        cursor: pointer; transition: background 0.12s, padding-left 0.15s;
      }
      .source:last-child { border-bottom: 0; }
      .source:hover { background: var(--hover); padding-left: 8px; }
      .source.flash { background: rgba(51, 102, 204, 0.1); }
      .source .idx { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
      .source .s-title { font-size: 13px; line-height: 1.5; }
      .source .s-title a { color: var(--text); text-decoration: none; }
      .source:hover .s-title a { text-decoration: underline; text-underline-offset: 2px; }
      .source .s-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 10px; color: var(--text-dim); }
      .source .s-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
      .source .s-snippet {
        font-size: 11px; color: var(--text-dim); line-height: 1.6; margin-top: 5px;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .tag {
        padding: 1px 6px; border: var(--border-width) var(--border-style) var(--border-dim);
        color: var(--text-dim); font-size: 10px;
      }
      .tag.cited { color: var(--accent-blue); border-color: var(--accent-blue); }
      .related { margin-top: 18px; }
      .related .rel-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }
      .empty-hint { text-align: center; color: var(--text-faint); padding: 5em 1em; letter-spacing: 1px; line-height: 2; font-size: 12px; }
      .hidden { display: none !important; }

      /* ---------- enhancements ---------- */
      .find-input {
        flex: 1; min-width: 120px; max-width: 220px; background: transparent;
        border: var(--border-width) var(--border-style) var(--border-dim);
        padding: 5px 9px; outline: none; color: var(--text); font-size: calc(11px * var(--fscale));
      }
      .find-input::placeholder { color: var(--text-faint); }
      .find-input:focus { border-color: var(--text); }
      .mini-btn.on { border-style: solid; color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
      .panel-actions { display: flex; align-items: center; gap: 12px; }
      .txt-btn {
        border: 0; background: transparent; color: var(--text-dim); font-size: 10px;
        letter-spacing: 1px; cursor: pointer; padding: 0 2px;
      }
      .txt-btn:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
      .src-copy {
        border: var(--border-width) var(--border-style) var(--border-faint); background: transparent;
        color: var(--text-faint); font-size: 9px; padding: 0 5px; cursor: pointer;
      }
      .src-copy:hover { border-color: var(--border); color: var(--text); }
      mark { background: rgba(51, 102, 204, 0.16); color: inherit; padding: 0 1px; }
      .turn-note {
        font-size: 10px; color: var(--text-dim); line-height: 1.8; margin: -4px 0 14px;
        padding-bottom: 10px; border-bottom: var(--border-width) var(--border-style) var(--border-faint);
      }
      .turn-q { color: var(--text); }
      .turn-arrow { color: var(--text-faint); padding: 0 7px; }
      .turn-cur { color: var(--accent-blue); }
      .follow-bar {
        display: flex; align-items: stretch; margin-top: 18px;
        border-top: var(--border-width) var(--border-style) var(--border-faint); padding-top: 14px;
      }
      .follow-bar input {
        flex: 1; min-width: 0; background: transparent; border: var(--border-width) var(--border-style) var(--border-dim);
        border-right: 0; padding: 8px 11px; outline: none; font-size: calc(12px * var(--fscale)); color: var(--text);
      }
      .follow-bar input::placeholder { color: var(--text-faint); }
      .follow-bar input:focus { border-color: var(--text); }
      .follow-bar button {
        border: var(--border-width) var(--border-style) var(--border-dim); background: transparent;
        color: var(--text-dim); padding: 0 14px; cursor: pointer; font-size: 11px; letter-spacing: 1px;
      }
      .follow-bar button:hover { color: var(--text); border-color: var(--text); background: var(--hover); }
      .err-box .mini-btn { margin-top: 10px; }
      .sel-search {
        position: fixed; z-index: 2500; display: none; padding: 6px 11px; background: var(--bg);
        border: var(--border-width) var(--border-style) var(--text); color: var(--text);
        font-size: 11px; letter-spacing: 1px; cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .sel-search.show { display: block; }

      /* ---------- toast ---------- */
      #toast {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px);
        background: var(--bg); border: var(--border-width) var(--border-style) var(--border);
        padding: 9px 16px; font-size: 11px; letter-spacing: 0.5px; z-index: 3000;
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); max-width: 90vw; text-align: center;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">SEARCH</div>
      <div class="splash-tagline">免费联网智能搜索 · 引用溯源 · 一键导出</div>
      <button class="splash-enter" id="splash-enter">进入</button>
    </div>

    <div id="menu-trigger"></div>
    <nav id="top-menu">
      <div class="menu-group">
        <span class="menu-label">Search</span>
        <button class="menu-btn" id="m-new">新搜索</button>
        <button class="menu-btn" id="m-stop">停止</button>
        <button class="menu-btn" id="m-history">历史</button>
      </div>
      <div class="menu-group">
        <span class="menu-label">Export</span>
        <button class="menu-btn" data-open="dd-export">导出</button>
        <button class="menu-btn" id="m-copy">复制 Markdown</button>
      </div>
      <div class="menu-group">
        <span class="menu-label">View</span>
        <button class="menu-btn" id="m-theme">主题</button>

    <script>
      ;(function () {
        'use strict'

        var LS = 'omm-search-v1'
        var DEFAULT = {
          settings: {
            theme: 'light', bg: 'void', fontScale: 1,
            apiBase: 'https://api.deepseek.com', apiModel: 'deepseek-flash', apiKey: '',
            thinking: false, forceWeb: false, timeRange: 'all', filter: 'all', sort: 'relevance'
          },
          history: []
        }
        var SYS_PROMPT =
          '你是一个严谨的智能搜索引擎。请基于联网搜索到的资料回答用户问题：' +
          '用中文、简洁清晰、分点作答；重要事实后紧跟来源引用；同一来源只引用一次。' +
          '不要编造来源，不要输出与问题无关的内容。使用 Markdown 格式（标题、列表、加粗、表格）整理答案。'

        function clone(x) { return JSON.parse(JSON.stringify(x)) }
        function load() {
          try {
            var raw = localStorage.getItem(LS)
            if (!raw) return clone(DEFAULT)
            var o = JSON.parse(raw) || {}
            return {
              settings: Object.assign({}, DEFAULT.settings, o.settings || {}),
              history: Array.isArray(o.history) ? o.history : []
            }
          } catch (e) { return clone(DEFAULT) }
        }
        var S = load()
        function save() { try { localStorage.setItem(LS, JSON.stringify(S)) } catch (e) {} }

        // 静书房工作台配置过一次密钥后，本产品自动继承。
        try {
          if (window.OMMDesktop && window.OMMDesktop.aiConfig && !S.settings.apiKey) {
            window.OMMDesktop.aiConfig().then(function (res) {
              var ai = res && res.ai
              if (!ai || !ai.apiKey) return
              S.settings.apiKey = ai.apiKey
              if (ai.apiBase) S.settings.apiBase = ai.apiBase
              if (ai.apiModel) S.settings.apiModel = ai.apiModel
              applySettings(); save()
            }).catch(function () {})
          }
        } catch (e) {}

        var $ = function (id) { return document.getElementById(id) }
        var current = null
        var searching = false
        var abort = null
        var startTime = 0
        var lastRender = 0
        var toastTimer = 0
        var findText = ''
        var historyFilter = ''
        var selText = ''

        function toast(msg) {
          var t = $('toast')
          t.textContent = String(msg || '')
          t.classList.add('show')
          clearTimeout(toastTimer)
          toastTimer = setTimeout(function () { t.classList.remove('show') }, 2800)
        }

        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        }
        function highlight(text, kw) {
          var s = esc(text)
          if (!kw) return s
          try {
            var re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi')
            return s.replace(re, '<mark>$1</mark>')
          } catch (e) { return s }
        }
        function hostOf(url) {
          try { return new URL(url).hostname } catch (e) { return String(url || '').slice(0, 40) }
        }
        function fmtDate(v) {
          if (!v) return ''
          var d = new Date(v)
          if (isNaN(d.getTime())) return String(v).slice(0, 10)
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        }
        function fmtTime(ms) {
          if (ms < 1000) return ms + ' ms'
          return (ms / 1000).toFixed(1) + ' s'
        }
        function sysPrompt() {
          return SYS_PROMPT + (S.settings.forceWeb ? ' 本轮必须执行联网搜索，不得仅凭内部知识作答。' : '')
        }

        /* ---------------- settings ---------------- */
        function applySettings() {
          var st = S.settings
          document.body.classList.toggle('theme-dark', st.theme === 'dark')
          document.body.classList.remove('bg-grid', 'bg-dots', 'bg-cross', 'bg-diagonal')
          if (st.bg && st.bg !== 'void') document.body.classList.add('bg-' + st.bg)
          document.documentElement.style.setProperty('--fscale', String(st.fontScale || 1))
          var inputs = {
            'set-base': st.apiBase, 'set-model': st.apiModel, 'set-key': st.apiKey,
            'set-theme': st.theme, 'set-bg': st.bg, 'set-scale': st.fontScale
          }
          Object.keys(inputs).forEach(function (id) { var el = $(id); if (el) el.value = inputs[id] })
          var th = $('set-thinking'); if (th) th.checked = !!st.thinking
          var fw = $('set-force'); if (fw) fw.checked = !!st.forceWeb
          syncSegs()
        }
        function syncSegs() {
          document.querySelectorAll('#seg-filter button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-filter') === S.settings.filter)
          })
          document.querySelectorAll('#seg-sort button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-sort') === S.settings.sort)
          })
          document.querySelectorAll('#seg-time button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-time') === (S.settings.timeRange || 'all'))
          })
          $('force-btn').classList.toggle('on', !!S.settings.forceWeb)
        }

        /* ---------------- dropdowns ---------------- */
        function closeDropdowns() {
          document.querySelectorAll('.dropdown.open').forEach(function (d) { d.classList.remove('open') })
        }
        function toggleDropdown(id) {
          var el = $(id)
          var wasOpen = el.classList.contains('open')
          closeDropdowns()
          if (!wasOpen) {
            if (id === 'dd-history') {
              historyFilter = ''
              $('history-filter').value = ''
              renderHistory()
            }
            el.classList.add('open')
          }
        }
        document.addEventListener('click', function (e) {
          if (!e.target.closest('.dropdown') && !e.target.closest('[data-open]') &&
              e.target.id !== 'm-history') closeDropdowns()
        })

        /* ---------------- markdown ---------------- */
        function mdInline(s) {
          s = esc(s)
          s = s.replace(/`([^`]+)`/g, '<code>$1</code>')
          s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>')
          s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>')
          s = s.replace(/\u0001(\d+)\u0002/g, '<sup class="cite" data-n="$1">[$1]</sup>')
          return s
        }
        function mdBlock(text) {
          var lines = String(text || '').split('\n')
          var out = []
          var i = 0
          function isHead(l) { return /^\s*#{1,4}\s/.test(l) }
          function isBlockStart(l) { return isHead(l) || /^\s*>/.test(l) || /^\s*[-*+]\s/.test(l) || /^\s*\d+\.\s/.test(l) }
          function sepRow(l) { return l.indexOf('-') >= 0 && /^\s*\|?[\s:|\-]+\|?\s*$/.test(l) }
          function cells(l) { return l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim() }) }
          while (i < lines.length) {
            var line = lines[i]
            if (!line.trim()) { i++; continue }
            if (line.indexOf('|') >= 0 && i + 1 < lines.length && sepRow(lines[i + 1])) {
              var head = cells(line); i += 2
              var rows = []
              while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) {
                rows.push(cells(lines[i])); i++
              }
              out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + mdInline(c) + '</th>' }).join('') +
                '</tr></thead><tbody>' + rows.map(function (r) {
                  return '<tr>' + r.map(function (c) { return '<td>' + mdInline(c) + '</td>' }).join('') + '</tr>'
                }).join('') + '</tbody></table>')
              continue
            }
            var h = line.match(/^\s*(#{1,4})\s+(.*)$/)
            if (h) {
              var lv = Math.min(h[1].length, 4)
              out.push('<h' + lv + '>' + mdInline(h[2]) + '</h' + lv + '>'); i++; continue
            }
            if (/^\s*>\s?/.test(line)) {
              out.push('<blockquote>' + mdInline(line.replace(/^\s*>\s?/, '')) + '</blockquote>'); i++; continue
            }
            var ul = line.match(/^\s*[-*+]\s+(.*)$/)
            if (ul) {
              var items = []
              while (i < lines.length) {
                var m = lines[i].match(/^\s*[-*+]\s+(.*)$/)
                if (!m) break
                items.push('<li>' + mdInline(m[1]) + '</li>'); i++
              }
              out.push('<ul>' + items.join('') + '</ul>'); continue
            }
            var ol = line.match(/^\s*\d+\.\s+(.*)$/)
            if (ol) {
              var oitems = []
              while (i < lines.length) {
                var m2 = lines[i].match(/^\s*\d+\.\s+(.*)$/)
                if (!m2) break
                oitems.push('<li>' + mdInline(m2[1]) + '</li>'); i++
              }
              out.push('<ol>' + oitems.join('') + '</ol>'); continue
            }
            var para = [line.trim()]; i++
            while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
              para.push(lines[i].trim()); i++
            }
            out.push('<p>' + mdInline(para.join('<br>')) + '</p>')
          }
          return out.join('')
        }
        function mdToHtml(src) {
          var parts = String(src || '').split(/```/)
          return parts.map(function (p, i) {
            if (i % 2 === 1) {
              var nl = p.indexOf('\n')
              var code = nl >= 0 ? p.slice(nl + 1) : p
              return '<pre><code>' + esc(code) + '</code></pre>'
            }
            return mdBlock(p)
          }).join('')
        }

        /* ---------------- search ---------------- */
        function mergeSources(list) {
          ;(list || []).forEach(function (s) {
            if (!s || !s.url) return
            for (var i = 0; i < current.sources.length; i++) if (current.sources[i].url === s.url) return
            current.sources.push({
              url: s.url,
              title: s.title || s.url,
              snippet: s.snippet || '',
              site: s.site_name || hostOf(s.url),
              icon: s.site_icon || '',
              date: s.page_age || s.published_at || ''
            })
          })
        }
        function addQueries(list) {
          ;(list || []).forEach(function (q) {
            if (q && current.queries.indexOf(q) < 0) current.queries.push(q)
          })
        }
        function sourceIndexOf(url) {
          for (var i = 0; i < current.sources.length; i++) if (current.sources[i].url === url) return i + 1
          return -1
        }
        function buildCitedText(text, annotations) {
          var marks = []
          ;(annotations || []).forEach(function (a) {
            var u = a && (a.url_citation || a)
            if (!u || typeof u.end_index !== 'number') return
            var n = sourceIndexOf(u.url)
            if (n < 0) {
              mergeSources([{ url: u.url, title: u.title || u.url }])
              n = sourceIndexOf(u.url)
            }
            marks.push({ pos: u.end_index, n: n })
          })
          marks.sort(function (a, b) { return a.pos - b.pos })
          var chars = Array.from(String(text || ''))
          var out = []
          var last = 0
          var usedPos = {}
          marks.forEach(function (m) {
            if (m.pos <= last || m.pos > chars.length || usedPos[m.pos]) return
            out.push(chars.slice(last, m.pos).join(''))
            out.push('\u0001' + m.n + '\u0002')
            last = m.pos
            usedPos[m.pos] = 1
          })
          out.push(chars.slice(last).join(''))
          return out.join('')
        }
        function setStatus(text, busy) {
          $('status-text').textContent = text
          $('status-dot').classList.toggle('busy', !!busy)
        }

        async function runSearch(query, opts) {
          opts = opts || {}
          var q = String(query || '').trim()
          if (!q) { toast('请输入搜索内容'); return }
          if (searching) { toast('正在搜索中，请先停止当前搜索'); return }
          var key = String(S.settings.apiKey || '').trim()
          if (!key) { toast('请先在设置中配置 DeepSeek API Key'); toggleDropdown('dd-settings'); return }

          var context = Array.isArray(opts.context) ? clone(opts.context) : []
          var reasoning = ''
          searching = true
          startTime = Date.now()
          lastRender = 0
          current = {
            query: q, answer: '', sources: [], queries: [], annotations: [], usage: null,
            elapsed: 0, ts: Date.now(), error: '', context: context,
            isFollowUp: context.length > 0, assistantMsg: null, serverToolCalls: null
          }
          $('q').value = q
          $('searchbar').classList.add('searching')
          $('statusbar').classList.remove('hidden')
          $('results').classList.remove('hidden')
          $('empty').classList.add('hidden')
          $('toolbar').classList.remove('hidden')
          renderCurrent()
          setStatus('正在连接搜索服务…', true)

          var controller = new AbortController()
          abort = controller
          var base = String(S.settings.apiBase || 'https://api.deepseek.com').replace(/\/$/, '')
          var url = /\/chat\/completions$/i.test(base) ? base : base + '/chat/completions'
          var messages = [{ role: 'system', content: sysPrompt() }]
            .concat(context)
            .concat([{ role: 'user', content: q }])
          var body = {
            model: S.settings.apiModel || 'deepseek-flash',
            messages: messages,
            tools: [{ type: 'deepseek_web_search' }, { type: 'deepseek_read_url' }],
            stream: true,
            thinking: { type: S.settings.thinking ? 'enabled' : 'disabled' }
          }
          var headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key }

          function handleChunk(obj) {
            if (obj.error) throw new Error(obj.error.message || JSON.stringify(obj.error))
            var ch = obj.choices && obj.choices[0]
            if (!ch) return
            var d = ch.delta || {}
            if (d.reasoning_content) {
              reasoning += d.reasoning_content
              if (S.settings.thinking) setStatus('正在多步思考与检索…', true)
            }

            var ev = ch.server_tool_event
            if (ev) {
              if (ev.type === 'call_started') {
                var a = ev.action || {}
                if (a.type === 'search') {
                  addQueries(a.queries)
                  setStatus('正在搜索：' + (a.queries || []).slice(0, 3).join(' · '), true)
                } else if (a.type === 'open_page' || a.type === 'read_link') {
                  setStatus('正在阅读：' + hostOf(a.url), true)
                } else if (a.type === 'find_in_page') {
                  setStatus('正在核对：' + (a.pattern || ''), true)
                }
              } else if (ev.type === 'call_completed') {
                if (ev.sources && ev.sources.length) {
                  mergeSources(ev.sources)
                  setStatus('已找到 ' + current.sources.length + ' 条结果，正在整理…', true)
                } else if (ev.page && ev.page.url) {
                  mergeSources([{ url: ev.page.url, title: ev.page.title || ev.page.url, site_name: hostOf(ev.page.url), published_at: ev.page.published_at }])
                  setStatus('正在整理来源…', true)
                }
              }
            }
            if (typeof d.content === 'string' && d.content) {
              current.answer += d.content
              setStatus('正在生成回答…', true)
              var now = Date.now()
              if (now - lastRender > 70) { renderAnswerOnly(); lastRender = now }
            }
            if (ch.finish_reason) {
              if (d.server_tool_calls) {
                current.serverToolCalls = d.server_tool_calls
                d.server_tool_calls.forEach(function (step) {
                  ;(step.calls || []).forEach(function (c) {
                    if (c.action && c.action.queries) addQueries(c.action.queries)
                    if (c.sources) mergeSources(c.sources)
                    if (c.page && c.page.url) mergeSources([{
                      url: c.page.url, title: c.page.title || c.page.url,
                      site_name: hostOf(c.page.url), published_at: c.page.published_at
                    }])
                  })
                })
              }
              if (d.annotations) current.annotations = d.annotations
              if (obj.usage) current.usage = obj.usage
            }
          }
          function consume(buffer) {
            var lines = buffer.split('\n')
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim()
              if (line.indexOf('data:') !== 0) continue
              var data = line.slice(5).trim()
              if (!data || data === '[DONE]') continue
              var obj
              try { obj = JSON.parse(data) } catch (e) { continue }
              handleChunk(obj)
            }
          }

          try {
            var res = await fetch(url, {
              method: 'POST', headers: headers, body: JSON.stringify(body), signal: controller.signal
            })
            if (!res.ok) {
              var tx = await res.text()
              if (res.status === 400 && /thinking|reasoning/i.test(tx) && body.thinking) {
                delete body.thinking
                res = await fetch(url, {
                  method: 'POST', headers: headers, body: JSON.stringify(body), signal: controller.signal
                })
                if (!res.ok) throw new Error(shortErr(await res.text()) || ('HTTP ' + res.status))
              } else {
                throw new Error(shortErr(tx) || ('HTTP ' + res.status))
              }
            }
            if (!res.body || !res.body.getReader) throw new Error('当前浏览器不支持流式读取')
            var reader = res.body.getReader()
            var decoder = new TextDecoder('utf-8')
            var buffer = ''
            while (true) {
              var rd = await reader.read()
              if (rd.done) break
              buffer += decoder.decode(rd.value, { stream: true })
              var parts = buffer.split('\n')
              buffer = parts.pop()
              consume(parts.join('\n'))
            }
            if (buffer.trim()) consume(buffer)
            setStatus('搜索完成', false)
          } catch (e) {
            if (e && e.name === 'AbortError') {
              current.error = '已停止本次搜索。'
              setStatus('已停止', false)
            } else {
              current.error = e && e.message ? e.message : String(e)
              setStatus('搜索失败', false)
              toast(current.error)
            }
          } finally {
            searching = false
            abort = null
            current.elapsed = Date.now() - startTime
            if (current.answer || current.sources.length) {
              var am = { role: 'assistant', content: current.answer }
              if (reasoning) am.reasoning_content = reasoning
              if (current.serverToolCalls) am.server_tool_calls = current.serverToolCalls
              if (current.annotations && current.annotations.length) am.annotations = current.annotations
              current.assistantMsg = am
            }
            $('searchbar').classList.remove('searching')
            renderCurrent()
            if (!opts.noHistory && current.query && (current.answer || current.sources.length)) pushHistory(current)
          }
        }
        function shortErr(tx) {
          try {
            var o = JSON.parse(tx)
            return (o.error && (o.error.message || o.error.type)) || ''
          } catch (e) { return String(tx || '').slice(0, 300) }
        }
        function followUp() {
          if (!current || !current.assistantMsg) { toast('当前结果无法追问，请先完成一次搜索'); return }
          var text = $('follow-input').value.trim()

          el.innerHTML = mdToHtml(buildCitedText(current.answer, current.annotations))
        }
        function visibleSources() {
          if (!current) return []
          var list = current.sources.slice()
          if (S.settings.filter === 'cited') {
            var cited = {}
            ;(current.annotations || []).forEach(function (a) { var u = a && (a.url_citation || a); if (u && u.url) cited[u.url] = 1 })
            list = list.filter(function (s) { return cited[s.url] })
          } else if (S.settings.filter === 'uncited') {
            var cited2 = {}
            ;(current.annotations || []).forEach(function (a) { var u = a && (a.url_citation || a); if (u && u.url) cited2[u.url] = 1 })
            list = list.filter(function (s) { return !cited2[s.url] })
          }
          var tr = S.settings.timeRange || 'all'
          if (tr !== 'all') {
            var days = tr === 'year' ? 365 : tr === 'month' ? 30 : 7
            var cutoff = Date.now() - days * 86400000
            list = list.filter(function (s) {
              var t = s.date ? new Date(s.date).getTime() : 0
              return !!t && t >= cutoff
            })
          }
          if (findText) {
            var ft = findText.toLowerCase()
            list = list.filter(function (s) {
              return String(s.title + ' ' + s.snippet + ' ' + s.site + ' ' + s.url).toLowerCase().indexOf(ft) >= 0
            })
          }
          if (S.settings.sort === 'time') {
            list.sort(function (a, b) { return (new Date(b.date || 0).getTime() || 0) - (new Date(a.date || 0).getTime() || 0) })
          }

        function renderCurrent() {

          $('status-meta').innerHTML =

        function download(filename, content, mime, bom) {

          var a = document.createElement('a')

        function hideSel() { $('sel-search').classList.remove('show') }
        document.addEventListener('mouseup', function (e) {
          if (e.target.closest('#sel-search, .dropdown, INPUT, TEXTAREA')) { hideSel(); return }
          setTimeout(function () {
            var sel = window.getSelection()
            var text = sel && sel.toString().trim()
            if (!text || text.length < 2 || text.length > 120 || !sel.rangeCount) { hideSel(); return }
            var rect = sel.getRangeAt(0).getBoundingClientRect()
            if (!rect.width && !rect.height) { hideSel(); return }
            selText = text
            var btn = $('sel-search')
            btn.classList.add('show')
            btn.style.left = Math.min(window.innerWidth - 130, Math.max(8, rect.left + rect.width / 2 - 55)) + 'px'
            btn.style.top = Math.max(8, rect.top - 36) + 'px'
          }, 10)
        })
        document.addEventListener('mousedown', function (e) {
          if (!e.target.closest('#sel-search')) hideSel()
        })
        window.addEventListener('scroll', hideSel, true)

        document.addEventListener('keydown', function (e) {
          var typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault(); $('q').focus(); $('q').select(); return
          }
          if (e.key === 'Escape') {
            closeDropdowns(); hideSel(); if (abort) abort.abort(); return
          }
          if (!typing && e.key === '/') { e.preventDefault(); $('q').focus() }
        })

        applySettings()
        renderSuggestions()
        renderHistory()
        renderCurrent()
      })()
    </script>
  </body>
</html>
