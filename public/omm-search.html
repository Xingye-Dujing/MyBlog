<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="zen/components/layer.js"></script>
    <script src="zen/components/toast.js"></script>
    <script src="zen/components/dialog.js"></script>
    <script src="zen/components/select.js"></script>
    <script src="zen/components/menu.js"></script>
    <script src="zen/components/shortcuts.js"></script>
    <script src="zen/components/index.js"></script>
<script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <script type="module" src="lib/zen-card.js"></script>

    <meta

</head>
  <body>
    <div id="splash">
      <div class="splash-logo">SEARCH</div>
      <div class="splash-tagline">免费联网智能搜索 · 引用溯源 · 一键导出</div>
      <button class="splash-enter" id="splash-enter">进入</button>
    </div>

    <div id="menu-trigger"></div>
    <nav id="top-menu">
      <div class="menu-group">
        <span class="menu-label">Search</span>
        <button class="menu-btn" id="m-new">新搜索</button>
        <button class="menu-btn" id="m-stop">停止</button>
        <button class="menu-btn" id="m-history">历史</button>
        <button class="menu-btn" id="m-kb" data-open="dd-kb">知识库</button>
      </div>
      <div class="menu-group">
        <span class="menu-label">Export</span>
        <button class="menu-btn" data-open="dd-export">导出</button>
        <button class="menu-btn" id="m-copy">复制 Markdown</button>
      </div>
      <div class="menu-group">
        <span class="menu-label">View</span>
        <button class="menu-btn" id="m-theme">主题</button>
        <button class="menu-btn" data-open="dd-settings">设置</button>
      </div>
      <button class="pin-btn" id="pin-btn" title="固定菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z" />
        </svg>
      </button>
    </nav>

    <div class="dropdown" id="dd-export">
      <div class="dd-title">导出当前结果</div>
      <button class="dd-item" data-export="json">JSON <span class="k">结构化数据</span></button>
      <button class="dd-item" data-export="md">Markdown <span class="k">摘要与来源</span></button>
      <button class="dd-item" data-export="csv">CSV <span class="k">来源表格</span></button>
      <button class="dd-item" data-export="html">HTML <span class="k">离线报告</span></button>
      <div class="dd-title">其他</div>
      <button class="dd-item" id="ex-copy">复制为 Markdown</button>
      <button class="dd-item" id="ex-history">导出全部历史 (JSON)</button>
    </div>

    <div class="dropdown" id="dd-history">
      <div class="dd-title">搜索历史 <span id="history-count" class="k">0</span></div>
      <label class="dd-field"><input class="dd-input" id="history-filter" placeholder="筛选历史…" /></label>
      <div id="history-list"></div>
      <div class="dd-actions"><button class="mini-btn" id="history-clear">清空历史</button></div>
    </div>

    <div class="dropdown" id="dd-kb" style="width:360px">
      <div class="dd-title">搜索知识库 <span id="kb-count" class="k">0</span></div>
      <label class="dd-field"><input class="dd-input" id="kb-filter" placeholder="全文检索：问题 / 摘要 / 来源 / 标签…" /></label>
      <label class="dd-check"><input type="checkbox" id="kb-pinned" /> 仅看置顶</label>
      <div class="dd-title" id="kb-stats" style="font-size:9px"></div>
      <div id="kb-list" style="max-height:300px;overflow:auto"></div>
      <div class="dd-actions">
        <button class="mini-btn" id="kb-export">导出卡片包</button>
        <label class="mini-btn" style="display:inline-flex;align-items:center;cursor:pointer">导入<input type="file" id="kb-import" accept=".json" hidden /></label>
      </div>
    </div>
    <div class="dropdown" id="dd-settings">
      <div class="dd-title">AI 服务 · DeepSeek</div>
      <label class="dd-field"><span>接口地址</span><input class="dd-input" id="set-base" placeholder="https://api.deepseek.com" /></label>
      <label class="dd-field"><span>模型</span><input class="dd-input" id="set-model" placeholder="deepseek-flash" /></label>
      <label class="dd-field"><span>API Key</span><input class="dd-input" id="set-key" type="password" placeholder="sk-..." /></label>
      <label class="dd-check"><input type="checkbox" id="set-thinking" /> 深度思考搜索（多步检索求证）</label>
      <label class="dd-check"><input type="checkbox" id="set-force" /> 强制联网（即使模型认为无需检索）</label>
      <div class="dd-title">显示</div>
      <label class="dd-field"><span>主题</span><select class="dd-select" id="set-theme" data-omm-select><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label class="dd-field"><span>背景</span><select class="dd-select" id="set-bg" data-omm-select><option value="void">无</option><option value="grid">网格</option><option value="dots">点阵</option><option value="cross">交叉</option><option value="diagonal">斜纹</option></select></label>
      <label class="dd-field"><span>字号</span><input class="dd-input" id="set-scale" type="number" min="0.8" max="1.4" step="0.05" /></label>
      <div class="dd-actions"><button class="mini-btn primary" id="set-save">保存设置</button></div>
      <div class="dd-note">联网搜索与网页抓取的工具调用本身不计费，仅按模型 Token 用量计费。密钥仅保存在本机浏览器，不会上传到任何第三方服务器。</div>
    </div>

      <div class="wrap">
        <div class="hero-top">

        <div class="searchbar" id="searchbar">

        <div class="suggestions" id="suggestions"></div>

        <div class="statusbar hidden" id="statusbar">
          <span class="status-dot" id="status-dot"></span>

          <span class="status-meta" id="status-meta"></span>
        </div>

        <div class="toolbar hidden" id="toolbar">
          <div class="seg" id="seg-filter">
            <button data-filter="all" class="active">全部</button>
            <button data-filter="cited">已引用</button>
            <button data-filter="uncited">未引用</button>
          </div>
          <div class="seg" id="seg-sort">
            <button data-sort="relevance" class="active">相关度</button>
            <button data-sort="time">时间</button>
          </div>
          <div class="seg" id="seg-time">
            <button data-time="all" class="active">不限时间</button>
            <button data-time="year">一年内</button>
            <button data-time="month">一月内</button>
            <button data-time="week">一周内</button>
          </div>
          <input class="find-input" id="find-input" placeholder="在结果中查找…" />
          <button class="mini-btn" id="force-btn" title="强制模型执行联网搜索">强制联网</button>
          <button class="mini-btn" data-open="dd-export">导出结果</button>
        </div>

        <div class="results hidden" id="results">
          <section class="panel">
            <div class="panel-t">
              <span>智能摘要</span>
              <span class="panel-actions">
                <button class="txt-btn" id="copy-answer">复制答案</button>
                <span id="answer-source-count"></span>
              </span>
            </div>
            <div class="turn-note hidden" id="turn-note"></div>
            <div class="answer-body" id="answer-body"></div>
            <div class="follow-bar hidden" id="follow-bar">
              <input id="follow-input" placeholder="基于本次搜索继续追问…" />
              <button id="follow-btn">追问</button>
            </div>
            <div class="related hidden" id="related">
              <div class="rel-title">相关搜索</div>
              <div class="suggestions" id="related-chips"></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-t"><span>结果来源</span><span id="source-count"></span></div>
            <div class="source-list" id="source-list"></div>
          </section>
        </div>

        <div class="empty-hint" id="empty">
          输入问题，开始一次免费的联网搜索。<br />
          答案由 DeepSeek 联网检索并附来源引用，结果可一键导出。
        </div>
      </div>
    </main>

    <button class="sel-search" id="sel-search">搜索选中内容</button>

    <script>
      ;(function () {
        'use strict'

        var LS = 'omm-search-v1'
        var DEFAULT = {
          settings: {
            theme: 'light', bg: 'void', fontScale: 1,
            apiBase: 'https://api.deepseek.com', apiModel: 'deepseek-flash', apiKey: '',
            thinking: false, forceWeb: false, timeRange: 'all', filter: 'all', sort: 'relevance'
          },
          history: []
        }
        var SYS_PROMPT =
          '你是一个严谨的智能搜索引擎。请基于联网搜索到的资料回答用户问题：' +
          '用中文、简洁清晰、分点作答；重要事实后紧跟来源引用；同一来源只引用一次。' +
          '不要编造来源，不要输出与问题无关的内容。使用 Markdown 格式（标题、列表、加粗、表格）整理答案。'

        function clone(x) { return JSON.parse(JSON.stringify(x)) }
        function load() {
          try {
            var raw = localStorage.getItem(LS)
            if (!raw) return clone(DEFAULT)
            var o = JSON.parse(raw) || {}
            return {
              settings: Object.assign({}, DEFAULT.settings, o.settings || {}),
              history: Array.isArray(o.history) ? o.history : []
            }
          } catch (e) { return clone(DEFAULT) }
        }
        var S = load()
        function save() { try { localStorage.setItem(LS, JSON.stringify(S)) } catch (e) {} }

        // 静书房工作台配置过一次密钥后，本产品自动继承。
        try {
          if (window.OMMDesktop && window.OMMDesktop.aiConfig && !S.settings.apiKey) {
            window.OMMDesktop.aiConfig().then(function (res) {
              var ai = res && res.ai
              if (!ai || !ai.apiKey) return
              S.settings.apiKey = ai.apiKey
              if (ai.apiBase) S.settings.apiBase = ai.apiBase
              if (ai.apiModel) S.settings.apiModel = ai.apiModel
              applySettings(); save()
            }).catch(function () {})
          }
        } catch (e) {}

        var $ = function (id) { return document.getElementById(id) }
        var current = null
        var searching = false
        var abort = null
        var startTime = 0
        var lastRender = 0
        var toastTimer = 0
        var findText = ''
        var historyFilter = ''
        var kbFilter = ''
        var kbPinned = false
        var selText = ''

        function toast(msg) { return window.ZenUI.toast(msg) }

        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        }
        function highlight(text, kw) {
          var s = esc(text)
          if (!kw) return s
          try {
            var re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi')
            return s.replace(re, '<mark>$1</mark>')
          } catch (e) { return s }
        }
        function hostOf(url) {
          try { return new URL(url).hostname } catch (e) { return String(url || '').slice(0, 40) }
        }
        function fmtDate(v) {
          if (!v) return ''
          var d = new Date(v)
          if (isNaN(d.getTime())) return String(v).slice(0, 10)
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        }
        function fmtTime(ms) {
          if (ms < 1000) return ms + ' ms'
          return (ms / 1000).toFixed(1) + ' s'
        }
        function sysPrompt() {
          return SYS_PROMPT + (S.settings.forceWeb ? ' 本轮必须执行联网搜索，不得仅凭内部知识作答。' : '')
        }

        /* ---------------- settings ---------------- */
        function applySettings() {
          var st = S.settings
          document.body.classList.toggle('theme-dark', st.theme === 'dark')
          document.body.classList.remove('bg-grid', 'bg-dots', 'bg-cross', 'bg-diagonal')
          if (st.bg && st.bg !== 'void') document.body.classList.add('bg-' + st.bg)
          document.documentElement.style.setProperty('--fscale', String(st.fontScale || 1))
          var inputs = {
            'set-base': st.apiBase, 'set-model': st.apiModel, 'set-key': st.apiKey,
            'set-theme': st.theme, 'set-bg': st.bg, 'set-scale': st.fontScale
          }
          Object.keys(inputs).forEach(function (id) { var el = $(id); if (el) el.value = inputs[id] })
          var th = $('set-thinking'); if (th) th.checked = !!st.thinking
          var fw = $('set-force'); if (fw) fw.checked = !!st.forceWeb
          syncSegs()
        }
        function syncSegs() {
          document.querySelectorAll('#seg-filter button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-filter') === S.settings.filter)
          })
          document.querySelectorAll('#seg-sort button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-sort') === S.settings.sort)
          })
          document.querySelectorAll('#seg-time button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-time') === (S.settings.timeRange || 'all'))
          })
          $('force-btn').classList.toggle('on', !!S.settings.forceWeb)
        }

        /* ---------------- dropdowns ---------------- */
        function closeDropdowns() {
          document.querySelectorAll('.dropdown.open').forEach(function (d) { d.classList.remove('open') })
        }
        function toggleDropdown(id) {
          var el = $(id)
          var wasOpen = el.classList.contains('open')
          closeDropdowns()
          if (!wasOpen) {
            if (id === 'dd-history') {
              historyFilter = ''
              $('history-filter').value = ''
              renderHistory()
            }
            el.classList.add('open')
          }
        }
        document.addEventListener('click', function (e) {
          if (!e.target.closest('.dropdown') && !e.target.closest('[data-open]') &&
              e.target.id !== 'm-history') closeDropdowns()
        })

        /* ---------------- markdown ---------------- */
        function mdInline(s) {
          s = esc(s)
          s = s.replace(/`([^`]+)`/g, '<code>$1</code>')
          s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>')
          s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>')
          s = s.replace(/\u0001(\d+)\u0002/g, '<sup class="cite" data-n="$1">[$1]</sup>')
          return s
        }
        function mdBlock(text) {
          var lines = String(text || '').split('\n')
          var out = []
          var i = 0
          function isHead(l) { return /^\s*#{1,4}\s/.test(l) }
          function isBlockStart(l) { return isHead(l) || /^\s*>/.test(l) || /^\s*[-*+]\s/.test(l) || /^\s*\d+\.\s/.test(l) }
          function sepRow(l) { return l.indexOf('-') >= 0 && /^\s*\|?[\s:|\-]+\|?\s*$/.test(l) }
          function cells(l) { return l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim() }) }
          while (i < lines.length) {
            var line = lines[i]
            if (!line.trim()) { i++; continue }
            if (line.indexOf('|') >= 0 && i + 1 < lines.length && sepRow(lines[i + 1])) {
              var head = cells(line); i += 2
              var rows = []
              while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) {
                rows.push(cells(lines[i])); i++
              }
              out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + mdInline(c) + '</th>' }).join('') +
                '</tr></thead><tbody>' + rows.map(function (r) {
                  return '<tr>' + r.map(function (c) { return '<td>' + mdInline(c) + '</td>' }).join('') + '</tr>'
                }).join('') + '</tbody></table>')
              continue
            }
            var h = line.match(/^\s*(#{1,4})\s+(.*)$/)
            if (h) {
              var lv = Math.min(h[1].length, 4)
              out.push('<h' + lv + '>' + mdInline(h[2]) + '</h' + lv + '>'); i++; continue
            }
            if (/^\s*>\s?/.test(line)) {
              out.push('<blockquote>' + mdInline(line.replace(/^\s*>\s?/, '')) + '</blockquote>'); i++; continue
            }
            var ul = line.match(/^\s*[-*+]\s+(.*)$/)
            if (ul) {
              var items = []
              while (i < lines.length) {
                var m = lines[i].match(/^\s*[-*+]\s+(.*)$/)
                if (!m) break
                items.push('<li>' + mdInline(m[1]) + '</li>'); i++
              }
              out.push('<ul>' + items.join('') + '</ul>'); continue
            }
            var ol = line.match(/^\s*\d+\.\s+(.*)$/)
            if (ol) {
              var oitems = []
              while (i < lines.length) {
                var m2 = lines[i].match(/^\s*\d+\.\s+(.*)$/)
                if (!m2) break
                oitems.push('<li>' + mdInline(m2[1]) + '</li>'); i++
              }
              out.push('<ol>' + oitems.join('') + '</ol>'); continue
            }
            var para = [line.trim()]; i++
            while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
              para.push(lines[i].trim()); i++
            }
            out.push('<p>' + mdInline(para.join('<br>')) + '</p>')
          }
          return out.join('')
        }
        function mdToHtml(src) {
          var parts = String(src || '').split(/```/)
          return parts.map(function (p, i) {
            if (i % 2 === 1) {
              var nl = p.indexOf('\n')
              var code = nl >= 0 ? p.slice(nl + 1) : p
              return '<pre><code>' + esc(code) + '</code></pre>'
            }
            return mdBlock(p)
          }).join('')
        }

        /* ---------------- search ---------------- */
        function mergeSources(list) {
          ;(list || []).forEach(function (s) {
            if (!s || !s.url) return
            for (var i = 0; i < current.sources.length; i++) if (current.sources[i].url === s.url) return
            current.sources.push({
              url: s.url,
              title: s.title || s.url,
              snippet: s.snippet || '',
              site: s.site_name || hostOf(s.url),
              icon: s.site_icon || '',
              date: s.page_age || s.published_at || ''
            })
          })
        }
        function addQueries(list) {
          ;(list || []).forEach(function (q) {
            if (q && current.queries.indexOf(q) < 0) current.queries.push(q)
          })
        }
        function sourceIndexOf(url) {
          for (var i = 0; i < current.sources.length; i++) if (current.sources[i].url === url) return i + 1
          return -1
        }
        function buildCitedText(text, annotations) {
          var marks = []
          ;(annotations || []).forEach(function (a) {
            var u = a && (a.url_citation || a)
            if (!u || typeof u.end_index !== 'number') return
            var n = sourceIndexOf(u.url)
            if (n < 0) {
              mergeSources([{ url: u.url, title: u.title || u.url }])
              n = sourceIndexOf(u.url)
            }
            marks.push({ pos: u.end_index, n: n })
          })
          marks.sort(function (a, b) { return a.pos - b.pos })
          var chars = Array.from(String(text || ''))
          var out = []
          var last = 0
          var usedPos = {}
          marks.forEach(function (m) {
            if (m.pos <= last || m.pos > chars.length || usedPos[m.pos]) return
            out.push(chars.slice(last, m.pos).join(''))
            out.push('\u0001' + m.n + '\u0002')
            last = m.pos
            usedPos[m.pos] = 1
          })
          out.push(chars.slice(last).join(''))
          return out.join('')
        }
        function setStatus(text, busy) {
          $('status-text').textContent = text
          $('status-dot').classList.toggle('busy', !!busy)
        }

        async function runSearch(query, opts) {
          opts = opts || {}
          var q = String(query || '').trim()
          if (!q) { toast('请输入搜索内容'); return }
          if (searching) { toast('正在搜索中，请先停止当前搜索'); return }
          var key = String(S.settings.apiKey || '').trim()
          if (!key) { toast('请先在设置中配置 DeepSeek API Key'); toggleDropdown('dd-settings'); return }

          var context = Array.isArray(opts.context) ? clone(opts.context) : []
          var reasoning = ''
          searching = true
          startTime = Date.now()
          lastRender = 0
          current = {
            query: q, answer: '', sources: [], queries: [], annotations: [], usage: null,
            elapsed: 0, ts: Date.now(), error: '', context: context,
            isFollowUp: context.length > 0, assistantMsg: null, serverToolCalls: null
          }
          $('q').value = q
          $('searchbar').classList.add('searching')
          $('statusbar').classList.remove('hidden')
          $('results').classList.remove('hidden')
          $('empty').classList.add('hidden')
          $('toolbar').classList.remove('hidden')
          renderCurrent()
          setStatus('正在连接搜索服务…', true)

          var controller = new AbortController()
          abort = controller
          var base = String(S.settings.apiBase || 'https://api.deepseek.com').replace(/\/$/, '')
          var url = /\/chat\/completions$/i.test(base) ? base : base + '/chat/completions'
          var messages = [{ role: 'system', content: sysPrompt() }]
            .concat(context)
            .concat([{ role: 'user', content: q }])
          var body = {
            model: S.settings.apiModel || 'deepseek-flash',
            messages: messages,
            tools: [{ type: 'deepseek_web_search' }, { type: 'deepseek_read_url' }],
            stream: true,
            thinking: { type: S.settings.thinking ? 'enabled' : 'disabled' }
          }
          var headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key }

          function handleChunk(obj) {
            if (obj.error) throw new Error(obj.error.message || JSON.stringify(obj.error))
            var ch = obj.choices && obj.choices[0]
            if (!ch) return
            var d = ch.delta || {}
            if (d.reasoning_content) {
              reasoning += d.reasoning_content
              if (S.settings.thinking) setStatus('正在多步思考与检索…', true)
            }

            var ev = ch.server_tool_event
            if (ev) {
              if (ev.type === 'call_started') {
                var a = ev.action || {}
                if (a.type === 'search') {
                  addQueries(a.queries)
                  setStatus('正在搜索：' + (a.queries || []).slice(0, 3).join(' · '), true)
                } else if (a.type === 'open_page' || a.type === 'read_link') {
                  setStatus('正在阅读：' + hostOf(a.url), true)
                } else if (a.type === 'find_in_page') {
                  setStatus('正在核对：' + (a.pattern || ''), true)
                }
              } else if (ev.type === 'call_completed') {
                if (ev.sources && ev.sources.length) {
                  mergeSources(ev.sources)
                  setStatus('已找到 ' + current.sources.length + ' 条结果，正在整理…', true)
                } else if (ev.page && ev.page.url) {
                  mergeSources([{ url: ev.page.url, title: ev.page.title || ev.page.url, site_name: hostOf(ev.page.url), published_at: ev.page.published_at }])
                  setStatus('正在整理来源…', true)
                }
              }
            }
            if (typeof d.content === 'string' && d.content) {
              current.answer += d.content
              setStatus('正在生成回答…', true)
              var now = Date.now()
              if (now - lastRender > 70) { renderAnswerOnly(); lastRender = now }
            }
            if (ch.finish_reason) {
              if (d.server_tool_calls) {
                current.serverToolCalls = d.server_tool_calls
                d.server_tool_calls.forEach(function (step) {
                  ;(step.calls || []).forEach(function (c) {
                    if (c.action && c.action.queries) addQueries(c.action.queries)
                    if (c.sources) mergeSources(c.sources)
                    if (c.page && c.page.url) mergeSources([{
                      url: c.page.url, title: c.page.title || c.page.url,
                      site_name: hostOf(c.page.url), published_at: c.page.published_at
                    }])
                  })
                })
              }
              if (d.annotations) current.annotations = d.annotations
              if (obj.usage) current.usage = obj.usage
            }
          }
          function consume(buffer) {
            var lines = buffer.split('\n')
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim()
              if (line.indexOf('data:') !== 0) continue
              var data = line.slice(5).trim()
              if (!data || data === '[DONE]') continue
              var obj
              try { obj = JSON.parse(data) } catch (e) { continue }
              handleChunk(obj)
            }
          }

          try {
            var res = await fetch(url, {
              method: 'POST', headers: headers, body: JSON.stringify(body), signal: controller.signal
            })
            if (!res.ok) {
              var tx = await res.text()
              if (res.status === 400 && /thinking|reasoning/i.test(tx) && body.thinking) {
                delete body.thinking
                res = await fetch(url, {
                  method: 'POST', headers: headers, body: JSON.stringify(body), signal: controller.signal
                })
                if (!res.ok) throw new Error(shortErr(await res.text()) || ('HTTP ' + res.status))
              } else {
                throw new Error(shortErr(tx) || ('HTTP ' + res.status))
              }
            }
            if (!res.body || !res.body.getReader) throw new Error('当前浏览器不支持流式读取')
            var reader = res.body.getReader()
            var decoder = new TextDecoder('utf-8')
            var buffer = ''
            while (true) {
              var rd = await reader.read()
              if (rd.done) break
              buffer += decoder.decode(rd.value, { stream: true })
              var parts = buffer.split('\n')
              buffer = parts.pop()
              consume(parts.join('\n'))
            }
            if (buffer.trim()) consume(buffer)
            setStatus('搜索完成', false)
          } catch (e) {
            if (e && e.name === 'AbortError') {
              current.error = '已停止本次搜索。'
              setStatus('已停止', false)
            } else {
              current.error = e && e.message ? e.message : String(e)
              setStatus('搜索失败', false)
              toast(current.error)
            }
          } finally {
            searching = false
            abort = null
            current.elapsed = Date.now() - startTime
            if (current.answer || current.sources.length) {
              var am = { role: 'assistant', content: current.answer }
              if (reasoning) am.reasoning_content = reasoning
              if (current.serverToolCalls) am.server_tool_calls = current.serverToolCalls
              if (current.annotations && current.annotations.length) am.annotations = current.annotations
              current.assistantMsg = am
            }
            $('searchbar').classList.remove('searching')
            renderCurrent()
            if (!opts.noHistory && current.query && (current.answer || current.sources.length)) pushHistory(current)
          }
        }
        function shortErr(tx) {
          try {
            var o = JSON.parse(tx)
            return (o.error && (o.error.message || o.error.type)) || ''
          } catch (e) { return String(tx || '').slice(0, 300) }
        }
        function followUp() {
          if (!current || !current.assistantMsg) { toast('当前结果无法追问，请先完成一次搜索'); return }
          var text = $('follow-input').value.trim()
          if (!text) { toast('请输入追问内容'); return }
          var ctx = (current.context || []).concat([
            { role: 'user', content: current.query }, current.assistantMsg
          ])
          $('follow-input').value = ''
          runSearch(text, { context: ctx })
        }

        /* ---------------- rendering ---------------- */
        function renderAnswerOnly() {
          var el = $('answer-body')
          if (!el || !current) return
          $('answer-source-count').textContent = searching
            ? '实时生成' : (current.error ? '失败' : (current.answer ? '已生成' : '等待中'))
          if (current.error && !current.answer) {
            el.innerHTML = '<div class="err-box">' + esc(current.error) +
              (searching ? '' : '<button class="mini-btn" id="retry-btn">重试</button>') + '</div>'
            return
          }
          el.innerHTML = mdToHtml(buildCitedText(current.answer, current.annotations))
        }
        function visibleSources() {
          if (!current) return []
          var list = current.sources.slice()
          if (S.settings.filter === 'cited') {
            var cited = {}
            ;(current.annotations || []).forEach(function (a) { var u = a && (a.url_citation || a); if (u && u.url) cited[u.url] = 1 })
            list = list.filter(function (s) { return cited[s.url] })
          } else if (S.settings.filter === 'uncited') {
            var cited2 = {}
            ;(current.annotations || []).forEach(function (a) { var u = a && (a.url_citation || a); if (u && u.url) cited2[u.url] = 1 })
            list = list.filter(function (s) { return !cited2[s.url] })
          }
          var tr = S.settings.timeRange || 'all'
          if (tr !== 'all') {
            var days = tr === 'year' ? 365 : tr === 'month' ? 30 : 7
            var cutoff = Date.now() - days * 86400000
            list = list.filter(function (s) {
              var t = s.date ? new Date(s.date).getTime() : 0
              return !!t && t >= cutoff
            })
          }
          if (findText) {
            var ft = findText.toLowerCase()
            list = list.filter(function (s) {
              return String(s.title + ' ' + s.snippet + ' ' + s.site + ' ' + s.url).toLowerCase().indexOf(ft) >= 0
            })
          }
          if (S.settings.sort === 'time') {
            list.sort(function (a, b) { return (new Date(b.date || 0).getTime() || 0) - (new Date(a.date || 0).getTime() || 0) })
          }
          return list
        }
        function renderCurrent() {

          if (!has) return

          var citedUrls = {}
          ;(current.annotations || []).forEach(function (a) { var u = a && (a.url_citation || a); if (u && u.url) citedUrls[u.url] = 1 })

          $('status-meta').innerHTML =
            '<span>结果 ' + current.sources.length + '</span>' +

            (current.usage && current.usage.server_tool_use

          renderAnswerOnly()

          var tn = $('turn-note')

            tn.innerHTML = '<span class="turn-q">追问链</span>' +
              users.map(function (m) { return '<span class="turn-arrow">→</span><span>' + esc(m.content) + '</span>' }).join('') +
              '<span class="turn-arrow">→</span><span class="turn-cur">' + esc(current.query) + '</span>'
            tn.classList.remove('hidden')
          } else tn.classList.add('hidden')
          $('follow-bar').classList.toggle('hidden', searching || !current.assistantMsg)

          var list = visibleSources()
          var html = ''
          list.forEach(function (s) {
            var n = sourceIndexOf(s.url)
            var isCited = !!citedUrls[s.url]
            html += '<div class="source" data-si="' + n + '">' +
              '<div class="idx">' + (n > 0 ? String(n).padStart(2, '0') : '·') + '</div>' +
              '<div>' +
              '<div class="s-title"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + highlight(s.title || s.url, findText) + '</a></div>' +
              '<div class="s-meta">' +
                (isCited ? '<span class="tag cited">已引用</span>' : '') +
                '<span>' + highlight(s.site || hostOf(s.url), findText) + '</span>' +
                (s.date ? '<span>' + esc(fmtDate(s.date)) + '</span>' : '') +
                '<span class="s-url">' + highlight(hostOf(s.url) + '/' + String(s.url).split('/').slice(3).join('/').slice(0, 48), findText) + '</span>' +
                '<button class="src-copy" data-copy="' + n + '" title="复制链接">复制</button>' +
              '</div>' +
              (s.snippet ? '<div class="s-snippet">' + highlight(s.snippet, findText) + '</div>' : '') +
              '</div></div>'
          })
          $('source-list').innerHTML = html || '<div class="empty-hint">' +
            (findText || S.settings.timeRange !== 'all' ? '没有匹配的结果，试试放宽筛选条件' : '该筛选下暂无结果') + '</div>'
          $('source-count').textContent = list.length + ' / ' + current.sources.length

          var rel = $('related')
          if (current.queries.length) {
            rel.classList.remove('hidden')
            $('related-chips').innerHTML = current.queries.map(function (q) {
              return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>'
            }).join('')
          } else rel.classList.add('hidden')

          document.querySelectorAll('.source').forEach(function (node) {

        /* ---------------- history ---------------- */

              '<button class="h-del" data-del="' + x.i + '" title="删除">×</button></div>' +

          if (!entries.length) {

        /* ---------------- export ---------------- */
        function safeName() {

        function download(filename, content, mime, bom) {
          var blob = typeof content === 'string'
            ? new Blob([bom ? '\ufeff' + content : content], { type: mime || 'text/plain;charset=utf-8' })
            : content
          var url = URL.createObjectURL(blob)
          var a = document.createElement('a')

          document.body.appendChild(a); a.click(); a.remove()

          else if (fmt === 'md') download(name + '.md', asMarkdown(), 'text/markdown;charset=utf-8')

        /* ---------------- suggestions ---------------- */
        var EXAMPLES = [

          $('suggestions').innerHTML = list.map(function (q) {
            return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>'
          }).join('')
        }

        /* ---------------- events ---------------- */
        $('splash-enter').addEventListener('click', function () {
          $('splash').classList.add('fade-out')
          setTimeout(function () { $('splash').style.display = 'none' }, 650)
          $('q').focus()
        })
        $('go').addEventListener('click', function () { runSearch($('q').value) })
        $('stop').addEventListener('click', function () { if (abort) abort.abort() })
        $('q').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); runSearch($('q').value) }
        })
        $('follow-btn').addEventListener('click', followUp)
        $('follow-input').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); followUp() }
        })
        $('history-filter').addEventListener('input', function () {
          historyFilter = this.value.trim(); renderHistory()
        })
        $('history-list').addEventListener('click', function (e) {
          var del = e.target.closest('[data-del]')
          if (del) {
            e.stopPropagation()
            S.history.splice(parseInt(del.getAttribute('data-del'), 10), 1)
            save(); renderHistory(); renderSuggestions(); toast('已删除该记录'); return
          }
          var it = e.target.closest('.history-item')
          if (!it) return
          var h = S.history[parseInt(it.getAttribute('data-h'), 10)]
          if (!h) return
          current = clone(h)
          current.elapsed = h.elapsed || 0
          $('q').value = h.query
          setStatus('历史记录', false)
          $('statusbar').classList.remove('hidden')
          $('results').classList.remove('hidden')
          $('toolbar').classList.remove('hidden')
          $('empty').classList.add('hidden')
          renderCurrent()
          closeDropdowns()
        })
        $('find-input').addEventListener('input', function () {
          findText = this.value.trim(); renderCurrent()
        })
        $('force-btn').addEventListener('click', function () {
          S.settings.forceWeb = !S.settings.forceWeb; save(); syncSegs()
          toast(S.settings.forceWeb ? '已开启强制联网' : '已关闭强制联网')
        })
        $('copy-answer').addEventListener('click', function () {
          if (!current || !current.answer) { toast('暂无答案'); return }
          copyText(current.answer, '已复制答案')
        })
        document.addEventListener('click', function (e) {
          var c = e.target.closest('[data-q]')
          if (c) { runSearch(c.getAttribute('data-q')); return }
          var d = e.target.closest('[data-open]')
          if (d) { toggleDropdown(d.getAttribute('data-open')); return }
          var ex = e.target.closest('[data-export]')
          if (ex) { exportAs(ex.getAttribute('data-export')); return }
          var cp = e.target.closest('[data-copy]')
          if (cp) {
            var src = current && current.sources[parseInt(cp.getAttribute('data-copy'), 10) - 1]
            if (src) copyText(src.url, '已复制链接')
            return
          }
          if (e.target.closest('#retry-btn')) {
            runSearch(current.query, { context: current.context, noHistory: true })
            return
          }
          if (e.target.closest('#sel-search')) {
            var t = selText
            hideSel()
            try { window.getSelection().removeAllRanges() } catch (err) {}
            if (t) runSearch(t)
            return
          }
          var cite = e.target.closest('.cite')
          if (cite) {
            var n = cite.getAttribute('data-n')
            var node = document.querySelector('.source[data-si="' + n + '"]')
            if (node) {
              node.scrollIntoView({ behavior: 'smooth', block: 'center' })
              node.classList.add('flash')
              setTimeout(function () { node.classList.remove('flash') }, 1200)
            }
          }
        })
        document.querySelectorAll('#seg-filter button').forEach(function (b) {
          b.addEventListener('click', function () {
            S.settings.filter = b.getAttribute('data-filter'); save(); syncSegs(); renderCurrent()
          })
        })
        document.querySelectorAll('#seg-sort button').forEach(function (b) {
          b.addEventListener('click', function () {
            S.settings.sort = b.getAttribute('data-sort'); save(); syncSegs(); renderCurrent()
          })
        })
        document.querySelectorAll('#seg-time button').forEach(function (b) {
          b.addEventListener('click', function () {
            S.settings.timeRange = b.getAttribute('data-time'); save(); syncSegs(); renderCurrent()
          })
        })
        $('m-new').addEventListener('click', function () {
          current = null; $('q').value = ''; findText = ''; $('find-input').value = ''
          renderCurrent(); renderSuggestions(); $('q').focus()
          setStatus('就绪', false); closeDropdowns()
        })
        $('m-stop').addEventListener('click', function () { if (abort) abort.abort() })
        $('m-history').addEventListener('click', function () { toggleDropdown('dd-history') })
        $('m-theme').addEventListener('click', function () {
          S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); applySettings()
        })
        $('m-copy').addEventListener('click', copyMarkdown)
        $('ex-copy').addEventListener('click', copyMarkdown)
        $('ex-history').addEventListener('click', function () {
          if (!S.history.length) { toast('暂无历史'); return }
          download('omm-search-history.json', JSON.stringify(S.history, null, 2), 'application/json')
          closeDropdowns()
        })
        $('history-clear').addEventListener('click', function () {
          S.history = []; save(); renderHistory(); renderSuggestions(); renderKB(); toast('已清空历史')
        })
        $('m-kb').addEventListener('click', function () { renderKB() })
        $('kb-filter').addEventListener('input', function () { kbFilter = this.value.trim(); renderKB() })
        $('kb-pinned').addEventListener('change', function () { kbPinned = !!this.checked; renderKB() })
        $('kb-list').addEventListener('click', function (e) {
          var pin = e.target.closest('[data-pin]')
          if (pin) {
            e.stopPropagation()
            var hp = S.history[parseInt(pin.getAttribute('data-pin'), 10)]
            if (hp) { hp.pinned = !hp.pinned; save(); renderKB(); toast(hp.pinned ? '已置顶' : '已取消置顶') }
            return
          }
          var tocard = e.target.closest('[data-tocard]')
          if (tocard) {
            e.stopPropagation()
            var hc = S.history[parseInt(tocard.getAttribute('data-tocard'), 10)]
            if (hc) kbToCard(hc)
            return
          }
          var send = e.target.closest('[data-send]')
          if (send) {
            e.stopPropagation()
            var he = S.history[parseInt(send.getAttribute('data-send'), 10)]
            if (he) {
              window.ZenUI.dialog.prompt('发送到哪个产品？', 'writer').then(function (target) {
                if (target) kbSend(he, target)
              })
            }
            return
          }
          var item = e.target.closest('[data-kb]')
          if (!item) return
          var h = S.history[parseInt(item.getAttribute('data-kb'), 10)]
          if (!h) return
          current = clone(h)
          $('q').value = h.query
          $('results').classList.remove('hidden')
          $('toolbar').classList.remove('hidden')
          $('empty').classList.add('hidden')
          renderCurrent(); closeDropdowns()
        })
        $('kb-export').addEventListener('click', function () {
          if (!window.SearchLibrary) { toast('知识库模块尚未加载'); return }
          download('omm-search-kb.json', window.SearchLibrary.pack(S.history, '搜索知识库'), 'application/json')
          closeDropdowns()
        })
        $('kb-import').addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0]
          if (!f || !window.SearchLibrary) return
          var reader = new FileReader()
          reader.onload = function () {
            try {
              var incoming = window.SearchLibrary.unpack(String(reader.result))
              incoming.forEach(function (entry) {
                S.history = S.history.filter(function (h) { return h.query !== entry.query })
                S.history.push(entry)
              })
              save(); renderHistory(); renderSuggestions(); renderKB()
              toast('已导入 ' + incoming.length + ' 条')
            } catch (err) { toast('导入失败：' + err.message) }
          }
          reader.readAsText(f)
          e.target.value = ''
        })
        $('set-save').addEventListener('click', function () {
          S.settings.apiBase = $('set-base').value.trim() || DEFAULT.settings.apiBase
          S.settings.apiModel = $('set-model').value.trim() || DEFAULT.settings.apiModel
          S.settings.apiKey = $('set-key').value.trim()
          S.settings.thinking = !!$('set-thinking').checked
          S.settings.forceWeb = !!$('set-force').checked
          S.settings.theme = $('set-theme').value
          S.settings.bg = $('set-bg').value
          var sc = parseFloat($('set-scale').value)
          S.settings.fontScale = isNaN(sc) ? 1 : Math.min(1.4, Math.max(0.8, sc))
          save(); applySettings(); closeDropdowns(); toast('设置已保存')
        })
        $('pin-btn').addEventListener('click', function () {
          var on = $('top-menu').classList.toggle('pinned')
          this.classList.toggle('pinned', on)
        })

        function hideSel() { $('sel-search').classList.remove('show') }
        document.addEventListener('mouseup', function (e) {
          if (e.target.closest('#sel-search, .dropdown, INPUT, TEXTAREA')) { hideSel(); return }
          setTimeout(function () {
            var sel = window.getSelection()
            var text = sel && sel.toString().trim()
            if (!text || text.length < 2 || text.length > 120 || !sel.rangeCount) { hideSel(); return }
            var rect = sel.getRangeAt(0).getBoundingClientRect()
            if (!rect.width && !rect.height) { hideSel(); return }
            selText = text
            var btn = $('sel-search')
            btn.classList.add('show')
            btn.style.left = Math.min(window.innerWidth - 130, Math.max(8, rect.left + rect.width / 2 - 55)) + 'px'
            btn.style.top = Math.max(8, rect.top - 36) + 'px'
          }, 10)
        })
        document.addEventListener('mousedown', function (e) {
          if (!e.target.closest('#sel-search')) hideSel()
        })
        window.addEventListener('scroll', hideSel, true)

        document.addEventListener('keydown', function (e) {
          var typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault(); $('q').focus(); $('q').select(); return
          }
          if (e.key === 'Escape') {
            closeDropdowns(); hideSel(); if (abort) abort.abort(); return
          }
          if (!typing && e.key === '/') { e.preventDefault(); $('q').focus() }
        })

        applySettings()
        renderSuggestions()
        renderHistory()
        renderKB()
        renderCurrent()
      })()
    </script>
  </body>
</html>
