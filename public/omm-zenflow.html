<!doctype html>
<html lang="zh-CN" data-omm-app="zenflow">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="zen/foundation/util.js"></script>
    <script src="zen/components/layer.js"></script>
    <script src="zen/components/popover.js"></script>
    <script src="zen/components/toast.js"></script>
    <script src="zen/components/dialog.js"></script>
    <script src="zen/components/select.js"></script>
    <script src="zen/components/menu.js"></script>
    <script src="zen/components/shortcuts.js"></script>
    <script src="zen/components/index.js"></script>
<script src="zen/components/tabs.js"></script>
<script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>自动化编排</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="zen/zen.css">
  <link rel="stylesheet" href="zen/features/tool.css" />
  <link rel="stylesheet" href="zen/canvas/canvas.css" />
  <link rel="stylesheet" href="zen/products/zenflow.css">
<link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
    <script src="zen/canvas/layout.js"></script>

</head>
  <body>
    <div id="app">
      <header class="top">
        <span class="brand">ZenFlow 自动化编排</span>
        <nav class="tabs" id="tabs" data-zen-tabs="views" data-zen-tab-item="button[data-view]" data-zen-tab-active="active">
          <button data-view="rules" data-zen-tab="rules" class="active" aria-selected="true">规则</button>
          <button data-view="editor" data-zen-tab="editor" aria-selected="false">编辑器</button>
          <button data-view="flow" data-zen-tab="flow" aria-selected="false">流程图</button>
          <button data-view="run" data-zen-tab="run" aria-selected="false">运行记录</button>
        </nav>
        <span class="spacer"></span>
        <div class="actions"><button class="zt-btn sm" id="theme-btn">深浅色</button></div>
      </header>
      <main class="narrow">
        <section class="view active" id="view-rules">
          <div class="zt-panel">
            <h2>工作流规则</h2>
            <p class="hint">规则按顺序执行：满足“当”条件的卡片会被“则”里的动作加工，并可发送到其他产品。</p>
            <div class="list" id="rule-list"></div>
          </div>
          <div class="zt-panel">
            <div class="zt-row tight">
              <button class="zt-btn primary" id="run-btn">对卡片库运行全部规则</button>
              <button class="zt-btn" id="export-btn">导出规则</button>
              <label class="zt-btn" style="display:inline-flex;align-items:center;justify-content:center">导入规则<input type="file" id="import-file" accept=".json" hidden /></label>
            </div>
          </div>
        </section>

        <section class="view" id="view-editor">
          <div class="zt-panel">
            <h2 id="editor-title">新建规则</h2>
            <label class="zt-field"><span>名称</span><input id="r-name" placeholder="例如：搜索结果归档" /></label>
            <div class="zt-row">
              <label class="zt-field"><span>优先级（小者先执行）</span><input id="r-priority" type="number" value="0" /></label>
              <label class="zt-field"><span>启用</span><select id="r-enabled" data-zen-select><option value="1">是</option><option value="0">否</option></select></label>
            </div>
            <h3>当（满足全部条件）</h3>
            <div class="zt-row">
              <label class="zt-field"><span>来源</span><select id="w-source" data-zen-select></select></label>
              <label class="zt-field"><span>类型</span><select id="w-kind" data-zen-select></select></label>
            </div>
            <div class="zt-row">
              <label class="zt-field"><span>含标签</span><input id="w-tag" placeholder="留空=不限" /></label>
              <label class="zt-field"><span>正文包含</span><input id="w-text" placeholder="留空=不限" /></label>
            </div>
            <h3>则（依次执行）</h3>
            <div class="list" id="action-list"></div>
            <div class="zt-row tight" style="margin-top:8px">
              <select id="a-type" data-zen-select>
                <option value="addTag">加标签</option><option value="setKind">改类型</option>
                <option value="highlight">高亮</option><option value="send">发送到产品</option>
                <option value="publish">发布到共享空间</option><option value="notify">通知</option>
              </select>
              <input id="a-value" placeholder="参数（标签名/类型/颜色/目标产品/消息）" />
              <button class="zt-btn" id="add-action">添加动作</button>
            </div>
            <div class="zt-row tight" style="margin-top:14px">
              <button class="zt-btn primary" id="save-rule">保存规则</button>
              <button class="zt-btn" id="cancel-edit">取消</button>
            </div>
          </div>
        </section>

        <section class="view" id="view-flow">
          <div class="zt-panel">
            <h2>流程视图</h2>
            <p class="hint">同一批规则的可视化表达：点击任意节点进入右侧编辑器修改。布局直接复用 Writer“所思所想”的通用布局引擎，不在本页重复实现。</p>
            <div class="flow-toolbar">
              <select id="flow-strategy" data-zen-select>
                <option value="smart">智能</option><option value="layered">分层</option>
                <option value="spine">主线</option><option value="force">力导向</option>
                <option value="radial">径向</option><option value="timeline">时间线</option>
              </select>
              <button class="zt-btn" id="flow-relayout">自动排列</button>
              <button class="zt-btn primary" id="flow-new">新建规则</button>
              <span class="muted" id="flow-status"></span>
            </div>
            <div class="flow-canvas" id="flow-canvas"></div>
          </div>
        </section>

        <section class="view" id="view-run">
          <div class="zt-panel">
            <h2>最近一次运行</h2>
            <p class="muted" id="run-summary">尚未运行。</p>
            <div class="list" id="effect-list"></div>
          </div>
        </section>
      </main>
      <footer class="status"><span><i class="dot"></i>ZenFlow · 规则与卡片均存本地</span><span id="status-text"></span></footer>
    </div>

    <script type="module">
      import { ZenCard } from './lib/zen-card.js'
      import { ZenFlow } from './lib/zen-flow.js'

      const RULE_KEY = 'zen.flow.rules.v1'
      const CARD_KEY = 'zen.cards.v1'
      const $ = (id) => document.getElementById(id)
      let rules = []
      let actions = []
      let editingId = null

      function toast(msg) { return window.ZenUI.toast(msg) }
      function load() {
        rules = ZenUtil.getJSON(RULE_KEY, []).map(ZenFlow.createRule)
      }
      function save() { ZenUtil.setJSON(RULE_KEY, rules) }

      function requestHubCards() {
        if (window.parent === window) return Promise.resolve(null)
        return new Promise((resolve) => {
          const token = 'flow-' + Date.now() + '-' + Math.random().toString(16).slice(2, 8)
          let timer = null
          const cleanup = () => {
            if (timer) clearTimeout(timer)
            window.removeEventListener('message', onMessage)
          }
          const onMessage = (event) => {
            if (!ZenUtil.isTrustedParentMessage(event)) return
            const data = event.data
            if (!data || data.type !== 'omm:live-data-reply' || data.token !== token) return
            cleanup()
            const cards = data.data && Array.isArray(data.data.cards) ? data.data.cards : []
            resolve(cards)
          }
          window.addEventListener('message', onMessage)
          timer = setTimeout(() => { cleanup(); resolve(null) }, 2600)
          try {
            window.parent.postMessage({ type: 'omm:live-data-request', token }, ZenUtil.parentTargetOrigin())
          } catch (_) {
            cleanup(); resolve(null)
          }
        })
      }

      function renderRules() {
        const box = $('rule-list')
        $('status-text').textContent = '规则 ' + rules.length + ' 条'
        if (!rules.length) {
          const presets = ZenFlow.templates()
          box.innerHTML = '<div class="empty">还没有规则。去“编辑器”新建一条，或从模板快速开始：</div>' +
            (presets.length ? '<div class="tpl-list">' + presets.map((t, i) =>
              '<button class="zt-btn sm tpl-item" data-tpl="' + i + '">+ ' + esc(t.name) + '</button>').join('') + '</div>' : '')
          box.querySelectorAll('[data-tpl]').forEach((b) => b.addEventListener('click', () => {
            const t = presets[Number(b.dataset.tpl)]
            if (!t || rules.some((r) => r.id === t.id)) return
            rules.push(t); save(); renderRules(); toast('已载入模板：' + t.name)
          }))
          return
        }
        box.innerHTML = rules.map((r) => {
          const conds = Object.keys(r.when).filter((k) => r.when[k]).map((k) => k + '=' + r.when[k]).join(' · ') || '所有卡片'
          return `<div class="item" data-id="${esc(r.id)}">
            <div class="body"><div class="title">${esc(r.name)} <span class="badge ${r.enabled ? 'on' : ''}">${r.enabled ? '启用' : '停用'}</span></div>
              <div class="meta">优先级 ${r.priority} · 当 ${esc(conds)}</div>
              <div class="meta">则 ${r.actions.map((a) => a.type + (a.value || a.to ? '(' + esc(a.value || a.to) + ')' : '')).join(' → ')}</div>
            </div>
            <div class="ops">
              <button class="zt-btn sm" data-act="toggle">${r.enabled ? '停用' : '启用'}</button>
              <button class="zt-btn sm" data-act="edit">编辑</button>
              <button class="zt-btn sm danger" data-act="del">删</button>
            </div></div>`
        }).join('')
        box.querySelectorAll('.item').forEach((el) => {
          const r = rules.find((x) => x.id === el.dataset.id)
          el.querySelector('[data-act="toggle"]').addEventListener('click', () => { r.enabled = !r.enabled; save(); renderRules() })
          el.querySelector('[data-act="edit"]').addEventListener('click', () => editRule(r))
          el.querySelector('[data-act="del"]').addEventListener('click', () => { rules = rules.filter((x) => x.id !== r.id); save(); renderRules() })
        })
      }

      function esc(s) { return ZenUtil.esc(s, { apos: false }) }

      function fillSelects() {
        $('w-source').innerHTML = '<option value="">不限</option>' + ZenCard.SOURCES.map((s) => `<option value="${s}">${s}</option>`).join('')
        $('w-kind').innerHTML = '<option value="">不限</option>' + ZenCard.KINDS.map((s) => `<option value="${s}">${s}</option>`).join('')
      }
      function renderActions() {
        $('action-list').innerHTML = actions.length
          ? actions.map((a, i) => `<div class="item"><div class="body"><span class="badge accent">${a.type}</span> ${esc(a.value || a.to || a.channel || a.message || '')}</div><div class="ops"><button class="zt-btn sm danger" data-i="${i}">删</button></div></div>`).join('')
          : '<div class="empty">暂无动作</div>'
        $('action-list').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { actions.splice(Number(b.dataset.i), 1); renderActions() }))
      }
      function editRule(r) {
        editingId = r.id
        $('editor-title').textContent = '编辑规则'
        $('r-name').value = r.name
        $('r-priority').value = r.priority
        $('r-enabled').value = r.enabled ? '1' : '0'
        $('w-source').value = r.when.source; $('w-kind').value = r.when.kind
        $('w-tag').value = r.when.tag; $('w-text').value = r.when.text
        actions = r.actions.slice()
        renderActions()
        document.querySelector('[data-view="editor"]').click()
      }
      function resetEditor() {
        editingId = null
        $('editor-title').textContent = '新建规则'
        $('r-name').value = ''; $('r-priority').value = '0'; $('r-enabled').value = '1'
        $('w-source').value = ''; $('w-kind').value = ''; $('w-tag').value = ''; $('w-text').value = ''
        $('a-value').value = ''
        actions = []; renderActions()
      }

      /* 流程视图：只把既有规则映射为节点/连线，规则语义仍完全由 ZenFlow 决定。
       * 布局直接调用 Writer 抽出的通用模块，不在本产品重复实现排布算法。 */
      const FLOW_STRATEGY_KEY = 'zen.flow.strategy.v1'

      function flowGraph() {
        const nodes = []; const conns = []
        rules.forEach((r) => {
          const ruleId = 'rule:' + r.id
          const whenId = 'when:' + r.id
          const conds = Object.keys(r.when).filter((k) => r.when[k]).map((k) => k + '=' + r.when[k]).join(' · ') || '所有卡片'
          nodes.push({ id: ruleId, w: 180, h: 78, kind: 'rule', label: r.name,
            sub: '优先级 ' + r.priority + (r.enabled ? '' : ' · 停用'), rule: r, off: !r.enabled })
          nodes.push({ id: whenId, w: 180, h: 68, kind: 'when', label: conds, sub: '当', rule: r })
          conns.push({ from: ruleId, to: whenId, fromPort: 'bottom', toPort: 'top' })
          r.actions.forEach((a, i) => {
            const id = 'act:' + r.id + ':' + i
            const arg = a.value || a.to || a.channel || a.message
            nodes.push({ id, w: 180, h: 60, kind: 'action',
              label: a.type + (arg ? ' · ' + arg : ''), sub: '则 ' + (i + 1), rule: r })
            conns.push({ from: whenId, to: id, fromPort: 'bottom', toPort: 'top' })
          })
        })
        return { nodes, conns }
      }

      function renderFlow() {
        const box = $('flow-canvas'); if (!box) return
        const graph = flowGraph()
        const layout = window.ZenCanvasLayout.computeCanvasLayout(
          graph.nodes, graph.conns, { strategy: $('flow-strategy').value })
        const items = layout.items || []
        const byId = new Map(items.map((it) => [it.id, it]))
        const width = Math.max(600, items.reduce((m, it) => Math.max(m, (it.x || 0) + 200), 0) + 24)
        const height = Math.max(460, items.reduce((m, it) => Math.max(m, (it.y || 0) + 90), 0) + 24)
        box.style.width = width + 'px'; box.style.height = height + 'px'
        box.innerHTML = ''
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.setAttribute('width', width); svg.setAttribute('height', height)
        graph.conns.forEach((c) => {
          const a = byId.get(c.from); const b = byId.get(c.to); if (!a || !b) return
          const x1 = (a.x || 0) + 90; const y1 = (a.y || 0) + 72
          const x2 = (b.x || 0) + 90; const y2 = (b.y || 0)
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + y2)
          p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'var(--line, #999)'); p.setAttribute('stroke-width', '1.5')
          svg.appendChild(p)
        })
        box.appendChild(svg)
        graph.nodes.forEach((n) => {
          const it = byId.get(n.id); if (!it) return
          const el = document.createElement('div')
          el.className = 'flow-node ' + n.kind + (n.off ? ' off' : '')
          el.style.left = (it.x || 0) + 'px'; el.style.top = (it.y || 0) + 'px'
          el.title = '点击进入编辑器修改该规则'
          el.innerHTML = '<div class="fk">' + esc(n.sub || n.kind) + '</div><div class="ft">' + esc(n.label) + '</div>'
          el.addEventListener('click', () => editRule(n.rule))
          box.appendChild(el)
        })
        $('flow-status').textContent = rules.length + ' 条规则 · ' + graph.nodes.length + ' 个节点 · ' + graph.conns.length + ' 条连线'
      }

      function bind() {
        $('tabs').addEventListener('zen:tab', (e) => {
          document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + e.detail.id))
        })
        $('tabs').addEventListener('click', (e) => {
          // tab 状态由共享 ZenUI.tabs 维护；这里只处理本产品业务
          const b = e.target.closest('button[data-view]'); if (!b) return
          if (b.dataset.view === 'flow') renderFlow()
        })
        $('flow-relayout').addEventListener('click', renderFlow)
        $('flow-strategy').addEventListener('change', (e) => {
          localStorage.setItem(FLOW_STRATEGY_KEY, e.target.value); renderFlow()
        })
        $('flow-new').addEventListener('click', () => {
          resetEditor(); document.querySelector('[data-view="editor"]').click()
        })
        $('theme-btn').addEventListener('click', () => ZenUtil.themeToggle())
        $('add-action').addEventListener('click', () => {
          const type = $('a-type').value
          const value = $('a-value').value.trim()
          const a = { type }
          if (type === 'send') a.to = value || 'writer'
          else if (type === 'publish') a.channel = value || 'auto'
          else if (type === 'notify') a.message = value
          else a.value = value
          actions.push(a); $('a-value').value = ''; renderActions()
        })
        $('save-rule').addEventListener('click', () => {
          const data = {
            id: editingId || undefined, name: $('r-name').value.trim(),
            priority: Number($('r-priority').value) || 0, enabled: $('r-enabled').value === '1',
            when: { source: $('w-source').value, kind: $('w-kind').value, tag: $('w-tag').value.trim(), text: $('w-text').value.trim() },
            actions,
          }
          const rule = ZenFlow.createRule(data)
          const check = ZenFlow.validateRule(rule)
          if (!check.ok) { toast(check.errors[0]); return }
          if (editingId) rules = rules.map((r) => (r.id === editingId ? rule : r))
          else rules.push(rule)
          save(); resetEditor(); renderRules(); toast('规则已保存')
          document.querySelector('[data-view="rules"]').click()
        })
        $('cancel-edit').addEventListener('click', () => { resetEditor(); document.querySelector('[data-view="rules"]').click() })
        $('run-btn').addEventListener('click', async () => {
          const embedded = window.parent !== window
          const runBtn = $('run-btn')
          runBtn.disabled = true
          try {
            const source = embedded ? await requestHubCards() : ZenUtil.getJSON(CARD_KEY, [])
            if (source === null) { toast('工作台未响应，请重试'); return }
            const cards = Array.isArray(source) ? source.map(ZenCard.create) : []
            if (!cards.length) { toast('卡片库为空，先去 ZenCard 添加'); return }
            const out = ZenFlow.run(rules, cards, { now: Date.now() })
            if (embedded) {
              const changed = out.cards.filter((card, index) => JSON.stringify(card) !== JSON.stringify(cards[index]))
              if (changed.length) {
                if (!window.OMMShare?.send) { toast('共享桥不可用，规则结果未保存'); return }
                const saved = await Promise.all(changed.map((card) =>
                  window.OMMShare.send({ to: 'zencard', format: 'zen-card', payload: card })
                    .then(() => true).catch(() => false)))
                const failedWrites = saved.filter((ok) => !ok).length
                if (failedWrites) { toast(`${failedWrites} 张卡片写回失败，规则结果未完整保存`, 'error'); return }
              }
            } else if (!ZenUtil.setJSON(CARD_KEY, out.cards)) {
              toast('卡片库写入失败，规则结果未保存', 'error'); return
            }
            $('run-summary').textContent = `处理 ${out.cards.length} 张卡片，触发 ${out.fired.length} 条规则，产生 ${out.effects.length} 个动作。`
            $('effect-list').innerHTML = out.effects.length
              ? out.effects.map((e) => `<div class="item"><div class="body"><div class="title">${esc(e.type)}</div><div class="meta">${esc(e.to || e.channel || e.message || e.card && e.card.content)} · ${new Date(e.at).toLocaleString()}</div></div></div>`).join('')
              : '<div class="empty">没有产生动作</div>'
            document.querySelector('[data-view="run"]').click()
            const deliveries = out.effects.filter((e) => e.type === 'send' || e.type === 'publish')
            const results = await Promise.all(deliveries.map(async (e) => {
              try {
                if (e.type === 'send') {
                  if (!window.OMMShare?.send) throw new Error('共享桥不可用')
                  await window.OMMShare.send({ to: e.to, format: 'zen-card', payload: e.card })
                } else {
                  if (!window.OMMShare?.publishRecord) throw new Error('共享桥不可用')
                  await window.OMMShare.publishRecord(e.card, { channel: e.channel, format: 'zen-card' })
                }
                return true
              } catch (_) { return false }
            }))
            const failed = results.filter((ok) => !ok).length
            toast(failed ? `规则已运行，${failed} 个发送动作失败` : '运行完成', failed ? 'error' : undefined)
          } catch (_) {
            toast('规则运行失败，请检查存储或共享连接', 'error')
          } finally {
            runBtn.disabled = false
          }
        })
        $('export-btn').addEventListener('click', () => {
          ZenUtil.download('zen-flow.json', ZenFlow.serialize(rules), 'application/json')
        })
        $('import-file').addEventListener('change', async (e) => {
          const f = e.target.files[0]; if (!f) return
          try { const incoming = ZenFlow.deserialize(await f.text()); rules = incoming; save(); renderRules(); toast('已导入 ' + incoming.length + ' 条规则') }
          catch (err) { toast('导入失败：' + err.message) }
        })
      }

      ZenUtil.themeInit()
      $('flow-strategy').value = localStorage.getItem(FLOW_STRATEGY_KEY) || 'smart'
      load(); fillSelects(); renderActions(); resetEditor(); bind(); renderRules()
    </script>
  </body>
</html>
