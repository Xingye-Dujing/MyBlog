<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="omm-embed.js"></script>
    <script src="omm-desktop.js"></script>
    <script src="omm-share.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>表格自动化</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="zen-style/zen.css" />
    <link rel="stylesheet" href="zen-style/products/table.css" />
    <link rel="stylesheet" href="vendor/fonts/literata-alt.css" />
    <!-- 画布交互由 zen-canvas 提供，画布样式已并入 zen-style 的共享 feature 层 -->
  </head>
  <body>
    <div id="app">
      <header class="top-menu">
        <div class="menu-group">
          <span class="menu-label">TableFlow</span>
          <span style="font-size: 11px; letter-spacing: 0.5px">表格自动化</span>
        </div>
        <div class="menu-group"><span class="badge" id="runtime-badge">后端检测中</span></div>
        <div class="menu-group">
          <button class="menu-btn" id="btn-theme" aria-label="切换亮暗主题">主题</button>
          <button class="menu-btn" id="btn-upload" aria-label="导入 Excel">导入 Excel</button>
          <button class="menu-btn" id="btn-template" aria-label="示例工作流">示例工作流</button>
        </div>
        <div class="menu-group">
          <button class="menu-btn" id="btn-open" aria-label="打开工作流">打开</button>
          <button class="menu-btn" id="btn-save" aria-label="导出工作流">保存</button>
          <button class="menu-btn" id="btn-ai" aria-label="发送 AI 工作区">发送 AI 工作区</button>
        </div>
        <div class="spacer"></div>
        <div class="menu-group"><span class="menu-label">OMM-ZEN</span></div>
      </header>

      <div class="workspace-body">
        <aside class="palette">
          <div class="pane-head"><span>节点库</span><span class="faint">点击 / 拖入</span></div>
          <div class="pane-body" id="palette-body"></div>
        </aside>

        <section class="stage" id="stage">
          <div class="stage-tools">
            <button class="menu-btn toggle-on" id="btn-dry" title="只计算不写文件，列出冲突">试运行</button>
            <button class="menu-btn" id="btn-run" title="正式运行并写出文件">运行</button>
            <button class="menu-btn" id="btn-stop" disabled>停止</button>
            <div class="sep"></div>
            <button class="menu-btn" id="btn-layout">自动排布</button>
            <button class="menu-btn" id="btn-fit">适应</button>
            <button class="menu-btn" id="btn-clear">清空</button>
            <div class="spacer"></div>
            <select id="strategy" title="自动排布策略" aria-label="自动排布策略">
              <option value="smart">smart 智能</option>
              <option value="layered">layered 分层</option>
              <option value="spine">spine 主线</option>
              <option value="force">force 力导向</option>
              <option value="radial">radial 径向</option>
              <option value="timeline">timeline 时间线</option>
            </select>
            <button class="menu-btn" id="btn-help">用法</button>
          </div>
          <div id="canvas-host"></div>
          <div class="stage-hint">右键拖动平移 · 滚轮缩放 · 从端口拉线连接 · Delete 删除 · Ctrl+Z 撤销</div>
        </section>

        <aside class="inspector">
          <div class="pane-head"><span>节点设置</span><span class="faint" id="inspect-kind">未选中</span></div>
          <div class="pane-body" id="inspector-body">
            <div class="empty">选中一个节点后在这里设置参数。<br />所有参数都有默认值，直接运行也可以。</div>
          </div>
          <div class="pane-head"><span>数据 / 结果</span><span class="faint" id="result-state">待命</span></div>
          <div class="pane-body" id="result-body">
            <div class="empty">上传 Excel 后可预览区域；运行后这里显示节点结果与产物。</div>
          </div>
        </aside>
      </div>

      <footer id="status-bar">
        <span><span class="dot"></span><span id="stat-runtime">openpyxl 检测中</span></span>
        <span id="stat-job">任务：无</span>
        <span id="stat-progress">进度：—</span>
        <span class="spacer"></span>
        <span id="stat-nodes">节点 0 · 连线 0</span>
      </footer>
    </div>

    <div class="modal" id="preview-modal">
      <div class="box">
        <div class="box-head"><span id="preview-title">用法</span><button class="menu-btn" id="preview-close">关闭</button></div>
        <div id="preview-content" class="zt-help"></div>
      </div>
    </div>
    <div id="toast"></div>
    <input type="file" id="file-input" accept=".xlsx,.xlsm" hidden />

    <script src="zen-canvas/layout-engine.js"></script>
    <script src="zen-canvas/zen-canvas.js"></script>
    <script src="zen-table.js"></script>
  </body>
</html>
